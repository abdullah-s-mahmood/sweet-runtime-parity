name: Phase 2 M1-A Expert-Grounded Bootstrap v1.1

on:
  workflow_dispatch:
  push:
    branches:
      - phase2-arabic-eval
    paths:
      - "phase2/redesign/m1a_build_expert_bootstrap_v11.py"
      - "phase2/redesign/M1A_EXPERT_GROUNDED_PROTOCOL_V11.md"
      - "phase2/redesign/M1A_EXPERT_SOURCE_REGISTRY.json"
      - ".github/workflows/phase2-m1a-expert-bootstrap-v11.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-arabic-eval

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Download pinned allowed QALB14 TRAIN DEV and ZAEBUC TRAIN only
        run: |
          set -euo pipefail
          REV="8c7fb84f3ed84d1d30beb7080b02d0f6bfe1c5bf"
          BASE="https://raw.githubusercontent.com/CAMeL-Lab/arabic-gec/$REV"
          QBASE="$BASE/data/gec/QALB-0.9.1-Dec03-2021-SharedTasks/data/2014"
          for SPLIT in train dev; do
            if [ "$SPLIT" = "train" ]; then P="QALB-2014-L1-Train"; else P="QALB-2014-L1-Dev"; fi
            D="upstream/qalb14/$SPLIT"; mkdir -p "$D"
            for F in "$P.sent.no_ids" "$P.cor.no_ids" "$P.m2"; do
              curl -fsSL "$QBASE/$SPLIT/$F" -o "$D/$F"; test -s "$D/$F"
            done
          done
          ZD="upstream/zaebuc/train"; mkdir -p "$ZD"
          curl -fsSL "$BASE/data/gec/ZAEBUC-v1.0/data/ar/train/train.sent.raw" -o "$ZD/train.sent.raw"
          curl -fsSL "$BASE/data/gec/ZAEBUC-v1.0/data/ar/train/train.sent.cor" -o "$ZD/train.sent.cor"
          test -s "$ZD/train.sent.raw"; test -s "$ZD/train.sent.cor"
          test ! -e upstream/qalb14/test
          test ! -e upstream/qalb15
          test ! -e upstream/zaebuc/dev
          test ! -e upstream/zaebuc/test

      - name: Clone pinned A7ta expert-book corpus
        run: |
          set -euo pipefail
          git clone -q https://github.com/iwan-rg/A-Monolingual-Arabic-Parallel-Corpus-.git upstream/a7ta
          cd upstream/a7ta
          git checkout -q 6e3acf8b38e159391131eaa448a55f0124e603f2
          test "$(git rev-parse HEAD)" = "6e3acf8b38e159391131eaa448a55f0124e603f2"

      - name: Build v1.1 expert-grounded bootstrap
        run: |
          set -euo pipefail
          python phase2/redesign/m1a_build_expert_bootstrap_v11.py             --qalb-root upstream/qalb14             --zaebuc-root upstream/zaebuc/train             --a7ta-root upstream/a7ta             --out-dir .

      - name: Safety audit
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          paths=[Path("M1A_V11_EXPERT_BOOTSTRAP_SUMMARY.json"),Path("M1A_V11_EXPERT_BOOTSTRAP_HASHED.jsonl")]
          for p in paths:
              s=p.read_text(encoding="utf-8")
              assert not re.search(r"[\u0600-\u06ff]",s), p
              assert "QALB-2015" not in s
          j=json.load(open(paths[0],encoding="utf-8"))
          assert j["data_ready"] is True
          assert not any(j["forbidden_data"].values())
          print("M1-A v1.1 safety audit PASS")
          PY

      - name: Persist safe results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add M1A_V11_EXPERT_BOOTSTRAP_SUMMARY.json M1A_V11_EXPERT_BOOTSTRAP_HASHED.jsonl
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Record M1-A v1.1 multi-source expert bootstrap [skip ci]"
            git pull --rebase origin phase2-arabic-eval
            git push origin HEAD:phase2-arabic-eval
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: m1a-v11-expert-bootstrap-safe
          path: |
            M1A_V11_EXPERT_BOOTSTRAP_SUMMARY.json
            M1A_V11_EXPERT_BOOTSTRAP_HASHED.jsonl
          if-no-files-found: error
          retention-days: 30
