name: AT0 EN V2.6 R4.3 Stage-B mechanics

on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/r43_stage_b_mechanics_trigger_v1.txt'

permissions:
  contents: read

jobs:
  mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: at0-en-v2.6-dev
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install mechanics runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet             numpy==1.26.4 torch==2.2.2 transformers==4.39.3 safetensors==0.4.3
      - name: Static compile
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             phase2/academic_transform/at0_en/v2_6/r43_stage_b_h0_h1_diagnostic.py
      - name: Run H0/H1 mechanics only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r43"
          python phase2/academic_transform/at0_en/v2_6/r43_stage_b_h0_h1_diagnostic.py             --mechanics-only | tee "$RUNNER_TEMP/r43/R43_STAGE_B_MECHANICS.json"
      - name: Freeze identity
        shell: bash
        run: |
          set -euo pipefail
          sha256sum phase2/academic_transform/at0_en/v2_6/r43_stage_b_h0_h1_diagnostic.py             > "$RUNNER_TEMP/r43/MECHANICS_SHA256.txt"
          sha256sum "$RUNNER_TEMP/r43/R43_STAGE_B_MECHANICS.json" >> "$RUNNER_TEMP/r43/MECHANICS_SHA256.txt"
      - name: Upload mechanics evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: at0-en-v2-6-r43-stage-b-mechanics
          path: ${{ runner.temp }}/r43
          if-no-files-found: error
          retention-days: 90
