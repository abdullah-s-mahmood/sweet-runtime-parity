name: Phase 2 MP-SEF P1 C_F Source-Only Proposals v1

on:
  workflow_dispatch:
  push:
    branches:
      - phase2-arabic-eval
    paths:
      - ".github/workflows/phase2-mpsef-p1-cf-proposals-v1.yml"
      - "phase2/redesign/mpsef_build_cf_source_manifest_v1.py"
      - "phase2/redesign/mpsef_p1_cf_proposals_v1.py"

permissions:
  contents: read
  actions: read

jobs:
  p1-cf-proposals:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-arabic-eval

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install frozen P1 stack
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==1.12.1+cpu"
          python -m pip install "transformers==4.30.0" "huggingface_hub==0.16.4" "sentencepiece==0.1.99"
          python -m pip install "numpy==1.23.5" "pandas==1.5.3" "pyarrow==14.0.2" "datasets==2.14.7" "editdistance==0.8.1"

      - name: Clone frozen text-editing implementation
        run: |
          git clone https://github.com/CAMeL-Lab/text-editing.git upstream/text-editing
          git -C upstream/text-editing checkout 4d552ca3ae98029550f27fc52aa1b22883e16e61
          test "$(git -C upstream/text-editing rev-parse HEAD)" = "4d552ca3ae98029550f27fc52aa1b22883e16e61"

      - name: Download frozen P1 model revision
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          rev="21286e56ce98a86362db540863f91c083b8970f9"
          snapshot_download(
              repo_id="CAMeL-Lab/text-editing-qalb14-nopnx",
              revision=rev,
              local_dir="p1_model",
              local_dir_use_symlinks=False,
          )
          PY
          test "$(sha256sum p1_model/pytorch_model.bin | awk '{print $1}')" = "9324bd3e8bcbfd5a45d5562979cccd4279f0a7946c25a13abb10aba9cc42364d"

      - name: Download frozen CALIBRATION
        uses: actions/download-artifact@v4
        with:
          name: m2h-calibration-v1
          path: calibration_artifact
          repository: abdullah-s-mahmood/sweet-runtime-parity
          run-id: 36654588477
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download frozen future role split
        uses: actions/download-artifact@v4
        with:
          name: mpsef-role-split-v1
          path: role_artifact
          repository: abdullah-s-mahmood/sweet-runtime-parity
          run-id: 36762615920
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate frozen role split
        run: |
          python - <<'PY'
          import json
          s=json.load(open("role_artifact/MPSEF_ROLE_SPLIT_V1_SUMMARY.json",encoding="utf-8"))
          assert s["status"]=="PASS"
          assert s["cases"]==6888
          assert s["roles_records"]["C_F"]==1918
          assert s["roles_clusters"]["C_F"]==764
          assert s["uid_role_cluster_sha256"]=="85a5dcb1b26a9773ea0ef7e04bb42e8e56dde5d44f1e63fcbe54141dbcb47dfc"
          assert s["integrity"]["feasibility_metric_computed"] is False
          print("FROZEN_ROLE_SPLIT_OK")
          PY

      - name: Materialize source-only C_F manifest and protected map
        run: |
          python phase2/redesign/mpsef_build_cf_source_manifest_v1.py \
            --calibration calibration_artifact/M2H_CALIBRATION_V1.jsonl \
            --roles role_artifact/MPSEF_ROLE_SPLIT_V1.jsonl \
            --out-prefix MPSEF_CF_SOURCE_MANIFEST_V1

      - name: Validate source-only C_F manifest
        run: |
          python - <<'PY'
          import json
          rows=[json.loads(x) for x in open("MPSEF_CF_SOURCE_MANIFEST_V1.jsonl",encoding="utf-8") if x.strip()]
          s=json.load(open("MPSEF_CF_SOURCE_MANIFEST_V1_SUMMARY.json",encoding="utf-8"))
          assert len(rows)==1918==s["cases"]
          assert len({x["cluster_id"] for x in rows})==764==s["clusters"]
          assert all(x["role"]=="C_F" for x in rows)
          forbidden={"reference","gold","edits","operations","corrected","target"}
          assert not any(forbidden & set(x.keys()) for x in rows)
          assert s["reference_content_used"] is False
          assert s["gold_edit_content_used"] is False
          assert s["feasibility_metric_computed"] is False
          print("CF_SOURCE_ONLY_MANIFEST_OK")
          PY

      - name: Run frozen P1 source-only proposals
        env:
          PYTHONUNBUFFERED: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python phase2/redesign/mpsef_p1_cf_proposals_v1.py \
            --source-manifest MPSEF_CF_SOURCE_MANIFEST_V1.jsonl \
            --model-dir p1_model \
            --upstream-root upstream/text-editing \
            --batch-size 32 \
            --preflight-n 64 \
            --out-prefix MPSEF_P1_CF_PROPOSALS_V1

      - name: Validate P1 proposal artifact
        run: |
          python - <<'PY'
          import json
          s=json.load(open("MPSEF_P1_CF_PROPOSALS_V1_SUMMARY.json",encoding="utf-8"))
          assert s["status"]=="PREMEASUREMENT_PROPOSALS_READY"
          assert s["cases"]==1918
          assert s["clusters"]==764
          assert s["batch_single_parity_n"]==64
          assert s["batch_single_parity_match"]==64
          assert s["gold_reference_consulted"] is False
          assert s["reference_content_used"] is False
          assert s["feasibility_metric_computed"] is False
          assert s["r_joint_computed"] is False
          assert s["selector_trained"] is False
          assert s["internal_evaluation_opened"] is False
          assert s["stress_diagnostic_opened"] is False
          assert s["reserved_data_opened"] is False
          print("P1_CF_PREMEASUREMENT_PROPOSALS_OK")
          PY

      - name: Record environment and frozen hashes
        if: always()
        run: |
          python -m pip freeze > MPSEF_P1_CF_PROPOSALS_V1_PIP_FREEZE.txt
          sha256sum \
            phase2/redesign/mpsef_build_cf_source_manifest_v1.py \
            phase2/redesign/mpsef_p1_cf_proposals_v1.py \
            .github/workflows/phase2-mpsef-p1-cf-proposals-v1.yml \
            MPSEF_CF_SOURCE_MANIFEST_V1.jsonl \
            MPSEF_CF_SOURCE_MANIFEST_V1_SUMMARY.json \
            MPSEF_P1_CF_PROPOSALS_V1.jsonl \
            MPSEF_P1_CF_PROPOSALS_V1_SUMMARY.json \
            MPSEF_P1_CF_PROPOSALS_V1_PIP_FREEZE.txt \
            > MPSEF_P1_CF_PROPOSALS_V1_SHA256.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mpsef-p1-cf-proposals-v1
          path: |
            MPSEF_CF_SOURCE_MANIFEST_V1.jsonl
            MPSEF_CF_SOURCE_MANIFEST_V1_SUMMARY.json
            MPSEF_P1_CF_PROPOSALS_V1.jsonl
            MPSEF_P1_CF_PROPOSALS_V1_SUMMARY.json
            MPSEF_P1_CF_PROPOSALS_V1_PIP_FREEZE.txt
            MPSEF_P1_CF_PROPOSALS_V1_SHA256.txt
          if-no-files-found: warn
          retention-days: 90
