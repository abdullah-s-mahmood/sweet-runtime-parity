name: AT0 EN V2.6 R4.2 ONE witness train calibration

on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - 'phase2/academic_transform/at0_en/v2_6/R4_2_TRAIN_TRIGGER_V3.txt'

permissions:
  contents: read

concurrency:
  group: at0-en-v2-6-r4-2-one-train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: at0-en-v2.6-dev
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet \
            numpy==1.26.4 \
            torch==2.2.2 \
            transformers==4.39.3 \
            accelerate==0.28.0 \
            seqeval==1.2.2 \
            safetensors==0.4.3 \
            huggingface_hub==0.25.2 \
            jax==0.4.25 \
            jaxlib==0.4.25 \
            flax==0.8.2

      - name: Acquire and verify frozen safe model and train/dev data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r42/model" "$RUNNER_TEMP/r42/data"
          python - <<'PY'
          import hashlib, os, pathlib, urllib.request
          from huggingface_hub import snapshot_download

          model_id="microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract"
          revision="d673b8835373c6fa116d6d8006b33d48734e305d"
          files={
            "flax_model.msgpack":"2048c0dca92fe54cf2bec6c36972511ca04e546060307098139b19221dd4e93f",
            "config.json":"56bab767c02bc792897638feb8addc06d483d9c73769a5f554bbabea1f5507a1",
            "tokenizer_config.json":"53b6f42b8b8daddbdc6d3532c324187a92b46c1602bd6e8d4ad5a413b4fc90e1",
            "vocab.txt":"7b36651908a88bc38bda41b728b2a598191e0d3b553cbacf7b1e5f026d5b5b9f",
            "LICENSE.md":"8542b3a65414366ae3228e8f1658e538ec95f9b8855599c9c6e36751d592be66",
          }
          root=pathlib.Path(snapshot_download(
              repo_id=model_id, revision=revision, allow_patterns=list(files),
              local_dir=os.path.join(os.environ["RUNNER_TEMP"],"r42","model"),
              local_dir_use_symlinks=False,
          ))
          def sha(raw): return hashlib.sha256(raw).hexdigest()
          for name,expected in files.items():
              raw=(root/name).read_bytes()
              if sha(raw)!=expected:
                  raise SystemExit(f"model hash mismatch {name}")
          if (root/"pytorch_model.bin").exists():
              raise SystemExit("pickle model forbidden")

          repo="BIDS-Xu-Lab/section_specific_annotation_of_PICO"
          commit="bc4b878773192f38b2600ec830ca4208b82f7dc0"
          data=[
            ("train.txt","data/EBM-NLPmod/fold1/train.txt","6491a57e5c8639e5bfc3c0326b8501869fccab655a1ed571b75a772dc1c70a5e"),
            ("dev.txt","data/EBM-NLPmod/fold1/dev.txt","3b12534fedec35660587e6a5084b0b8ff11267c1da4a2f5afe9aa16c4941340a"),
          ]
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"r42"/"data"
          for local,path,expected in data:
              raw=urllib.request.urlopen(f"https://raw.githubusercontent.com/{repo}/{commit}/{path}",timeout=30).read()
              if sha(raw)!=expected:
                  raise SystemExit(f"dataset hash mismatch {local}")
              (out/local).write_bytes(raw)
          PY

      - name: Freeze runtime and trainer identity before training
        shell: bash
        run: |
          set -euo pipefail
          python -V > "$RUNNER_TEMP/r42/RUNTIME.txt"
          python -m pip freeze | sort >> "$RUNNER_TEMP/r42/RUNTIME.txt"
          sha256sum phase2/academic_transform/at0_en/v2_6/r4_2_train_calibrate_witness.py \
            > "$RUNNER_TEMP/r42/TRAINER_SHA256.txt"

      - name: Train and calibrate witness offline
        shell: bash
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          TOKENIZERS_PARALLELISM: "false"
          PYTHONHASHSEED: "20261005"
        run: |
          set -euo pipefail
          python phase2/academic_transform/at0_en/v2_6/r4_2_train_calibrate_witness.py \
            --model-dir "$RUNNER_TEMP/r42/model" \
            --train "$RUNNER_TEMP/r42/data/train.txt" \
            --dev "$RUNNER_TEMP/r42/data/dev.txt" \
            --out "$RUNNER_TEMP/r42/out" \
            > "$RUNNER_TEMP/r42/TRAIN_STDOUT.json"

      - name: Hash frozen training outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/r42/out" ]; then
            find "$RUNNER_TEMP/r42/out" -type f -print0 | sort -z | xargs -0 sha256sum \
              > "$RUNNER_TEMP/r42/OUTPUT_SHA256.txt" || true
          fi

      - name: Upload training/calibration freeze
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: at0-en-v2-6-r4-2-one-train-calibration
          path: |
            ${{ runner.temp }}/r42/RUNTIME.txt
            ${{ runner.temp }}/r42/TRAINER_SHA256.txt
            ${{ runner.temp }}/r42/TRAIN_STDOUT.json
            ${{ runner.temp }}/r42/OUTPUT_SHA256.txt
            ${{ runner.temp }}/r42/out/R4_2_TRAIN_CALIBRATION_SUMMARY.json
            ${{ runner.temp }}/r42/out/selected_model
          if-no-files-found: warn
          retention-days: 90
