name: Federation runtime model identity preflight

on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/federation_runtime_identity_trigger.txt'

permissions:
  contents: read

concurrency:
  group: federation-runtime-identity
  cancel-in-progress: false

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: requirements/federation_runtime.txt
      - name: Install frozen runtime
        run: |
          python -m pip install --disable-pip-version-check --quiet -r requirements/federation_runtime.txt
          python -m pip check
      - name: Verify pinned configs and tokenizers
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime"
          python phase2/academic_transform/at0_en/v2_6/federation_runtime_identity.py             --out "$RUNNER_TEMP/runtime/FEDERATION_RUNTIME_MODEL_IDENTITY_PREFLIGHT.json"
          sha256sum requirements/federation_runtime.txt             phase2/academic_transform/at0_en/v2_6/federation_runtime_identity.py             > "$RUNNER_TEMP/runtime/SOURCE_SHA256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: federation-runtime-model-identity-preflight
          path: ${{ runner.temp }}/runtime
          if-no-files-found: error
          retention-days: 90
