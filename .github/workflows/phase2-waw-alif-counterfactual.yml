name: Phase 2 WAW-ALIF Counterfactual Verifier

on:
  workflow_dispatch:
  push:
    branches:
      - phase2-arabic-eval
    paths:
      - "phase2/generalization/WAW_ALIF_COUNTERFACTUAL_CHALLENGE.jsonl"
      - "phase2/generalization/run_waw_alif_counterfactual.py"
      - ".github/workflows/phase2-waw-alif-counterfactual.yml"

permissions:
  contents: write

jobs:
  counterfactual:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CAMELTOOLS_DATA: ${{ github.workspace }}/.camel_tools
      HF_HUB_DISABLE_TELEMETRY: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-arabic-eval
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install CAMeL runtime
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==1.11.0+cpu"
          python -m pip install "camel-tools==1.4.1" "cachetools==4.2.4" "protobuf==3.20.3" "numpy<2"
          mkdir -p "$CAMELTOOLS_DATA"
          camel_data -i morphology-db-msa-r13
          camel_data -i disambig-bert-unfactored-msa

      - name: Run counterfactual verifier
        run: |
          PYTHONPATH=. python phase2/generalization/run_waw_alif_counterfactual.py
          test -f PHASE2_WAW_ALIF_COUNTERFACTUAL_RESULTS.json

      - name: Persist verifier evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PHASE2_WAW_ALIF_COUNTERFACTUAL_RESULTS.json
          if git diff --cached --quiet; then
            echo unchanged
          else
            git commit -m "Record WAW-alif counterfactual verifier evidence [skip ci]"
            git pull --rebase origin phase2-arabic-eval
            git push origin HEAD:phase2-arabic-eval
          fi
