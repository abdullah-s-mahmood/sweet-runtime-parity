name: Phase 2 M2-R v2 QALB Complete-Gold Feasibility
on:
  workflow_dispatch:
  push:
    branches: [phase2-arabic-eval]
    paths:
      - "phase2/redesign/m2r_v2_data_feasibility.py"
      - "phase2/redesign/M2R_V2_RESEARCH_START.md"
      - ".github/workflows/phase2-m2r-v2-data-feasibility.yml"
permissions:
  contents: write
jobs:
  feasibility:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-arabic-eval
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python phase2/redesign/m2r_v2_data_feasibility.py
      - name: Persist safe summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add M2R_V2_DATA_FEASIBILITY_SUMMARY.json
          git commit -m "Record M2-R v2 QALB complete-gold feasibility [skip ci]"
          git pull --rebase origin phase2-arabic-eval
          git push origin HEAD:phase2-arabic-eval
      - uses: actions/upload-artifact@v4
        with:
          name: m2r-v2-data-feasibility
          path: M2R_V2_DATA_FEASIBILITY_SUMMARY.json
          retention-days: 30
