name: Phase 2 MP-SEF P3 V1 Stage2 Production-Bound Parity32

on:
  push:
    branches: [phase2-arabic-eval]
    paths:
      - "phase2/redesign/mpsef_p3_v1_stage2_production_adapter_v1.py"
      - "phase2/redesign/mpsef_p3_v1_stage2_build_parity32_input_v1.py"
      - "phase2/redesign/mpsef_p3_v1_stage2_production_bound_parity32_v1.py"
      - "phase2/redesign/mpsef_stageb_change_domain_classifier_v1.py"
      - "phase2/redesign/run_with_progress_watchdog_v2.py"
      - ".github/workflows/phase2-mpsef-p3-v1-stage2-production-bound-parity32.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  p3-parity32:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Download frozen Parity32 manifest
        uses: actions/download-artifact@v4
        with:
          name: mpsef-v4-stage1-parity32-manifest-v1
          path: parity32
          repository: abdullah-s-mahmood/sweet-runtime-parity
          run-id: 36878829104
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download frozen P1 proposals
        uses: actions/download-artifact@v4
        with:
          name: mpsef-p1-cf-proposals-v1
          path: p1
          repository: abdullah-s-mahmood/sweet-runtime-parity
          run-id: 36765798233
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download frozen P3 Stage1 proposals
        uses: actions/download-artifact@v4
        with:
          name: mpsef-p3-v1-stage1-v1
          path: p3
          repository: abdullah-s-mahmood/sweet-runtime-parity
          run-id: 36877195995
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify frozen identities
        run: |
          set -euo pipefail
          test "$(sha256sum parity32/MPSEF_V4_STAGE1_PARITY32_MANIFEST_V1.jsonl | awk '{print $1}')" = "384f1a6d08f79c6a9d73dc4298f1a1fac245d9f43bed2e77a5395cc1a2f4711e"
          test "$(sha256sum p1/MPSEF_P1_CF_PROPOSALS_V1.jsonl | awk '{print $1}')" = "2ff2ff6ed837e902eeea93856ce4753966e9ecec6b497b681ecc185b260e300d"
          test "$(sha256sum p3/MPSEF_P3_V1_STAGE1_V1.jsonl | awk '{print $1}')" = "69720287154071611a0e0d0af2a6689ef6ed5242acf374fb945de70013a16083"

      - name: Build exact P3 Parity32 production inputs
        run: |
          set -euo pipefail
          python phase2/redesign/mpsef_p3_v1_stage2_build_parity32_input_v1.py             --manifest parity32/MPSEF_V4_STAGE1_PARITY32_MANIFEST_V1.jsonl             --p1-proposals p1/MPSEF_P1_CF_PROPOSALS_V1.jsonl             --ordered-out P3_STAGE2_PARITY32_INPUT.jsonl             --reversed-out P3_STAGE2_PARITY32_INPUT_REVERSED.jsonl             | tee P3_STAGE2_PARITY32_INPUT_BUILD.log
          cp P3_STAGE2_PARITY32_INPUT.jsonl P3_STAGE2_PARITY32_INPUT_REPEAT.jsonl
          cp P3_STAGE2_PARITY32_INPUT.jsonl P3_STAGE2_PARITY32_INPUT_SINGLE.jsonl

      - name: Install frozen SWEET/Pnx runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip<25"
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==1.12.1+cpu"
          python -m pip install "transformers==4.30.0" "huggingface_hub==0.16.4" "sentencepiece==0.1.99"
          python -m pip install "numpy==1.23.5" "pandas==1.5.3" "pyarrow==14.0.2" "datasets==2.14.7" "editdistance==0.8.1"

      - name: Clone frozen text-editing implementation
        run: |
          set -euo pipefail
          git clone https://github.com/CAMeL-Lab/text-editing.git upstream/text-editing
          git -C upstream/text-editing checkout 4d552ca3ae98029550f27fc52aa1b22883e16e61
          test "$(git -C upstream/text-editing rev-parse HEAD)" = "4d552ca3ae98029550f27fc52aa1b22883e16e61"

      - name: Download exact frozen Pnx revision
        run: |
          set -euo pipefail
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="CAMeL-Lab/text-editing-qalb14-pnx",
              revision="a162d77269ab6ff556d2c58c5dff8b967c1f649e",
              local_dir="pnx_model",
              local_dir_use_symlinks=False,
          )
          PY
          test "$(sha256sum pnx_model/pytorch_model.bin | awk '{print $1}')" = "d98d683f9ef1738c27f5031c99483d93e9f73c4116c158a97a678270c84fd262"

      - name: Run SINGLE-CASE invocation through production CLI
        env:
          TOKENIZERS_PARALLELISM: "false"
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IN_SHA="$(sha256sum P3_STAGE2_PARITY32_INPUT_SINGLE.jsonl | awk '{print $1}')"
          python phase2/redesign/run_with_progress_watchdog_v2.py             --state-file P3_SINGLE_PROGRESS.json             --watchdog-state-file P3_SINGLE_WATCHDOG.json             --context "acad-pass/p3-stage2-parity32-single"             --poll-seconds 5 --publish-seconds 60 --stale-seconds 600             --term-grace-seconds 30 --kill-on-stale --             python phase2/redesign/mpsef_p3_v1_stage2_production_adapter_v1.py               --input-jsonl P3_STAGE2_PARITY32_INPUT_SINGLE.jsonl               --expected-count 32 --expected-input-sha256 "$IN_SHA"               --p1-proposals p1/MPSEF_P1_CF_PROPOSALS_V1.jsonl               --pnx-model-dir pnx_model --upstream-root upstream/text-editing               --batch-size 1               --out-jsonl P3_SINGLE.jsonl               --run-state P3_SINGLE_RUN_STATE.json               --progress-state P3_SINGLE_PROGRESS.json               --summary P3_SINGLE_SUMMARY.json

      - name: Run BATCH32 through production CLI
        env:
          TOKENIZERS_PARALLELISM: "false"
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IN_SHA="$(sha256sum P3_STAGE2_PARITY32_INPUT.jsonl | awk '{print $1}')"
          python phase2/redesign/run_with_progress_watchdog_v2.py             --state-file P3_BATCH_PROGRESS.json             --watchdog-state-file P3_BATCH_WATCHDOG.json             --context "acad-pass/p3-stage2-parity32-batch"             --poll-seconds 5 --publish-seconds 60 --stale-seconds 600             --term-grace-seconds 30 --kill-on-stale --             python phase2/redesign/mpsef_p3_v1_stage2_production_adapter_v1.py               --input-jsonl P3_STAGE2_PARITY32_INPUT.jsonl               --expected-count 32 --expected-input-sha256 "$IN_SHA"               --p1-proposals p1/MPSEF_P1_CF_PROPOSALS_V1.jsonl               --pnx-model-dir pnx_model --upstream-root upstream/text-editing               --batch-size 32               --out-jsonl P3_BATCH.jsonl               --run-state P3_BATCH_RUN_STATE.json               --progress-state P3_BATCH_PROGRESS.json               --summary P3_BATCH_SUMMARY.json

      - name: Run REPEAT32 through production CLI
        env:
          TOKENIZERS_PARALLELISM: "false"
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IN_SHA="$(sha256sum P3_STAGE2_PARITY32_INPUT_REPEAT.jsonl | awk '{print $1}')"
          python phase2/redesign/run_with_progress_watchdog_v2.py             --state-file P3_REPEAT_PROGRESS.json             --watchdog-state-file P3_REPEAT_WATCHDOG.json             --context "acad-pass/p3-stage2-parity32-repeat"             --poll-seconds 5 --publish-seconds 60 --stale-seconds 600             --term-grace-seconds 30 --kill-on-stale --             python phase2/redesign/mpsef_p3_v1_stage2_production_adapter_v1.py               --input-jsonl P3_STAGE2_PARITY32_INPUT_REPEAT.jsonl               --expected-count 32 --expected-input-sha256 "$IN_SHA"               --p1-proposals p1/MPSEF_P1_CF_PROPOSALS_V1.jsonl               --pnx-model-dir pnx_model --upstream-root upstream/text-editing               --batch-size 32               --out-jsonl P3_REPEAT.jsonl               --run-state P3_REPEAT_RUN_STATE.json               --progress-state P3_REPEAT_PROGRESS.json               --summary P3_REPEAT_SUMMARY.json

      - name: Run REVERSED32 through production CLI
        env:
          TOKENIZERS_PARALLELISM: "false"
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IN_SHA="$(sha256sum P3_STAGE2_PARITY32_INPUT_REVERSED.jsonl | awk '{print $1}')"
          python phase2/redesign/run_with_progress_watchdog_v2.py             --state-file P3_REVERSED_PROGRESS.json             --watchdog-state-file P3_REVERSED_WATCHDOG.json             --context "acad-pass/p3-stage2-parity32-reversed"             --poll-seconds 5 --publish-seconds 60 --stale-seconds 600             --term-grace-seconds 30 --kill-on-stale --             python phase2/redesign/mpsef_p3_v1_stage2_production_adapter_v1.py               --input-jsonl P3_STAGE2_PARITY32_INPUT_REVERSED.jsonl               --expected-count 32 --expected-input-sha256 "$IN_SHA"               --p1-proposals p1/MPSEF_P1_CF_PROPOSALS_V1.jsonl               --pnx-model-dir pnx_model --upstream-root upstream/text-editing               --batch-size 32               --out-jsonl P3_REVERSED.jsonl               --run-state P3_REVERSED_RUN_STATE.json               --progress-state P3_REVERSED_PROGRESS.json               --summary P3_REVERSED_SUMMARY.json

      - name: Verify production-bound P3 Parity32
        run: |
          set -euo pipefail
          python phase2/redesign/mpsef_p3_v1_stage2_production_bound_parity32_v1.py             --manifest parity32/MPSEF_V4_STAGE1_PARITY32_MANIFEST_V1.jsonl             --p1-proposals p1/MPSEF_P1_CF_PROPOSALS_V1.jsonl             --frozen-p3 p3/MPSEF_P3_V1_STAGE1_V1.jsonl             --single P3_SINGLE.jsonl             --batch P3_BATCH.jsonl             --repeat P3_REPEAT.jsonl             --reversed P3_REVERSED.jsonl             --out MPSEF_P3_V1_STAGE2_PRODUCTION_BOUND_PARITY32_V1.json             | tee P3_STAGE2_PRODUCTION_BOUND_PARITY32.log

      - name: Freeze environment and identities
        if: always()
        run: |
          python -m pip freeze > P3_STAGE2_PARITY32_PIP_FREEZE.txt
          sha256sum             phase2/redesign/mpsef_p3_v1_stage2_production_adapter_v1.py             phase2/redesign/mpsef_p3_v1_stage2_build_parity32_input_v1.py             phase2/redesign/mpsef_p3_v1_stage2_production_bound_parity32_v1.py             phase2/redesign/mpsef_stageb_change_domain_classifier_v1.py             phase2/redesign/run_with_progress_watchdog_v2.py             parity32/MPSEF_V4_STAGE1_PARITY32_MANIFEST_V1.jsonl             p1/MPSEF_P1_CF_PROPOSALS_V1.jsonl             p3/MPSEF_P3_V1_STAGE1_V1.jsonl             P3_SINGLE.jsonl P3_BATCH.jsonl P3_REPEAT.jsonl P3_REVERSED.jsonl             MPSEF_P3_V1_STAGE2_PRODUCTION_BOUND_PARITY32_V1.json             P3_STAGE2_PARITY32_PIP_FREEZE.txt             .github/workflows/phase2-mpsef-p3-v1-stage2-production-bound-parity32.yml             > P3_STAGE2_PRODUCTION_BOUND_PARITY32_SHA256.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mpsef-p3-v1-stage2-production-bound-parity32-v1
          path: |
            P3_STAGE2_PARITY32_INPUT_BUILD.log
            P3_SINGLE.jsonl
            P3_SINGLE_RUN_STATE.json
            P3_SINGLE_PROGRESS.json
            P3_SINGLE_WATCHDOG.json
            P3_BATCH.jsonl
            P3_BATCH_RUN_STATE.json
            P3_BATCH_PROGRESS.json
            P3_BATCH_WATCHDOG.json
            P3_REPEAT.jsonl
            P3_REPEAT_RUN_STATE.json
            P3_REPEAT_PROGRESS.json
            P3_REPEAT_WATCHDOG.json
            P3_REVERSED.jsonl
            P3_REVERSED_RUN_STATE.json
            P3_REVERSED_PROGRESS.json
            P3_REVERSED_WATCHDOG.json
            MPSEF_P3_V1_STAGE2_PRODUCTION_BOUND_PARITY32_V1.json
            P3_STAGE2_PRODUCTION_BOUND_PARITY32.log
            P3_STAGE2_PARITY32_PIP_FREEZE.txt
            P3_STAGE2_PRODUCTION_BOUND_PARITY32_SHA256.txt
          if-no-files-found: warn
          retention-days: 90
