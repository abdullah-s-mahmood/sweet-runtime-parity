name: R44C LINEAR5 L2 implementation preflight

on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/r44c_linear5_preflight_trigger.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: r44c-linear5-preflight
  cancel-in-progress: false

jobs:
  synthetic:
    name: R44C source-free synthetic closure
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          cache: 'pip'
          cache-dependency-path: requirements/r44c_linear5.txt
      - name: Install frozen runtime
        run: python -m pip install --disable-pip-version-check --quiet -r requirements/r44c_linear5.txt
      - name: Compile R44C executor
        run: |
          python -m py_compile             phase2/academic_transform/at0_en/v2_6/r44c_linear5_train.py             phase2/academic_transform/at0_en/v2_6/r44c_linear5_aggregate.py             phase2/academic_transform/at0_en/v2_6/r44c_linear5_synthetic_preflight.py             phase2/academic_transform/at0_en/v2_6/r44c_linear5_input_preflight.py
      - name: Run source-free synthetic closure
        env:
          PYTHONHASHSEED: "44"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r44c/synthetic"
          python phase2/academic_transform/at0_en/v2_6/r44c_linear5_synthetic_preflight.py             > "$RUNNER_TEMP/r44c/synthetic/R44C_LINEAR5_SYNTHETIC_PREFLIGHT.json"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"r44c/synthetic/R44C_LINEAR5_SYNTHETIC_PREFLIGHT.json"
          d=json.loads(p.read_text())
          assert d["state"]=="R44C_LINEAR5_SYNTHETIC_PREFLIGHT_PASS"
          assert d["scientific_data_used"] is False
          assert d["scientific_attempt_consumed"] is False
          print(json.dumps(d,indent=2,sort_keys=True))
          PY
          sha256sum             phase2/academic_transform/at0_en/v2_6/r44c_linear5_train.py             phase2/academic_transform/at0_en/v2_6/r44c_linear5_aggregate.py             phase2/academic_transform/at0_en/v2_6/r44c_linear5_synthetic_preflight.py             phase2/academic_transform/at0_en/v2_6/r44c_linear5_input_preflight.py             phase2/academic_transform/at0_en/v2_6/AT0_EN_V26_R44C_LINEAR5_L2_PROTOCOL_FREEZE_V1.md             requirements/r44c_linear5.txt             > "$RUNNER_TEMP/r44c/synthetic/SOURCE_SHA256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r44c-linear5-synthetic-preflight
          path: ${{ runner.temp }}/r44c/synthetic
          if-no-files-found: error
          retention-days: 90

  input-audit:
    name: R44C frozen-input structural audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          cache: 'pip'
          cache-dependency-path: requirements/r44c_linear5.txt
      - name: Install frozen runtime
        run: python -m pip install --disable-pip-version-check --quiet -r requirements/r44c_linear5.txt
      - name: Download frozen nested banks
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r44b-b1-nested-banks
          path: ${{ runner.temp }}/r44c/nested
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37683637815
      - name: Download frozen context cache
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r44b-base-context-cache
          path: ${{ runner.temp }}/r44c/context
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37683637815
      - name: Download frozen R44 manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r44-oof-readonly-preflight
          path: ${{ runner.temp }}/r44c/preflight
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37572165532
      - name: Audit frozen inputs and raw 3918-feature construction only
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r44c/input"
          python phase2/academic_transform/at0_en/v2_6/r44c_linear5_input_preflight.py             --nested-root "$RUNNER_TEMP/r44c/nested"             --context-root "$RUNNER_TEMP/r44c/context"             --manifest "$RUNNER_TEMP/r44c/preflight/R44_OOF_MANIFEST_V1.json"             --out "$RUNNER_TEMP/r44c/input"
          sha256sum "$RUNNER_TEMP/r44c/input/"* > "$RUNNER_TEMP/r44c/input/OUTPUT_SHA256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r44c-linear5-frozen-input-preflight
          path: ${{ runner.temp }}/r44c/input
          if-no-files-found: error
          retention-days: 90

  closure:
    name: R44C preflight closure
    needs: [synthetic, input-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r44c-linear5-synthetic-preflight
          path: ${{ runner.temp }}/r44c/synthetic
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r44c-linear5-frozen-input-preflight
          path: ${{ runner.temp }}/r44c/input
      - name: Close non-scientific preflight
        run: |
          python - <<'PY'
          import json,os,pathlib,hashlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"r44c"
          s=json.loads((root/"synthetic/R44C_LINEAR5_SYNTHETIC_PREFLIGHT.json").read_text())
          i=json.loads((root/"input/R44C_LINEAR5_FROZEN_INPUT_PREFLIGHT.json").read_text())
          assert s["state"]=="R44C_LINEAR5_SYNTHETIC_PREFLIGHT_PASS"
          assert i["state"]=="R44C_LINEAR5_FROZEN_INPUT_PREFLIGHT_PASS"
          assert s["scientific_attempt_consumed"] is False
          assert i["scientific_attempt_consumed"] is False
          assert i["scaler_statistics_computed"] is False
          assert i["optimizer_created"] is False
          assert i["model_created"] is False
          out={"state":"R44C_LINEAR5_IMPLEMENTATION_PREFLIGHT_PASS",
               "synthetic_state":s["state"],"input_state":i["state"],
               "scientific_attempt_consumed":False,
               "real_meta_scaler_computed":False,
               "real_meta_optimizer_created":False,
               "verify_internal_used":False,
               "next_action":"FREEZE_EXECUTOR_THEN_SEPARATE_ONE_SHOT_SCIENTIFIC_AUTHORIZATION"}
          p=root/"R44C_LINEAR5_IMPLEMENTATION_PREFLIGHT.json"
          p.write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r44c-linear5-implementation-preflight
          path: ${{ runner.temp }}/r44c/R44C_LINEAR5_IMPLEMENTATION_PREFLIGHT.json
          if-no-files-found: error
          retention-days: 90
