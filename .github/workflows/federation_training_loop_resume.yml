name: Federation training-loop checkpoint resume preflight

on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/federation_training_loop_resume_trigger.txt'

permissions:
  contents: read

concurrency:
  group: federation-training-loop-resume
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: requirements/federation_runtime.txt
      - run: |
          python -m pip install --disable-pip-version-check --quiet -r requirements/federation_runtime.txt
          python -m pip check
      - name: Synthetic exact-resume closure
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/resume"
          python phase2/academic_transform/at0_en/v2_6/federation_training_loop_resume.py --out "$RUNNER_TEMP/resume/TRAINING_LOOP_RESUME_PREFLIGHT.json"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"resume/TRAINING_LOOP_RESUME_PREFLIGHT.json"
          d=json.loads(p.read_text())
          assert d["state"]=="FEDERATION_TRAINING_LOOP_CHECKPOINT_RESUME_SYNTHETIC_PASS"
          assert d["exact_resume_equivalence"]
          assert d["checkpoint_hash_guard"]
          assert not d["scientific_training_performed"]
          PY
          sha256sum phase2/academic_transform/at0_en/v2_6/federation_training_loop_resume.py requirements/federation_runtime.txt > "$RUNNER_TEMP/resume/SOURCE_SHA256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: federation-training-loop-resume-preflight
          path: ${{ runner.temp }}/resume
          if-no-files-found: error
          retention-days: 90
