name: Federation development family-fold custody audit

on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/federation_dev_family_fold_trigger.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: federation-dev-family-fold
  cancel-in-progress: false

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1, path: project}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: BIDS-Xu-Lab/section_specific_annotation_of_PICO
          ref: bc4b878773192f38b2600ec830ca4208b82f7dc0
          path: bids
          fetch-depth: 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: bepnye/EBM-NLP
          ref: 43a4a1ea3f0a21cfb8820c040b843dfaf66192d0
          path: ebm
          fetch-depth: 1
      - name: Download frozen R44 manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r44-oof-readonly-preflight
          path: ${{ runner.temp }}/r44
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37572165532
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.16'}
      - name: Build family-aware development folds inside custody
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/devfold" "$RUNNER_TEMP/ebmwork"
          python project/phase2/academic_transform/at0_en/v2_6/federation_development_family_fold_custody.py             --train bids/data/EBM-NLPmod/fold1/train.txt             --r44-manifest "$RUNNER_TEMP/r44/R44_OOF_MANIFEST_V1.json"             --ebm-archive ebm/ebm_nlp_2_00.tar.gz             --work "$RUNNER_TEMP/ebmwork"             --out "$RUNNER_TEMP/devfold/FEDERATION_DEVELOPMENT_FAMILY_FOLD_CUSTODY.json"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"devfold/FEDERATION_DEVELOPMENT_FAMILY_FOLD_CUSTODY.json"
          d=json.loads(p.read_text())
          assert d["state"]=="FEDERATION_DEVELOPMENT_FAMILY_FOLD_CUSTODY_PASS"
          assert not d["output_contains_pmids"]
          assert all(v["fold_gate_pass"] for v in d["folds"].values())
          PY
          sha256sum project/phase2/academic_transform/at0_en/v2_6/federation_development_family_fold_custody.py > "$RUNNER_TEMP/devfold/SOURCE_SHA256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: federation-development-family-fold-custody
          path: ${{ runner.temp }}/devfold
          if-no-files-found: error
          retention-days: 90
