name: Phase 2 MP-SEF P2 Truncation Audit v1

on:
  workflow_dispatch:
  push:
    branches:
      - phase2-arabic-eval
    paths:
      - ".github/workflows/phase2-mpsef-p2-truncation-audit-v1.yml"

permissions:
  contents: read
  actions: read

jobs:
  p2-truncation-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-arabic-eval

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Clone frozen arabic-gec transformers
        run: |
          git clone https://github.com/CAMeL-Lab/arabic-gec.git upstream/arabic-gec
          git -C upstream/arabic-gec checkout 8c7fb84f3ed84d1d30beb7080b02d0f6bfe1c5bf
          test "$(git -C upstream/arabic-gec rev-parse HEAD)" = "8c7fb84f3ed84d1d30beb7080b02d0f6bfe1c5bf"

      - name: Install frozen generation runtime
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==1.11.0+cpu"
          python -m pip install "numpy==1.23.5" "sentencepiece==0.1.99" "protobuf==3.20.3"
          python -m pip install "huggingface-hub==0.10.1" "tokenizers==0.12.1"
          python -m pip install --force-reinstall --no-deps ./upstream/arabic-gec/transformers
          python - <<'PY'
          import transformers
          assert transformers.__version__ == "4.22.2"
          print("P2_TRUNCATION_AUDIT_RUNTIME_OK")
          PY

      - name: Download frozen P2 GEC model
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path
          from huggingface_hub import snapshot_download
          rev="410588a318d988cdcfdbf64cf5745ed4adea0f6a"
          src=Path(snapshot_download(
              repo_id="CAMeL-Lab/arabart-qalb14-gec-ged-13",
              revision=rev,
              cache_dir="hf_cache",
          ))
          shutil.copytree(src,"p2_gec_model",symlinks=False)
          PY
          test "$(sha256sum p2_gec_model/pytorch_model.bin | awk '{print $1}')" = "5eadbd894d7ba21e18ca53e118af20858b2e87a4d0b02f41d75e91e33919bb5f"

      - name: Download frozen P2 proposal artifact
        uses: actions/download-artifact@v4
        with:
          name: mpsef-p2-cf-proposals-v1
          path: p2_artifact
          repository: abdullah-s-mahmood/sweet-runtime-parity
          run-id: 36768378938
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate frozen proposal identity
        run: |
          test "$(sha256sum p2_artifact/MPSEF_P2_CF_PROPOSALS_V1.jsonl | awk '{print $1}')" = "f91ab2be10909851d16bc8139fcf6987259de627447c948c45c31c33449cf99b"
          python - <<'PY'
          import json
          rows=[json.loads(x) for x in open('p2_artifact/MPSEF_P2_CF_PROPOSALS_V1.jsonl',encoding='utf-8') if x.strip()]
          assert len(rows)==1918
          assert all(r['gold_reference_consulted'] is False for r in rows)
          print('P2_FROZEN_PROPOSAL_IDENTITY_OK 1918')
          PY

      - name: Audit chunk 1 of 8 (0-240)
        env:
          PYTHONUNBUFFERED: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python phase2/redesign/mpsef_p2_truncation_audit_v1.py \
            --proposals p2_artifact/MPSEF_P2_CF_PROPOSALS_V1.jsonl \
            --gec-model-dir p2_gec_model \
            --start 0 --end 240 \
            --batch-size 8 \
            --out P2_TRUNC_AUDIT_CHUNK_1.jsonl

      - name: Audit chunk 2 of 8 (240-480)
        env:
          PYTHONUNBUFFERED: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python phase2/redesign/mpsef_p2_truncation_audit_v1.py \
            --proposals p2_artifact/MPSEF_P2_CF_PROPOSALS_V1.jsonl \
            --gec-model-dir p2_gec_model \
            --start 240 --end 480 \
            --batch-size 8 \
            --out P2_TRUNC_AUDIT_CHUNK_2.jsonl

      - name: Audit chunk 3 of 8 (480-720)
        env:
          PYTHONUNBUFFERED: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python phase2/redesign/mpsef_p2_truncation_audit_v1.py \
            --proposals p2_artifact/MPSEF_P2_CF_PROPOSALS_V1.jsonl \
            --gec-model-dir p2_gec_model \
            --start 480 --end 720 \
            --batch-size 8 \
            --out P2_TRUNC_AUDIT_CHUNK_3.jsonl

      - name: Audit chunk 4 of 8 (720-960)
        env:
          PYTHONUNBUFFERED: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python phase2/redesign/mpsef_p2_truncation_audit_v1.py \
            --proposals p2_artifact/MPSEF_P2_CF_PROPOSALS_V1.jsonl \
            --gec-model-dir p2_gec_model \
            --start 720 --end 960 \
            --batch-size 8 \
            --out P2_TRUNC_AUDIT_CHUNK_4.jsonl

      - name: Audit chunk 5 of 8 (960-1200)
        env:
          PYTHONUNBUFFERED: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python phase2/redesign/mpsef_p2_truncation_audit_v1.py \
            --proposals p2_artifact/MPSEF_P2_CF_PROPOSALS_V1.jsonl \
            --gec-model-dir p2_gec_model \
            --start 960 --end 1200 \
            --batch-size 8 \
            --out P2_TRUNC_AUDIT_CHUNK_5.jsonl

      - name: Audit chunk 6 of 8 (1200-1440)
        env:
          PYTHONUNBUFFERED: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python phase2/redesign/mpsef_p2_truncation_audit_v1.py \
            --proposals p2_artifact/MPSEF_P2_CF_PROPOSALS_V1.jsonl \
            --gec-model-dir p2_gec_model \
            --start 1200 --end 1440 \
            --batch-size 8 \
            --out P2_TRUNC_AUDIT_CHUNK_6.jsonl

      - name: Audit chunk 7 of 8 (1440-1680)
        env:
          PYTHONUNBUFFERED: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python phase2/redesign/mpsef_p2_truncation_audit_v1.py \
            --proposals p2_artifact/MPSEF_P2_CF_PROPOSALS_V1.jsonl \
            --gec-model-dir p2_gec_model \
            --start 1440 --end 1680 \
            --batch-size 8 \
            --out P2_TRUNC_AUDIT_CHUNK_7.jsonl

      - name: Audit chunk 8 of 8 (1680-1918)
        env:
          PYTHONUNBUFFERED: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python phase2/redesign/mpsef_p2_truncation_audit_v1.py \
            --proposals p2_artifact/MPSEF_P2_CF_PROPOSALS_V1.jsonl \
            --gec-model-dir p2_gec_model \
            --start 1680 --end 1918 \
            --batch-size 8 \
            --out P2_TRUNC_AUDIT_CHUNK_8.jsonl

      - name: Combine and validate truncation audit
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          rows=[]
          chunk_summaries=[]
          for i in range(1,9):
              p=Path(f'P2_TRUNC_AUDIT_CHUNK_{i}.jsonl')
              rows.extend(json.loads(x) for x in p.read_text(encoding='utf-8').splitlines() if x.strip())
              chunk_summaries.append(json.loads(Path(str(p)+'.summary.json').read_text(encoding='utf-8')))
          assert len(rows)==1918
          assert len({r['uid'] for r in rows})==1918
          assert all(r['output_exact_match'] for r in rows)
          maxed=[r for r in rows if r['max_length_reached']]
          no_eos=[r for r in rows if not r['eos_seen']]
          out=Path('MPSEF_P2_TRUNCATION_AUDIT_V1.jsonl')
          out.write_text('\n'.join(json.dumps(r,ensure_ascii=False) for r in rows)+'\n',encoding='utf-8')
          summary={
              'record_id':'MPSEF_P2_TRUNCATION_AUDIT_V1',
              'status':'PASS_WITH_TRUNCATION_EVENTS' if maxed else 'PASS_NO_TRUNCATION',
              'cases':1918,
              'output_exact_matches':1918,
              'max_length_reached_count':len(maxed),
              'max_length_reached_cases':[{'uid':r['uid'],'case_id':r['case_id'],'generated_actual_length':r['generated_actual_length']} for r in maxed],
              'no_eos_count':len(no_eos),
              'max_generated_actual_length':max(r['generated_actual_length'] for r in rows),
              'proposal_sha256':'f91ab2be10909851d16bc8139fcf6987259de627447c948c45c31c33449cf99b',
              'audit_jsonl_sha256':hashlib.sha256(out.read_bytes()).hexdigest(),
              'chunk_summaries':chunk_summaries,
              'gold_reference_consulted':False,
              'feasibility_metric_computed':False,
              'r_joint_computed':False,
              'selector_trained':False,
              'internal_evaluation_opened':False,
              'stress_diagnostic_opened':False,
          }
          Path('MPSEF_P2_TRUNCATION_AUDIT_V1_SUMMARY.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2),flush=True)
          PY

      - name: Record audit hashes
        run: |
          sha256sum \
            phase2/redesign/mpsef_p2_truncation_audit_v1.py \
            .github/workflows/phase2-mpsef-p2-truncation-audit-v1.yml \
            MPSEF_P2_TRUNCATION_AUDIT_V1.jsonl \
            MPSEF_P2_TRUNCATION_AUDIT_V1_SUMMARY.json \
            > MPSEF_P2_TRUNCATION_AUDIT_V1_SHA256.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mpsef-p2-truncation-audit-v1
          path: |
            P2_TRUNC_AUDIT_CHUNK_*.jsonl
            P2_TRUNC_AUDIT_CHUNK_*.jsonl.summary.json
            MPSEF_P2_TRUNCATION_AUDIT_V1.jsonl
            MPSEF_P2_TRUNCATION_AUDIT_V1_SUMMARY.json
            MPSEF_P2_TRUNCATION_AUDIT_V1_SHA256.txt
          if-no-files-found: warn
          retention-days: 90
