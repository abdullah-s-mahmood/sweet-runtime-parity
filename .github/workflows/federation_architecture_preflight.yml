name: Federation D0-D4 architecture synthetic preflight

on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/federation_architecture_preflight_trigger.txt'

permissions:
  contents: read

concurrency:
  group: federation-architecture-synthetic
  cancel-in-progress: false

jobs:
  architecture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: requirements/federation_architecture_preflight.txt
      - run: python -m pip install --disable-pip-version-check --quiet -r requirements/federation_architecture_preflight.txt
      - name: Run D0-D4 synthetic forward/backward closure
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arch"
          python phase2/academic_transform/at0_en/v2_6/federation_architecture_preflight.py             --synthetic-preflight             --out "$RUNNER_TEMP/arch/FEDERATION_ARCHITECTURE_SYNTHETIC_PREFLIGHT.json"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"arch/FEDERATION_ARCHITECTURE_SYNTHETIC_PREFLIGHT.json"
          d=json.loads(p.read_text())
          assert d["state"]=="FEDERATION_D0_D4_ARCHITECTURE_SYNTHETIC_PREFLIGHT_PASS"
          assert d["D0"]["viterbi_valid"]
          assert d["D5"]=="CANCELED_NO_OFFICIAL_SEMANTIC_TYPE_LABELS"
          assert d["seeded_head_initialization_deterministic"]
          PY
          sha256sum phase2/academic_transform/at0_en/v2_6/federation_architecture_preflight.py             requirements/federation_architecture_preflight.txt > "$RUNNER_TEMP/arch/SOURCE_SHA256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: federation-d0-d4-architecture-synthetic-preflight
          path: ${{ runner.temp }}/arch
          if-no-files-found: error
          retention-days: 90
