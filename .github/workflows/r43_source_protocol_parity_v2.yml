name: R43 source protocol parity V2 TRAIN-only
on:
  push:
    branches: [at0-en-v2.6-dev]
    paths: [.github/diagnostics/r43_source_protocol_parity_v2_trigger.txt]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: at0-en-v2.6-dev
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install runtime
        run: |
          set -euo pipefail
          pip install --quiet transformers==4.39.3 huggingface_hub==0.25.2
      - name: Acquire pinned TRAIN, source utils/evaluator, and safe tokenizer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r43/source" "$RUNNER_TEMP/r43/model"
          python - <<'PY'
          import pathlib,urllib.request,hashlib,os
          from huggingface_hub import snapshot_download
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"r43"
          base="https://raw.githubusercontent.com/BIDS-Xu-Lab/section_specific_annotation_of_PICO/bc4b878773192f38b2600ec830ca4208b82f7dc0/"
          files=["data/EBM-NLPmod/fold1/train.txt","utils_ner.py","evaluate.py"]
          for rel in files:
              b=urllib.request.urlopen(base+rel,timeout=30).read()
              out=root/"source"/pathlib.Path(rel).name
              out.write_bytes(b)
              print(rel,hashlib.sha256(b).hexdigest())
          want="6491a57e5c8639e5bfc3c0326b8501869fccab655a1ed571b75a772dc1c70a5e"
          if hashlib.sha256((root/"source/train.txt").read_bytes()).hexdigest()!=want:
              raise SystemExit("TRAIN mismatch")
          snap=snapshot_download(
              repo_id="microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract",
              revision="d673b8835373c6fa116d6d8006b33d48734e305d",
              allow_patterns=["config.json","tokenizer_config.json","vocab.txt"],
              local_dir=str(root/"model"),local_dir_use_symlinks=False)
          PY
      - name: Run corrected source protocol parity audit
        shell: bash
        env:
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_OFFLINE: "1"
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/r43/out"
          python phase2/academic_transform/at0_en/v2_6/r43_source_protocol_parity_v2.py             --train "$RUNNER_TEMP/r43/source/train.txt"             --source-utils "$RUNNER_TEMP/r43/source/utils_ner.py"             --source-evaluate "$RUNNER_TEMP/r43/source/evaluate.py"             --model-dir "$RUNNER_TEMP/r43/model"             --out "$RUNNER_TEMP/r43/out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r43-source-protocol-parity-v2
          path: ${{ runner.temp }}/r43/out
          if-no-files-found: warn
          retention-days: 90
