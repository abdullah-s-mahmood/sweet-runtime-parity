name: AT0 EN V2.6 R4.3 independent boundary-repair feasibility

on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/r43_boundary_repair_feasibility_trigger_v1.txt'

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: at0-en-v2.6-dev
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Download frozen preflight manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: at0-en-v2-6-r43-contextual-pair-preflight
          path: ${{ runner.temp }}/r43/preflight
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37534110955
      - name: Acquire exact TRAIN only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r43/data"
          python - <<'PY'
          import hashlib,os,pathlib,urllib.request
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"r43/data/train.txt"
          b=urllib.request.urlopen("https://raw.githubusercontent.com/BIDS-Xu-Lab/section_specific_annotation_of_PICO/bc4b878773192f38b2600ec830ca4208b82f7dc0/data/EBM-NLPmod/fold1/train.txt",timeout=30).read()
          w="6491a57e5c8639e5bfc3c0326b8501869fccab655a1ed571b75a772dc1c70a5e"
          g=hashlib.sha256(b).hexdigest()
          if g!=w: raise SystemExit(g)
          p.write_bytes(b)
          PY
      - name: Run independent FIT-only repair-feasibility audit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/r43/repair"
          python phase2/academic_transform/at0_en/v2_6/r43_independent_boundary_repair_feasibility.py             --train "$RUNNER_TEMP/r43/data/train.txt"             --manifest "$RUNNER_TEMP/r43/preflight/R43_FIT_SELECT_MANIFEST.json"             --out "$RUNNER_TEMP/r43/repair"
      - name: Hash outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r43/repair"
          sha256sum phase2/academic_transform/at0_en/v2_6/r43_independent_boundary_repair_feasibility.py             > "$RUNNER_TEMP/r43/repair/PROTOCOL_SHA256.txt"
          if [ -f "$RUNNER_TEMP/r43/repair/R43_BOUNDARY_REPAIR_FEASIBILITY.json" ]; then
            sha256sum "$RUNNER_TEMP/r43/repair/R43_BOUNDARY_REPAIR_FEASIBILITY.json" >> "$RUNNER_TEMP/r43/repair/PROTOCOL_SHA256.txt"
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: at0-en-v2-6-r43-independent-boundary-repair-feasibility
          path: ${{ runner.temp }}/r43/repair
          if-no-files-found: error
          retention-days: 90
