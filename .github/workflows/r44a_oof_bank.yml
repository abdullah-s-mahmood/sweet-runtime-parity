name: R44-A sequential OOF upstream candidate bank

on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/r44a_oof_bank_trigger_v1.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: r44a-sequential-oof-upstream-bank
  cancel-in-progress: false

jobs:
  fold:
    name: R44-A OOF fold ${{ matrix.fold }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        fold: [0, 1, 2, 3, 4]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install frozen R44-A runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet             numpy==1.26.4             torch==2.2.2             transformers==4.39.3             accelerate==0.28.0             safetensors==0.4.3             huggingface_hub==0.25.2             jax==0.4.25             jaxlib==0.4.25             flax==0.8.2

      - name: Download frozen R44 preflight manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r44-oof-readonly-preflight
          path: ${{ runner.temp }}/r44/preflight
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37572165532

      - name: Download frozen DESIGN-only source package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r44-design-source-only
          path: ${{ runner.temp }}/r44/design
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37572893091

      - name: Acquire and verify exact safe BiomedBERT base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r44/base"
          python - <<'PY'
          import hashlib, os, pathlib
          from huggingface_hub import snapshot_download

          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"r44/base"
          expected={
            "flax_model.msgpack":"2048c0dca92fe54cf2bec6c36972511ca04e546060307098139b19221dd4e93f",
            "config.json":"56bab767c02bc792897638feb8addc06d483d9c73769a5f554bbabea1f5507a1",
            "tokenizer_config.json":"53b6f42b8b8daddbdc6d3532c324187a92b46c1602bd6e8d4ad5a413b4fc90e1",
            "vocab.txt":"7b36651908a88bc38bda41b728b2a598191e0d3b553cbacf7b1e5f026d5b5b9f",
          }
          p=pathlib.Path(snapshot_download(
              repo_id="microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract",
              revision="d673b8835373c6fa116d6d8006b33d48734e305d",
              allow_patterns=list(expected),
              local_dir=str(root),
              local_dir_use_symlinks=False))
          for name,want in expected.items():
              got=hashlib.sha256((p/name).read_bytes()).hexdigest()
              if got!=want:
                  raise SystemExit(f"{name} SHA mismatch {got} != {want}")
          print("R44_BASE_IDENTITY_PASS")
          PY

      - name: Verify immutable upstream artifacts before training
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"r44"
          manifest=root/"preflight/R44_OOF_MANIFEST_V1.json"
          source=root/"design/R44_DESIGN_SOURCE.json"
          summary=root/"design/R44_DESIGN_SOURCE_SUMMARY.json"
          if not manifest.exists() or not source.exists() or not summary.exists():
              raise SystemExit("required frozen R44 artifacts missing")
          m=json.loads(manifest.read_text())
          s=json.loads(summary.read_text())
          if m.get("manifest_sha256")!="799844f1bdd15792740333b2ad57c8aad7bb8f265566fece06f4a2ff61574720":
              raise SystemExit("manifest identity mismatch")
          if s.get("state")!="R44_DESIGN_SOURCE_PACKAGE_PASS":
              raise SystemExit("design source state mismatch")
          if s.get("design_source_sha256")!="f8b49420cb17a5cb3f67f3120f9362b5e6b15fbb148176eab20105790bab1e18":
              raise SystemExit("design source recorded identity mismatch")
          got=hashlib.sha256(source.read_bytes()).hexdigest()
          if got!=s["design_source_sha256"]:
              raise SystemExit(f"design source physical hash mismatch {got}")
          if s["guards"]!={"scientific_training":False,"output_contains_verify":False,"output_contains_old_select":False}:
              raise SystemExit(f"design source guard mismatch {s['guards']}")
          print(json.dumps({
              "state":"R44A_FROZEN_INPUT_IDENTITY_PASS",
              "manifest_sha256":m["manifest_sha256"],
              "design_source_sha256":got,
              "design_docs":len(m["design_documents"]),
              "verify_docs":len(m["verify_internal_documents"]),
              "old_select_docs":len(m["excluded_old_select_documents"])
          },indent=2,sort_keys=True))
          PY

      - name: Train fold ancestors and materialize held-out candidate bank
        id: train_fold
        shell: bash
        env:
          TOKENIZERS_PARALLELISM: "false"
          PYTHONHASHSEED: "44"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/r44/out"
          python phase2/academic_transform/at0_en/v2_6/r44a_oof_fold_train.py             --model-dir "$RUNNER_TEMP/r44/base"             --design-source "$RUNNER_TEMP/r44/design/R44_DESIGN_SOURCE.json"             --design-summary "$RUNNER_TEMP/r44/design/R44_DESIGN_SOURCE_SUMMARY.json"             --manifest "$RUNNER_TEMP/r44/preflight/R44_OOF_MANIFEST_V1.json"             --fold "${{ matrix.fold }}"             --out "$RUNNER_TEMP/r44/out"

      - name: Finalize fold status if interrupted
        if: always()
        shell: bash
        env:
          STEP_OUTCOME: ${{ steps.train_fold.outcome }}
          FOLD: ${{ matrix.fold }}
        run: |
          python - <<'PY'
          import datetime,json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"r44/out/PROCESS_STATUS.json"
          if p.exists():
              d=json.loads(p.read_text())
              if d.get("state")=="RUNNING":
                  d["state"]="FAILED" if os.environ.get("STEP_OUTCOME")=="failure" else "CANCELLED"
                  d["failure_or_stall_reason"]="R44A_FOLD_DID_NOT_COMPLETE"
                  d["terminal_observed_at"]=datetime.datetime.now(datetime.timezone.utc).isoformat()
                  p.write_text(json.dumps(d,indent=2,sort_keys=True)+"\n")
          else:
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(json.dumps({
                  "state":"FAILED" if os.environ.get("STEP_OUTCOME")=="failure" else "CANCELLED",
                  "fold":int(os.environ["FOLD"]),
                  "failure_or_stall_reason":"NO_PROCESS_STATUS_CREATED",
                  "terminal_observed_at":datetime.datetime.now(datetime.timezone.utc).isoformat()
              },indent=2,sort_keys=True)+"\n")
          PY

      - name: Freeze fold code and evidence hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r44/evidence"
          sha256sum             phase2/academic_transform/at0_en/v2_6/r44a_oof_fold_train.py             phase2/academic_transform/at0_en/v2_6/r44a_aggregate_bank.py             phase2/academic_transform/at0_en/v2_6/AT0_EN_V26_R44_OOF_SUPERVISION_REPAIR_DESIGN_V1.md             phase2/academic_transform/at0_en/v2_6/AT0_EN_V26_R44_ADVERSARIAL_PROTOCOL_REVIEW_V1.md             phase2/academic_transform/at0_en/v2_6/AT0_EN_V26_R44_PREFLIGHT_FREEZE_V1.md             phase2/academic_transform/at0_en/v2_6/AT0_EN_V26_R44A_OOF_BANK_AUTHORIZATION_V1.md             phase2/academic_transform/at0_en/v2_6/AT0_EN_V26_R44A_PRELAUNCH_FORENSIC_AUDIT_V1.md             > "$RUNNER_TEMP/r44/evidence/PROTOCOL_SHA256.txt"
          if [ -f "$RUNNER_TEMP/r44/out/R44A_FOLD_${{ matrix.fold }}_SUMMARY.json" ]; then
            sha256sum               "$RUNNER_TEMP/r44/out/R44A_FOLD_${{ matrix.fold }}_SUMMARY.json"               "$RUNNER_TEMP/r44/out/R44A_FOLD_${{ matrix.fold }}_CANDIDATES.jsonl"               "$RUNNER_TEMP/r44/out/PROCESS_STATUS.json"               > "$RUNNER_TEMP/r44/evidence/OUTPUT_SHA256.txt"
          fi

      - name: Upload fold evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r44a-fold-${{ matrix.fold }}
          path: |
            ${{ runner.temp }}/r44/out/R44A_FOLD_${{ matrix.fold }}_SUMMARY.json
            ${{ runner.temp }}/r44/out/R44A_FOLD_${{ matrix.fold }}_CANDIDATES.jsonl
            ${{ runner.temp }}/r44/out/PROCESS_STATUS.json
            ${{ runner.temp }}/r44/evidence/PROTOCOL_SHA256.txt
            ${{ runner.temp }}/r44/evidence/OUTPUT_SHA256.txt
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    name: R44-A aggregate frozen OOF bank
    runs-on: ubuntu-latest
    needs: fold
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Download frozen R44 preflight manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r44-oof-readonly-preflight
          path: ${{ runner.temp }}/r44/preflight
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37572165532

      - name: Download all five current-run fold artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: r44a-fold-*
          path: ${{ runner.temp }}/r44/folds
          merge-multiple: false

      - name: Aggregate and verify exact DESIGN coverage
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/r44/aggregate"
          python phase2/academic_transform/at0_en/v2_6/r44a_aggregate_bank.py             --artifacts-root "$RUNNER_TEMP/r44/folds"             --manifest "$RUNNER_TEMP/r44/preflight/R44_OOF_MANIFEST_V1.json"             --out "$RUNNER_TEMP/r44/aggregate"

      - name: Freeze aggregate identities
        shell: bash
        run: |
          set -euo pipefail
          sha256sum             phase2/academic_transform/at0_en/v2_6/r44a_aggregate_bank.py             "$RUNNER_TEMP/r44/aggregate/R44A_OOF_BANK_SUMMARY.json"             "$RUNNER_TEMP/r44/aggregate/R44A_OOF_CANDIDATE_BANK.jsonl"             > "$RUNNER_TEMP/r44/aggregate/SHA256SUMS.txt"

      - name: Upload frozen aggregate bank
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r44a-oof-candidate-bank
          path: ${{ runner.temp }}/r44/aggregate
          if-no-files-found: error
          retention-days: 90
