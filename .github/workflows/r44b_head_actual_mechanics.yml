name: R44-B actual nested-bank head mechanics

on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/r44b_head_actual_mechanics_trigger.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: r44b-head-actual-mechanics
  cancel-in-progress: false

jobs:
  mechanics:
    name: R44-B actual head mechanics audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements/r44a_fold_fast.txt
      - name: Install frozen mechanics runtime
        run: python -m pip install --disable-pip-version-check --quiet -r requirements/r44a_fold_fast.txt
      - name: Download frozen nested banks
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r44b-b1-nested-banks
          path: ${{ runner.temp }}/r44b/nested
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37683637815
      - name: Download frozen context cache
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r44b-base-context-cache
          path: ${{ runner.temp }}/r44b/context
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37683637815
      - name: Download frozen R44 manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r44-oof-readonly-preflight
          path: ${{ runner.temp }}/r44b/preflight
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37572165532
      - name: Audit actual head feature mechanics
        run: |
          set -euo pipefail
          python phase2/academic_transform/at0_en/v2_6/r44b_head_actual_mechanics.py \
            --nested-root "$RUNNER_TEMP/r44b/nested" \
            --context-root "$RUNNER_TEMP/r44b/context" \
            --manifest "$RUNNER_TEMP/r44b/preflight/R44_OOF_MANIFEST_V1.json" \
            --out "$RUNNER_TEMP/r44b/mechanics"
          sha256sum "$RUNNER_TEMP/r44b/mechanics/"* > "$RUNNER_TEMP/r44b/mechanics/SHA256SUMS.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r44b-head-actual-mechanics
          path: ${{ runner.temp }}/r44b/mechanics
          if-no-files-found: error
          retention-days: 90
