name: Phase 2 MP-SEF P2 AraBART GED Parity v1

on:
  workflow_dispatch:
  push:
    branches:
      - phase2-arabic-eval
    paths:
      - ".github/workflows/phase2-mpsef-p2-arabart-ged-parity-v1.yml"
      - "phase2/redesign/mpsef_p2_arabart_ged_parity.py"

permissions:
  contents: read
  actions: read

jobs:
  p2-arabart-ged-parity:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-arabic-eval

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Clone frozen official arabic-gec implementation
        run: |
          git clone https://github.com/CAMeL-Lab/arabic-gec.git upstream/arabic-gec
          cd upstream/arabic-gec
          git checkout 8c7fb84f3ed84d1d30beb7080b02d0f6bfe1c5bf
          test "$(git rev-parse HEAD)" = "8c7fb84f3ed84d1d30beb7080b02d0f6bfe1c5bf"

      - name: Install frozen P2 runtime stack
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==1.11.0+cpu"
          python -m pip install "numpy==1.23.5" "camel-tools==1.4.1" "datasets==2.5.1" "sentencepiece==0.1.99" "protobuf==3.20.3"
          python -m pip install "huggingface-hub==0.10.1" "tokenizers==0.12.1"
          python -m pip install --force-reinstall --no-deps ./upstream/arabic-gec/transformers
          python - <<'PY'
          import transformers
          print("TRANSFORMERS_VERSION", transformers.__version__)
          print("TRANSFORMERS_PATH", transformers.__file__)
          from transformers import DataCollatorForSeq2SeqGEC
          print("MODIFIED_TRANSFORMERS_GED_SUPPORT_OK")
          assert transformers.__version__ == "4.22.2"
          PY

      - name: Install frozen CAMeL disambiguation data
        run: |
          camel_data -i disambig-bert-unfactored-msa
          python - <<'PY'
          import hashlib
          from pathlib import Path

          expected_morph="195bc25a333237a2126470da888d7936b59ed3729f9210e0a4194ba43497dd70"
          expected_disambig_model="a1a22431cdc0934151e4039abbd7890f06ba7c1f914ca71a90eba218401ae539"

          root=Path.home()/".camel_tools"
          morph=[]
          models=[]
          for p in root.rglob("morphology.db"):
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              morph.append((str(p),h))
              print("MORPH_DB",p,h)
          for p in root.rglob("pytorch_model.bin"):
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              models.append((str(p),h))
              print("CAMEL_MODEL",p,h)

          assert any(h==expected_morph for _,h in morph), (expected_morph,morph)
          assert any(h==expected_disambig_model for _,h in models), (expected_disambig_model,models)
          print("CAMEL_P2_RESOURCES_HASH_OK")
          PY

      - name: Download frozen P2 GED and GEC model revisions
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download

          ged_rev="447179dc63d186e4bff09a993e90e73ad622d571"
          gec_rev="410588a318d988cdcfdbf64cf5745ed4adea0f6a"

          snapshot_download(
              repo_id="CAMeL-Lab/camelbert-msa-qalb14-ged-13",
              revision=ged_rev,
              local_dir="p2_ged_model",
              local_dir_use_symlinks=False,
          )
          snapshot_download(
              repo_id="CAMeL-Lab/arabart-qalb14-gec-ged-13",
              revision=gec_rev,
              local_dir="p2_gec_model",
              local_dir_use_symlinks=False,
          )
          print("P2_MODELS_READY",ged_rev,gec_rev,flush=True)
          PY

      - name: Record exact P2 model file hashes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          out={}
          for name in ["p2_ged_model","p2_gec_model"]:
              rows=[]
              root=Path(name)
              for p in sorted(root.rglob("*")):
                  if p.is_file():
                      h=hashlib.sha256()
                      with p.open("rb") as f:
                          for chunk in iter(lambda:f.read(1024*1024),b""):
                              h.update(chunk)
                      rows.append({
                          "path":str(p.relative_to(root)),
                          "bytes":p.stat().st_size,
                          "sha256":h.hexdigest(),
                      })
              out[name]=rows
          Path("MPSEF_P2_MODEL_FILE_HASHES.json").write_text(
              json.dumps(out,indent=2)+"\n",encoding="utf-8"
          )
          print("P2_MODEL_HASH_MANIFEST_READY",flush=True)
          PY

      - name: Download frozen CALIBRATION
        uses: actions/download-artifact@v4
        with:
          name: m2h-calibration-v1
          path: calibration_artifact
          repository: abdullah-s-mahmood/sweet-runtime-parity
          run-id: 36654588477
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run source-only P2 parity
        run: |
          python phase2/redesign/mpsef_p2_arabart_ged_parity.py \
            --calibration calibration_artifact/M2H_CALIBRATION_V1.jsonl \
            --ged-model-dir p2_ged_model \
            --gec-model-dir p2_gec_model \
            --sample-n 64 \
            --out-prefix MPSEF_P2_ARABART_GED_PARITY_V1

      - name: Validate P2 parity summary
        run: |
          python - <<'PY'
          import json
          s=json.load(open("MPSEF_P2_ARABART_GED_PARITY_V1_SUMMARY.json",encoding="utf-8"))
          assert s["status"]=="PASS"
          assert s["sample_n"]==64
          c=s["counts"]
          for key in [
              "morph_match",
              "ged_match",
              "tokens_match",
              "input_ids_match",
              "label_ids_match",
              "generated_exact_match",
              "generated_normalized_match",
              "all_field_match",
          ]:
              assert c[key]==64,(key,c[key])
          assert s["gold_reference_consulted"] is False
          assert s["internal_evaluation_opened"] is False
          assert s["stress_diagnostic_opened"] is False
          print("MPSEF_P2_PARITY_OK",flush=True)
          PY

      - name: Record P2 runtime
        if: always()
        run: |
          python -m pip freeze > MPSEF_P2_ARABART_GED_PARITY_V1_PIP_FREEZE.txt
          sha256sum phase2/redesign/mpsef_p2_arabart_ged_parity.py \
                    MPSEF_P2_ARABART_GED_PARITY_V1_PIP_FREEZE.txt \
                    > MPSEF_P2_ARABART_GED_PARITY_V1_SHA256.txt

      - name: Write P2 final status
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary=Path("MPSEF_P2_ARABART_GED_PARITY_V1_SUMMARY.json")
          if summary.exists():
              s=json.loads(summary.read_text(encoding="utf-8"))
              out={
                  "status":"COMPLETED" if s.get("status")=="PASS" else "FAILED",
                  "stage":"P2_PARITY_DONE",
                  "all_field_match":s.get("counts",{}).get("all_field_match"),
                  "sample_n":s.get("sample_n"),
              }
          else:
              out={"status":"FAILED","stage":"SEE_WORKFLOW_LOG"}
          Path("MPSEF_P2_ARABART_GED_PARITY_V1_FINAL_STATUS.json").write_text(
              json.dumps(out,indent=2)+"\n",encoding="utf-8"
          )
          print(json.dumps(out),flush=True)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mpsef-p2-arabart-ged-parity-v1
          path: |
            MPSEF_P2_ARABART_GED_PARITY_V1_SUMMARY.json
            MPSEF_P2_ARABART_GED_PARITY_V1_TRACE.jsonl
            MPSEF_P2_ARABART_GED_PARITY_V1_GED_MODEL_MANIFEST.json
            MPSEF_P2_ARABART_GED_PARITY_V1_GEC_MODEL_MANIFEST.json
            MPSEF_P2_ARABART_GED_PARITY_V1_FINAL_STATUS.json
            MPSEF_P2_ARABART_GED_PARITY_V1_PIP_FREEZE.txt
            MPSEF_P2_ARABART_GED_PARITY_V1_SHA256.txt
            MPSEF_P2_MODEL_FILE_HASHES.json
          if-no-files-found: warn
          retention-days: 90
