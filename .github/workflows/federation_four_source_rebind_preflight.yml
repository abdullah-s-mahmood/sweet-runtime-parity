name: Federation four-source prefit rebind preflight

on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/federation_four_source_rebind_trigger.txt'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          path: project
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Run four-source rebind preflight
        run: |
          mkdir -p "$RUNNER_TEMP/four_source_rebind"
          python project/phase2/academic_transform/at0_en/v2_6/federation_four_source_rebind_preflight.py             --repo-root project             --commit "$GITHUB_SHA"             --out "$RUNNER_TEMP/four_source_rebind/FOUR_SOURCE_PREFIT_REBIND.json"
          sha256sum project/phase2/academic_transform/at0_en/v2_6/federation_four_source_rebind_preflight.py             > "$RUNNER_TEMP/four_source_rebind/SOURCE_SHA256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: federation-four-source-prefit-rebind
          path: ${{ runner.temp }}/four_source_rebind
          if-no-files-found: error
          retention-days: 90
