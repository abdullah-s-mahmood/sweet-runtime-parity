name: AT0 EN V2.6 R4.2D ONE span validity train calibration

on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/r42d_span_validity_train_trigger_v1.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: at0-en-v2-6-r4-2d-one-train-calibration
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: at0-en-v2.6-dev
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet numpy==1.26.4 torch==2.2.2 transformers==4.39.3 accelerate==0.28.0 safetensors==0.4.3 huggingface_hub==0.25.2 jax==0.4.25 jaxlib==0.4.25 flax==0.8.2
      - name: Acquire and verify safe base and frozen train dev
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r42d/model" "$RUNNER_TEMP/r42d/data"
          python - <<'PY'
          import hashlib, os, pathlib, urllib.request
          from huggingface_hub import snapshot_download
          files={
            "flax_model.msgpack":"2048c0dca92fe54cf2bec6c36972511ca04e546060307098139b19221dd4e93f",
            "config.json":"56bab767c02bc792897638feb8addc06d483d9c73769a5f554bbabea1f5507a1",
            "tokenizer_config.json":"53b6f42b8b8daddbdc6d3532c324187a92b46c1602bd6e8d4ad5a413b4fc90e1",
            "vocab.txt":"7b36651908a88bc38bda41b728b2a598191e0d3b553cbacf7b1e5f026d5b5b9f",
          }
          root=pathlib.Path(snapshot_download(repo_id="microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract",
            revision="d673b8835373c6fa116d6d8006b33d48734e305d",allow_patterns=list(files),
            local_dir=os.path.join(os.environ["RUNNER_TEMP"],"r42d","model"),local_dir_use_symlinks=False))
          for n,w in files.items():
              got=hashlib.sha256((root/n).read_bytes()).hexdigest()
              if got!=w: raise SystemExit(f"model hash mismatch {n}: {got}")
          if (root/"pytorch_model.bin").exists(): raise SystemExit("pickle forbidden")
          base="https://raw.githubusercontent.com/BIDS-Xu-Lab/section_specific_annotation_of_PICO/bc4b878773192f38b2600ec830ca4208b82f7dc0/data/EBM-NLPmod/fold1/"
          for n,w in [("train.txt","6491a57e5c8639e5bfc3c0326b8501869fccab655a1ed571b75a772dc1c70a5e"),
                      ("dev.txt","3b12534fedec35660587e6a5084b0b8ff11267c1da4a2f5afe9aa16c4941340a")]:
              raw=urllib.request.urlopen(base+n,timeout=30).read()
              got=hashlib.sha256(raw).hexdigest()
              if got!=w: raise SystemExit(f"data hash mismatch {n}: {got}")
              (pathlib.Path(os.environ["RUNNER_TEMP"])/"r42d"/"data"/n).write_bytes(raw)
          PY
      - name: Download frozen R4.2C models
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: at0-en-v2-6-r4-2c-boundary-consensus-train-calibration
          path: ${{ runner.temp }}/r42d/r42c
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37464774424
      - name: Download exact frozen R4.2B model
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: at0-en-v2-6-r4-2b-source-aligned-train-calibration
          path: ${{ runner.temp }}/r42d/r4b
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37409097042
      - name: Freeze trainer identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r42d"
          python -V > "$RUNNER_TEMP/r42d/RUNTIME.txt"
          python -m pip freeze | sort >> "$RUNNER_TEMP/r42d/RUNTIME.txt"
          sha256sum phase2/academic_transform/at0_en/v2_6/r4_2d_span_validity_train.py                     phase2/academic_transform/at0_en/v2_6/r4_2d_span_validity_preflight.py                     phase2/academic_transform/at0_en/v2_6/AT0_EN_V26_R4_2D_SPAN_VALIDITY_DESIGN_V1.md                     > "$RUNNER_TEMP/r42d/TRAINER_PROTOCOL_SHA256.txt"
      - name: Train validity guard and calibrate frozen consensus
        id: train_and_calibrate
        shell: bash
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          TOKENIZERS_PARALLELISM: "false"
          PYTHONUNBUFFERED: "1"
          PYTHONHASHSEED: "42"
        run: |
          set -euo pipefail
          python phase2/academic_transform/at0_en/v2_6/r4_2d_span_validity_train.py             --model-dir "$RUNNER_TEMP/r42d/model"             --r4b-model-dir "$RUNNER_TEMP/r42d/r4b/out/selected_model"             --boundary-model-dir "$RUNNER_TEMP/r42d/r42c/out/boundary_model"             --type-model-dir "$RUNNER_TEMP/r42d/r42c/out/span_model"             --train "$RUNNER_TEMP/r42d/data/train.txt"             --dev "$RUNNER_TEMP/r42d/data/dev.txt"             --out "$RUNNER_TEMP/r42d/out" > "$RUNNER_TEMP/r42d/TRAIN_STDOUT.json"
      - name: Finalize process status
        if: always()
        shell: bash
        env:
          STEP_OUTCOME: ${{ steps.train_and_calibrate.outcome }}
        run: |
          python - <<'PY'
          import datetime,json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"r42d"/"out"/"PROCESS_STATUS.json"
          if p.exists():
              d=json.loads(p.read_text())
              if d.get("state")=="RUNNING":
                  d["state"]="FAILED" if os.environ.get("STEP_OUTCOME")=="failure" else "CANCELLED"
                  d["failure_or_stall_reason"]="TRAIN_OR_CALIBRATION_STEP_DID_NOT_COMPLETE"
              d["terminal_observed_at"]=datetime.datetime.now(datetime.timezone.utc).isoformat()
              p.write_text(json.dumps(d,indent=2,sort_keys=True)+"\n")
              print(json.dumps(d,sort_keys=True))
          PY
      - name: Hash frozen outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/r42d/out" ]; then find "$RUNNER_TEMP/r42d/out" -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/r42d/OUTPUT_SHA256.txt" || true; fi
      - name: Upload R4.2D training evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: at0-en-v2-6-r4-2d-span-validity-train-calibration
          path: |
            ${{ runner.temp }}/r42d/RUNTIME.txt
            ${{ runner.temp }}/r42d/TRAINER_PROTOCOL_SHA256.txt
            ${{ runner.temp }}/r42d/TRAIN_STDOUT.json
            ${{ runner.temp }}/r42d/OUTPUT_SHA256.txt
            ${{ runner.temp }}/r42d/out/PROCESS_STATUS.json
            ${{ runner.temp }}/r42d/out/R4_2D_TRAIN_CALIBRATION_SUMMARY.json
            ${{ runner.temp }}/r42d/out/validity_model
          if-no-files-found: warn
          retention-days: 90
