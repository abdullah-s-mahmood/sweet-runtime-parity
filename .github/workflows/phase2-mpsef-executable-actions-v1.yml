name: Phase 2 MP-SEF Gold-Blind Executable Actions Legalizer v1

on:
  workflow_dispatch:
  push:
    branches:
      - phase2-arabic-eval
    paths:
      - ".github/workflows/phase2-mpsef-executable-actions-v1.yml"
      - "phase2/redesign/mpsef_executable_actions_legalizer_v1.py"

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  legalize:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download frozen P1/source artifact
        uses: actions/download-artifact@v4
        with:
          name: mpsef-p1-cf-proposals-v1
          path: p1
          repository: abdullah-s-mahmood/sweet-runtime-parity
          run-id: 36765798233
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download frozen P2 artifact
        uses: actions/download-artifact@v4
        with:
          name: mpsef-p2-cf-proposals-v1
          path: p2
          repository: abdullah-s-mahmood/sweet-runtime-parity
          run-id: 36768378938
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download completed P2 source-only generation trace
        uses: actions/download-artifact@v4
        with:
          name: mpsef-p2-generation-trace-v1
          path: p2trace
          repository: abdullah-s-mahmood/sweet-runtime-parity
          run-id: 36807862693
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate frozen input identities and trace integrity
        run: |
          test "$(sha256sum p1/MPSEF_CF_SOURCE_MANIFEST_V1.jsonl | awk '{print $1}')" = "051516cdce384c5fe50afb2ce80fe12d8cd8fb65b06ba31c3209301f91a7e193"
          test "$(sha256sum p1/MPSEF_P1_CF_PROPOSALS_V1.jsonl | awk '{print $1}')" = "2ff2ff6ed837e902eeea93856ce4753966e9ecec6b497b681ecc185b260e300d"
          test "$(sha256sum p2/MPSEF_P2_CF_PROPOSALS_V1.jsonl | awk '{print $1}')" = "f91ab2be10909851d16bc8139fcf6987259de627447c948c45c31c33449cf99b"
          python - <<'PY'
          import hashlib,json
          s=json.load(open("p2trace/MPSEF_P2_GENERATION_TRACE_V1_SUMMARY.json",encoding="utf-8"))
          p="p2trace/MPSEF_P2_GENERATION_TRACE_V1.jsonl"
          h=hashlib.sha256(open(p,"rb").read()).hexdigest()
          assert s["status"]=="TRACE_COMPLETE"
          assert s["cases"]==1918
          assert s["exact_frozen_output_matches"]==1918
          assert s["P2_proposal_sha256"]=="f91ab2be10909851d16bc8139fcf6987259de627447c948c45c31c33449cf99b"
          assert s["trace_jsonl_sha256"]==h
          assert s["gold_reference_consulted"] is False
          assert s["R_joint_computed"] is False
          print("LEGALIZER_INPUTS_AND_TRACE_OK",h)
          PY

      - name: Run legalizer synthetic self-test
        run: |
          cd phase2/redesign
          python mpsef_executable_actions_legalizer_v1.py --self-test

      - name: Run gold-blind legalizer with progress and ETA watchdog
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python phase2/redesign/run_with_progress_watchdog_v1.py \
            --state-file MPSEF_EXECUTABLE_ACTIONS_V1_PROGRESS.json \
            --context acad-pass/mpsef-legalizer \
            --poll-seconds 20 \
            --publish-seconds 60 \
            --stale-seconds 600 \
            -- \
            python phase2/redesign/mpsef_executable_actions_legalizer_v1.py \
              --source-manifest p1/MPSEF_CF_SOURCE_MANIFEST_V1.jsonl \
              --p1-proposals p1/MPSEF_P1_CF_PROPOSALS_V1.jsonl \
              --p2-proposals p2/MPSEF_P2_CF_PROPOSALS_V1.jsonl \
              --p2-generation-trace p2trace/MPSEF_P2_GENERATION_TRACE_V1.jsonl \
              --state-file MPSEF_EXECUTABLE_ACTIONS_V1_PROGRESS.json \
              --out-prefix MPSEF_EXECUTABLE_ACTIONS_V1

      - name: Validate source-only legalizer outputs
        run: |
          python - <<'PY'
          import json
          s=json.load(open("MPSEF_EXECUTABLE_ACTIONS_V1_SUMMARY.json",encoding="utf-8"))
          assert s["status"]=="LEGALIZER_COMPLETE"
          assert s["cases"]==1918 and s["clusters"]==764
          assert s["hypotheses"]==3836
          assert s["action_sets"]==1918
          assert 1 <= s["action_count_min"] <= s["action_count_max"] <= 3
          assert s["gold_reference_consulted"] is False
          assert s["reference_content_used"] is False
          assert s["R_joint_computed"] is False
          assert s["selector_trained"] is False
          assert s["internal_evaluation_opened"] is False
          assert s["stress_diagnostic_opened"] is False
          assert s["reserved_data_opened"] is False
          print("GOLD_BLIND_LEGALIZER_OUTPUTS_OK")
          print(json.dumps(s["state_counts"],sort_keys=True))
          PY

      - name: Record hashes
        if: always()
        run: |
          sha256sum \
            phase2/redesign/mpsef_executable_actions_legalizer_v1.py \
            phase2/redesign/process_progress_v1.py \
            phase2/redesign/run_with_progress_watchdog_v1.py \
            .github/workflows/phase2-mpsef-executable-actions-v1.yml \
            MPSEF_EXECUTABLE_ACTIONS_V1_HYPOTHESES.jsonl \
            MPSEF_EXECUTABLE_ACTIONS_V1_ACTION_SETS.jsonl \
            MPSEF_EXECUTABLE_ACTIONS_V1_SUMMARY.json \
            MPSEF_EXECUTABLE_ACTIONS_V1_PROGRESS.json \
            > MPSEF_EXECUTABLE_ACTIONS_V1_SHA256.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mpsef-executable-actions-v1
          path: |
            MPSEF_EXECUTABLE_ACTIONS_V1_HYPOTHESES.jsonl
            MPSEF_EXECUTABLE_ACTIONS_V1_ACTION_SETS.jsonl
            MPSEF_EXECUTABLE_ACTIONS_V1_SUMMARY.json
            MPSEF_EXECUTABLE_ACTIONS_V1_PROGRESS.json
            MPSEF_EXECUTABLE_ACTIONS_V1_SHA256.txt
          if-no-files-found: warn
          retention-days: 90
