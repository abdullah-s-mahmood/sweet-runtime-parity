name: Phase 2 MP-SEF V4.2 Consumption Guard Verification

on:
  push:
    branches: [phase2-arabic-eval]
    paths:
      - ".github/workflows/phase2-mpsef-v4-2-consumption-guard-preflight.yml"
      - "phase2/redesign/mpsef_rjoint_v4_2_consumption_guard_v1.py"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run source-free guard self-test
        run: |
          set -euo pipefail
          python phase2/redesign/mpsef_rjoint_v4_2_consumption_guard_v1.py --self-test             | tee V4_2_CONSUMPTION_GUARD_SELFTEST.log
          grep -q '"self_test": "PASS"' V4_2_CONSUMPTION_GUARD_SELFTEST.log

      - name: Publish guard verification and SHA256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          GUARD_SHA="$(sha256sum phase2/redesign/mpsef_rjoint_v4_2_consumption_guard_v1.py | awk '{print $1}')"
          post_status () {
            curl -fsSL -X POST               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/abdullah-s-mahmood/sweet-runtime-parity/statuses/$SHA"               -d "{\"state\":\"success\",\"context\":\"$1\",\"description\":\"$2\"}"
          }
          post_status "acad-pass/v4-2-consumption-guard-valid" "V4.2 one-shot consumption guard self-test PASS"
          post_status "acad-pass/v4-2-consumption-guard-sha256/$GUARD_SHA" "V4.2 consumption guard SHA256"
