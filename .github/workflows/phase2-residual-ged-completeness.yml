name: Phase 2 Residual GED Completeness Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - phase2-arabic-eval
    paths:
      - "phase2/generalization/run_residual_ged_completeness.py"
      - "phase2/generalization/evaluate_residual_ged_completeness.py"
      - ".github/workflows/phase2-residual-ged-completeness.yml"

permissions:
  contents: write
  actions: read

jobs:
  diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-arabic-eval
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install frozen GED runtime
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu torch==1.12.1+cpu
          python -m pip install "transformers==4.30.0" "huggingface_hub<1.0" "numpy<2"
      - name: Download frozen AraBART candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: ortho-val-arabart-q14
          path: artifacts/arabart
          repository: abdullah-s-mahmood/sweet-runtime-parity
          run-id: 36520233398
          github-token: ${{ github.token }}
      - name: Download pinned QALB15 TRAIN RAW only
        run: |
          D="upstream/arabic-gec/data/gec/QALB-0.9.1-Dec03-2021-SharedTasks/data/2015/train"
          mkdir -p "$D"
          curl -fsSL "https://raw.githubusercontent.com/CAMeL-Lab/arabic-gec/8c7fb84f3ed84d1d30beb7080b02d0f6bfe1c5bf/data/gec/QALB-0.9.1-Dec03-2021-SharedTasks/data/2015/train/QALB-2015-L2-Train.sent.no_ids" -o "$D/QALB-2015-L2-Train.sent.no_ids"
          test ! -f "$D/QALB-2015-L2-Train.cor.no_ids"
      - name: Materialize residual GED features before labels
        run: |
          set -o pipefail
          PYTHONPATH=. python phase2/generalization/run_residual_ged_completeness.py 2>&1 | tee RESIDUAL_GED_COMPLETENESS_CONSOLE.txt
          test -f PHASE2_RESIDUAL_GED_COMPLETENESS_FEATURES.jsonl
          test -f PHASE2_RESIDUAL_GED_COMPLETENESS_RUNTIME.json
      - name: Leakage audit before evaluation
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in [Path("PHASE2_RESIDUAL_GED_COMPLETENESS_FEATURES.jsonl"),Path("PHASE2_RESIDUAL_GED_COMPLETENESS_RUNTIME.json")]:
              s=p.read_text(encoding="utf-8")
              assert not any("\u0600"<=c<="\u06ff" for c in s),p
          print("pre-label leakage audit PASS")
          PY
      - name: Evaluate against consumed manual labels
        run: |
          PYTHONPATH=. python phase2/generalization/evaluate_residual_ged_completeness.py
          test -f PHASE2_RESIDUAL_GED_COMPLETENESS_RESULTS.json
      - name: Persist safe diagnostic evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PHASE2_RESIDUAL_GED_COMPLETENESS_FEATURES.jsonl PHASE2_RESIDUAL_GED_COMPLETENESS_RUNTIME.json PHASE2_RESIDUAL_GED_COMPLETENESS_RESULTS.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Record residual GED completeness diagnostic [skip ci]"
            git pull --rebase origin phase2-arabic-eval
            git push origin HEAD:phase2-arabic-eval
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-residual-ged-completeness
          path: |
            PHASE2_RESIDUAL_GED_COMPLETENESS_FEATURES.jsonl
            PHASE2_RESIDUAL_GED_COMPLETENESS_RUNTIME.json
            PHASE2_RESIDUAL_GED_COMPLETENESS_RESULTS.json
            RESIDUAL_GED_COMPLETENESS_CONSOLE.txt
          if-no-files-found: warn
          retention-days: 30
