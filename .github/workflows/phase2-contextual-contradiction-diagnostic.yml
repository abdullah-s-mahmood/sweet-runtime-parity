name: Phase 2 Contextual Contradiction Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - phase2-arabic-eval
    paths:
      - "phase2/generalization/CONTEXTUAL_CONTRADICTION_DIAGNOSTIC_PROTOCOL.md"
      - "phase2/generalization/CONTEXTUAL_CONTRADICTION_RESEARCH_START.md"
      - "phase2/generalization/CONTEXTUAL_CONTRADICTION_BRAINSTORM_START.md"
      - "phase2/generalization/run_contextual_contradiction_diagnostic.py"
      - "phase2/generalization/evaluate_contextual_contradiction_diagnostic.py"
      - ".github/workflows/phase2-contextual-contradiction-diagnostic.yml"

permissions:
  contents: write
  actions: read

jobs:
  contradiction-diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CAMELTOOLS_DATA: ${{ github.workspace }}/.camel_tools
      HF_HUB_DISABLE_TELEMETRY: "1"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout project branch
        uses: actions/checkout@v4
        with:
          ref: phase2-arabic-eval
          fetch-depth: 0

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Clone and pin Arabic-GEC upstream
        run: |
          mkdir -p upstream
          git clone https://github.com/CAMeL-Lab/arabic-gec.git upstream/arabic-gec
          git -C upstream/arabic-gec checkout 8c7fb84f3ed84d1d30beb7080b02d0f6bfe1c5bf
          test "$(git -C upstream/arabic-gec rev-parse HEAD)" = "8c7fb84f3ed84d1d30beb7080b02d0f6bfe1c5bf"
          test -f upstream/arabic-gec/data/gec/QALB-0.9.1-Dec03-2021-SharedTasks/data/2015/train/QALB-2015-L2-Train.sent.no_ids

      - name: Download frozen cross-model agreement artifact
        run: |
          mkdir -p artifacts/agreement
          gh run download 36484171517 \
            --repo "$GITHUB_REPOSITORY" \
            --name phase2-cross-model-agreement-internal \
            --dir artifacts/agreement
          test -f artifacts/agreement/artifacts/CROSS_MODEL_AGREEMENT_FEATURES.jsonl
          echo "Frozen agreement SHA:"
          sha256sum artifacts/agreement/artifacts/CROSS_MODEL_AGREEMENT_FEATURES.jsonl
          test "$(sha256sum artifacts/agreement/artifacts/CROSS_MODEL_AGREEMENT_FEATURES.jsonl | awk '{print $1}')" = "d66a5ab3c6b9e1527b7a1a59ddce0f843a864281e70106cacd58d00315741c4c"

      - name: Install frozen GED and morphology runtime
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==1.11.0+cpu"
          python -m pip install "camel-tools==1.4.1" "cachetools==4.2.4" "sentencepiece==0.1.99" "protobuf==3.20.3" "numpy<2"
          python -m pip uninstall -y transformers || true
          python -m pip install -e upstream/arabic-gec/transformers
          python -m pip install "huggingface_hub>=0.9,<1.0"
          mkdir -p "$CAMELTOOLS_DATA" artifacts
          camel_data -i morphology-db-msa-r13
          camel_data -i disambig-bert-unfactored-msa

      - name: Materialize gold-blind contextual contradiction features
        run: |
          set -o pipefail
          PYTHONPATH=. python phase2/generalization/run_contextual_contradiction_diagnostic.py 2>&1 | tee artifacts/CONTEXTUAL_CONTRADICTION_RUNTIME_CONSOLE.txt
          test -f artifacts/CONTEXTUAL_CONTRADICTION_FEATURES.jsonl
          test -f artifacts/CONTEXTUAL_CONTRADICTION_RUNTIME.json
          sha256sum artifacts/CONTEXTUAL_CONTRADICTION_FEATURES.jsonl artifacts/CONTEXTUAL_CONTRADICTION_RUNTIME.json | tee artifacts/CONTEXTUAL_CONTRADICTION_FROZEN_SHA256.txt

      - name: Evaluate frozen flags against prior hash-only adjudication
        run: |
          set -o pipefail
          PYTHONPATH=. python phase2/generalization/evaluate_contextual_contradiction_diagnostic.py 2>&1 | tee artifacts/CONTEXTUAL_CONTRADICTION_EVAL_CONSOLE.txt
          test -f PHASE2_CONTEXTUAL_CONTRADICTION_DIAGNOSTIC_RESULTS.json

      - name: Audit result constraints
        run: |
          python - <<'PY'
          import json
          p="PHASE2_CONTEXTUAL_CONTRADICTION_DIAGNOSTIC_RESULTS.json"
          x=json.load(open(p,encoding="utf-8"))
          assert x["diagnostic_only"] is True
          assert x["same_consumed_cross_corpus_slice"] is True
          assert x["runtime_features_materialized_before_manual_labels_loaded"] is True
          assert x["qalb15_test_read"] is False
          assert x["rows"] == 159
          print("Diagnostic contract PASS")
          PY

      - name: Persist compact diagnostic result safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PHASE2_CONTEXTUAL_CONTRADICTION_DIAGNOSTIC_RESULTS.json
          if git diff --cached --quiet; then
            echo "Contextual contradiction diagnostic unchanged."
          else
            git commit -m "Record contextual contradiction diagnostic evidence [skip ci]"
            git pull --rebase origin phase2-arabic-eval
            git push origin HEAD:phase2-arabic-eval
          fi

      - name: Upload short-lived diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-contextual-contradiction-diagnostic
          path: |
            artifacts/CONTEXTUAL_CONTRADICTION_RUNTIME.json
            artifacts/CONTEXTUAL_CONTRADICTION_FROZEN_SHA256.txt
            PHASE2_CONTEXTUAL_CONTRADICTION_DIAGNOSTIC_RESULTS.json
          if-no-files-found: warn
          retention-days: 7
