name: Federation public source schema audit

on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/federation_source_schema_audit_trigger.txt'

permissions:
  contents: read

concurrency:
  group: federation-source-schema-audit
  cancel-in-progress: false

jobs:
  schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1, path: project}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ebmlab/EvidenceOutcomes
          ref: bafa355449b6b6feb64f3ca46c1d3268dead13d4
          path: evidence
          fetch-depth: 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: pathology-dynamics/trialsieve_final
          ref: 62dd931124e36a8c1d9dc4a2469893553d90d2e4
          path: trialsieve
          fetch-depth: 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: sociocom/PICO-Corpus
          ref: 482b7d8f135fe6ea424961c2812e8d214c3f4a5f
          path: pico
          fetch-depth: 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: bepnye/EBM-NLP
          ref: 43a4a1ea3f0a21cfb8820c040b843dfaf66192d0
          path: ebm
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.16'}
      - name: Aggregate-only schema audit
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/schema" "$RUNNER_TEMP/schema_work"
          python project/phase2/academic_transform/at0_en/v2_6/federation_source_schema_audit.py             --evidence evidence --trialsieve trialsieve --pico pico --ebm ebm             --work "$RUNNER_TEMP/schema_work"             --out "$RUNNER_TEMP/schema/FEDERATION_SOURCE_SCHEMA_AUDIT.json"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"schema/FEDERATION_SOURCE_SCHEMA_AUDIT.json"
          d=json.loads(p.read_text())
          assert d["state"]=="FEDERATION_SOURCE_SCHEMA_AUDIT_PASS"
          assert d["raw_examples_emitted"] is False
          assert d["benchmark_metrics_computed"] is False
          PY
          sha256sum project/phase2/academic_transform/at0_en/v2_6/federation_source_schema_audit.py             > "$RUNNER_TEMP/schema/SOURCE_SHA256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: federation-public-source-schema-audit
          path: ${{ runner.temp }}/schema
          if-no-files-found: error
          retention-days: 90
