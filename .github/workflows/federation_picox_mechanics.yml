name: Federation adapted PICOX mechanics preflight
on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/federation_picox_mechanics_trigger.txt'
permissions:
  contents: read
jobs:
  mechanics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.16'}
      - run: python -m py_compile phase2/academic_transform/at0_en/v2_6/federation_picox_mechanics.py
      - run: |
          mkdir -p "$RUNNER_TEMP/picox"
          python phase2/academic_transform/at0_en/v2_6/federation_picox_mechanics.py --out "$RUNNER_TEMP/picox/PICOX_MECHANICS_PREFLIGHT.json"
          sha256sum phase2/academic_transform/at0_en/v2_6/federation_picox_mechanics.py phase2/academic_transform/at0_en/v2_6/AT0_EN_V26_PICOX_FOUR_CLASS_ADAPTED_COMPARATOR_FREEZE_V1.md > "$RUNNER_TEMP/picox/SOURCE_SHA256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: federation-picox-mechanics-preflight
          path: ${{ runner.temp }}/picox
          if-no-files-found: error
          retention-days: 90
