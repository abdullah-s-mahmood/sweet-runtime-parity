name: Federation EBM PMID mapping feasibility custody audit

on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/federation_ebm_pmid_mapping_trigger.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: federation-ebm-pmid-mapping
  cancel-in-progress: false

jobs:
  map:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          path: project
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: BIDS-Xu-Lab/section_specific_annotation_of_PICO
          ref: bc4b878773192f38b2600ec830ca4208b82f7dc0
          path: bids
          fetch-depth: 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: bepnye/EBM-NLP
          ref: 43a4a1ea3f0a21cfb8820c040b843dfaf66192d0
          path: ebm
          fetch-depth: 1
      - name: Download frozen R44 manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r44-oof-readonly-preflight
          path: ${{ runner.temp }}/r44
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37572165532
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Verify source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C bids rev-parse HEAD)" = "bc4b878773192f38b2600ec830ca4208b82f7dc0"
          test "$(git -C ebm rev-parse HEAD)" = "43a4a1ea3f0a21cfb8820c040b843dfaf66192d0"
          test "$(sha256sum bids/data/EBM-NLPmod/fold1/train.txt | awk '{print $1}')" = "6491a57e5c8639e5bfc3c0326b8501869fccab655a1ed571b75a772dc1c70a5e"
          test -f ebm/ebm_nlp_2_00.tar.gz
          test -f "$RUNNER_TEMP/r44/R44_OOF_MANIFEST_V1.json"
      - name: Run isolated PMID mapping feasibility audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/map_out" "$RUNNER_TEMP/ebm_extract"
          python project/phase2/academic_transform/at0_en/v2_6/federation_ebm_pmid_mapping_custody.py             --mod-train bids/data/EBM-NLPmod/fold1/train.txt             --r44-manifest "$RUNNER_TEMP/r44/R44_OOF_MANIFEST_V1.json"             --ebm-archive ebm/ebm_nlp_2_00.tar.gz             --work "$RUNNER_TEMP/ebm_extract"             --out "$RUNNER_TEMP/map_out/FEDERATION_EBM_PMID_MAPPING_FEASIBILITY.json"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"map_out/FEDERATION_EBM_PMID_MAPPING_FEASIBILITY.json"
          d=json.loads(p.read_text())
          assert d["output_contains_pmids"] is False
          assert d["output_contains_protected_text"] is False
          assert d["output_contains_gold_labels"] is False
          PY
          sha256sum project/phase2/academic_transform/at0_en/v2_6/federation_ebm_pmid_mapping_custody.py             > "$RUNNER_TEMP/map_out/SOURCE_SHA256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: federation-ebm-pmid-mapping-feasibility
          path: ${{ runner.temp }}/map_out
          if-no-files-found: error
          retention-days: 90
