name: Federation model-tokenizer identity preflight

on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/federation_tokenizer_identity_trigger.txt'

permissions:
  contents: read

concurrency:
  group: federation-tokenizer-identity
  cancel-in-progress: false

jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: requirements/federation_tokenizer_identity.txt
      - name: Install pinned tokenizer runtime
        run: python -m pip install --disable-pip-version-check --quiet -r requirements/federation_tokenizer_identity.txt
      - name: Model/tokenizer revision and fixture identity
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/identity"
          python phase2/academic_transform/at0_en/v2_6/federation_model_tokenizer_identity.py             > "$RUNNER_TEMP/identity/FEDERATION_MODEL_TOKENIZER_IDENTITY.json"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"identity/FEDERATION_MODEL_TOKENIZER_IDENTITY.json"
          d=json.loads(p.read_text())
          assert d["state"]=="FEDERATION_MODEL_TOKENIZER_IDENTITY_PREFLIGHT_PASS"
          assert set(d["models"])=={"BASE","MODERN","PICOX"}
          assert all(v["is_fast"] for v in d["models"].values())
          PY
          sha256sum             phase2/academic_transform/at0_en/v2_6/federation_model_tokenizer_identity.py             phase2/academic_transform/at0_en/v2_6/AT0_EN_V26_FEDERATION_MODEL_TOKENIZER_RUNTIME_IDENTITY_V1.json             requirements/federation_tokenizer_identity.txt             > "$RUNNER_TEMP/identity/SOURCE_SHA256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: federation-model-tokenizer-identity-preflight
          path: ${{ runner.temp }}/identity
          if-no-files-found: error
          retention-days: 90
