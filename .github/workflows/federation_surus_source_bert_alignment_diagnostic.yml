name: Federation SURUS source BERT tokenizer alignment diagnostic
on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/federation_surus_source_bert_alignment_trigger.txt'
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1, path: project}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: surus-ai/dataset
          ref: 3a61790d5c304dea95fb278f76cc3b1a0ca07564
          path: surus
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.16'}
      - name: Install frozen tokenizer runtime
        run: |
          python -m pip install --upgrade 'pip<25'
          python -m pip install transformers==4.48.0 tokenizers==0.21.0 huggingface_hub==0.28.1
          python -m pip check
      - name: Run source-tokenizer aggregate diagnostic
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          mkdir -p "$RUNNER_TEMP/surussourcebert"
          python project/phase2/academic_transform/at0_en/v2_6/federation_surus_source_bert_alignment_diagnostic.py --root surus --out "$RUNNER_TEMP/surussourcebert/SURUS_SOURCE_BERT_ALIGNMENT_DIAGNOSTIC.json"
          sha256sum project/phase2/academic_transform/at0_en/v2_6/federation_surus_source_bert_alignment_diagnostic.py > "$RUNNER_TEMP/surussourcebert/SOURCE_SHA256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: federation-surus-source-bert-alignment-diagnostic
          path: ${{ runner.temp }}/surussourcebert
          if-no-files-found: error
          retention-days: 90
