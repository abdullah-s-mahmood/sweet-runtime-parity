name: AT0 EN V2.6 R4.2C tokenizer capacity audit

on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/r42c_tokenizer_capacity_audit_trigger_v1.txt'

permissions:
  contents: read

concurrency:
  group: at0-en-v2-6-r4-2c-tokenizer-capacity-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: at0-en-v2.6-dev
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install exact tokenizer runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet transformers==4.39.3 tokenizers==0.15.2 huggingface_hub==0.25.2

      - name: Acquire exact tokenizer files and frozen train/dev
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r42c-cap/model" "$RUNNER_TEMP/r42c-cap/data"
          python - <<'PY'
          import hashlib, os, pathlib, urllib.request
          from huggingface_hub import snapshot_download

          files={
            "config.json":"56bab767c02bc792897638feb8addc06d483d9c73769a5f554bbabea1f5507a1",
            "tokenizer_config.json":"53b6f42b8b8daddbdc6d3532c324187a92b46c1602bd6e8d4ad5a413b4fc90e1",
            "vocab.txt":"7b36651908a88bc38bda41b728b2a598191e0d3b553cbacf7b1e5f026d5b5b9f",
          }
          root=pathlib.Path(snapshot_download(
              repo_id="microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract",
              revision="d673b8835373c6fa116d6d8006b33d48734e305d",
              allow_patterns=list(files),
              local_dir=os.path.join(os.environ["RUNNER_TEMP"],"r42c-cap","model"),
              local_dir_use_symlinks=False))
          for n,w in files.items():
              got=hashlib.sha256((root/n).read_bytes()).hexdigest()
              if got!=w: raise SystemExit(f"model tokenizer hash mismatch {n}: {got}")

          base="https://raw.githubusercontent.com/BIDS-Xu-Lab/section_specific_annotation_of_PICO/bc4b878773192f38b2600ec830ca4208b82f7dc0/data/EBM-NLPmod/fold1/"
          for n,w in [
              ("train.txt","6491a57e5c8639e5bfc3c0326b8501869fccab655a1ed571b75a772dc1c70a5e"),
              ("dev.txt","3b12534fedec35660587e6a5084b0b8ff11267c1da4a2f5afe9aa16c4941340a")]:
              raw=urllib.request.urlopen(base+n,timeout=30).read()
              got=hashlib.sha256(raw).hexdigest()
              if got!=w: raise SystemExit(f"data hash mismatch {n}: {got}")
              (pathlib.Path(os.environ["RUNNER_TEMP"])/"r42c-cap"/"data"/n).write_bytes(raw)
          PY

      - name: Run read-only full train/dev tokenizer capacity audit
        shell: bash
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          TOKENIZERS_PARALLELISM: "false"
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python phase2/academic_transform/at0_en/v2_6/r4_2c_tokenizer_capacity_audit.py \
            --train "$RUNNER_TEMP/r42c-cap/data/train.txt" \
            --dev "$RUNNER_TEMP/r42c-cap/data/dev.txt" \
            --model-dir "$RUNNER_TEMP/r42c-cap/model" \
            --out "$RUNNER_TEMP/r42c-cap/out" | tee "$RUNNER_TEMP/r42c-cap/AUDIT_STDOUT.json"

      - name: Freeze audit hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sha256sum phase2/academic_transform/at0_en/v2_6/r4_2c_tokenizer_capacity_audit.py > "$RUNNER_TEMP/r42c-cap/AUDIT_SCRIPT_SHA256.txt"
          if [ -d "$RUNNER_TEMP/r42c-cap/out" ]; then
            find "$RUNNER_TEMP/r42c-cap/out" -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/r42c-cap/OUTPUT_SHA256.txt" || true
          fi

      - name: Upload tokenizer capacity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: at0-en-v2-6-r4-2c-tokenizer-capacity-audit
          path: |
            ${{ runner.temp }}/r42c-cap/AUDIT_STDOUT.json
            ${{ runner.temp }}/r42c-cap/AUDIT_SCRIPT_SHA256.txt
            ${{ runner.temp }}/r42c-cap/OUTPUT_SHA256.txt
            ${{ runner.temp }}/r42c-cap/out/R4_2C_TOKENIZER_CAPACITY_AUDIT.json
            ${{ runner.temp }}/r42c-cap/out/PROCESS_STATUS.json
          if-no-files-found: warn
          retention-days: 90
