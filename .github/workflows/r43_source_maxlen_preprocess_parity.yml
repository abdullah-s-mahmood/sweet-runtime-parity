name: R43 source maxlen preprocessing parity
on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/r43_source_maxlen_trigger.txt'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: at0-en-v2.6-dev
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install tokenizer runtime
        run: pip install --quiet transformers==4.39.3 huggingface_hub==0.25.2
      - name: Acquire pinned TRAIN and tokenizer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r43/data" "$RUNNER_TEMP/r43/tokenizer"
          python - <<'PY'
          import pathlib,urllib.request,hashlib,os
          from huggingface_hub import snapshot_download
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"r43"
          b=urllib.request.urlopen("https://raw.githubusercontent.com/BIDS-Xu-Lab/section_specific_annotation_of_PICO/bc4b878773192f38b2600ec830ca4208b82f7dc0/data/EBM-NLPmod/fold1/train.txt",timeout=30).read()
          assert hashlib.sha256(b).hexdigest()=="6491a57e5c8639e5bfc3c0326b8501869fccab655a1ed571b75a772dc1c70a5e"
          (root/"data/train.txt").write_bytes(b)
          snapshot_download(repo_id="microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract",
              revision="d673b8835373c6fa116d6d8006b33d48734e305d",
              allow_patterns=["tokenizer_config.json","vocab.txt","config.json"],
              local_dir=str(root/"tokenizer"),local_dir_use_symlinks=False)
          v=(root/"tokenizer/vocab.txt").read_bytes()
          assert hashlib.sha256(v).hexdigest()=="7b36651908a88bc38bda41b728b2a598191e0d3b553cbacf7b1e5f026d5b5b9f"
          PY
      - name: Run TRAIN-only source preprocessing parity
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/r43/out"
          python phase2/academic_transform/at0_en/v2_6/r43_source_maxlen_preprocess_parity.py             --train "$RUNNER_TEMP/r43/data/train.txt"             --tokenizer-dir "$RUNNER_TEMP/r43/tokenizer"             --out "$RUNNER_TEMP/r43/out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r43-source-maxlen-preprocess-parity
          path: ${{ runner.temp }}/r43/out
          if-no-files-found: error
          retention-days: 90
