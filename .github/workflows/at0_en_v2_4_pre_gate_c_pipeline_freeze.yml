name: AT0-EN V2.4 Pre-Gate-C Pipeline Freeze

on:
  push:
    branches:
      - phase2-arabic-eval
    paths:
      - "phase2/academic_transform/at0_en/v2_4/pre_gate_c/PRE_GATE_C_PIPELINE_FREEZE_TRIGGER_V1.txt"

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify frozen runtime identity
        run: |
          set -euo pipefail
          python phase2/academic_transform/at0_en/v2_4/pre_gate_c/check_pre_gate_c_pipeline_freeze.py
      - name: Freeze hashes
        run: |
          set -euo pipefail
          cd phase2/academic_transform/at0_en/v2_4/pre_gate_c
          sha256sum             PRE_GATE_C_PIPELINE_FREEZE_MANIFEST_V1.json             check_pre_gate_c_pipeline_freeze.py             PRE_GATE_C_PIPELINE_FREEZE_INTEGRITY_SUMMARY.json             > PRE_GATE_C_PIPELINE_FREEZE_SHA256.txt
          cat PRE_GATE_C_PIPELINE_FREEZE_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: at0-en-v2-4-pre-gate-c-pipeline-freeze-${{ github.run_id }}
          path: |
            phase2/academic_transform/at0_en/v2_4/pre_gate_c/PRE_GATE_C_PIPELINE_FREEZE_INTEGRITY_SUMMARY.json
            phase2/academic_transform/at0_en/v2_4/pre_gate_c/PRE_GATE_C_PIPELINE_FREEZE_SHA256.txt
          retention-days: 30
          if-no-files-found: error
