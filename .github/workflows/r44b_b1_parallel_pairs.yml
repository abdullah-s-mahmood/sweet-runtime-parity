name: R44-B B1 parallel pair-exclusion upstream

on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/r44b_b1_pairs_trigger.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: r44b-b1-parallel-pairs
  cancel-in-progress: false

jobs:
  precheck:
    name: R44-B B1 frozen precheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r44b-b1-preflight
          path: ${{ runner.temp }}/preflight
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37682982987
      - name: Verify preflight authorization boundary
        run: |
          python - <<'PY'
          import json, pathlib, os
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"preflight/R44B_B1_PREFLIGHT.json"
          d=json.loads(p.read_text())
          assert d["state"]=="R44B_B1_PREFLIGHT_PASS"
          assert d["logical_inner_upstream_fits"]==20
          assert d["unique_physical_pair_upstream_fits"]==10
          assert d["verify_internal_accessed"] is False
          assert d["old_select_accessed"] is False
          assert d["protected_data_accessed"] is False
          print("R44B_B1_FROZEN_PRECHECK_PASS")
          PY

  pair:
    name: R44-B pair ${{ matrix.pair }}
    needs: precheck
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: true
      max-parallel: 10
      matrix:
        pair: ['0-1','0-2','0-3','0-4','1-2','1-3','1-4','2-3','2-4','3-4']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements/r44a_fold_fast.txt
      - name: Install frozen upstream runtime
        run: python -m pip install --disable-pip-version-check --quiet -r requirements/r44a_fold_fast.txt

      - name: Download frozen R44 manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r44-oof-readonly-preflight
          path: ${{ runner.temp }}/r44b/preflight
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37572165532
      - name: Download frozen DESIGN-only source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r44-design-source-only
          path: ${{ runner.temp }}/r44b/design
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37572893091
      - name: Download immutable converted BiomedBERT
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r44-immutable-converted-biomedbert-base
          path: ${{ runner.temp }}/r44b/base
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37596247997

      - name: Train pair-exclusion ancestors and infer both excluded sides
        shell: bash
        env:
          TOKENIZERS_PARALLELISM: "false"
          PYTHONHASHSEED: "44"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          python phase2/academic_transform/at0_en/v2_6/r44b_pair_upstream_train.py             --preconverted-base "$RUNNER_TEMP/r44b/base"             --design-source "$RUNNER_TEMP/r44b/design/R44_DESIGN_SOURCE.json"             --design-summary "$RUNNER_TEMP/r44b/design/R44_DESIGN_SOURCE_SUMMARY.json"             --manifest "$RUNNER_TEMP/r44b/preflight/R44_OOF_MANIFEST_V1.json"             --pair "${{ matrix.pair }}"             --out "$RUNNER_TEMP/r44b/out"

      - name: Preserve terminal status
        if: always()
        shell: bash
        env:
          PAIR: ${{ matrix.pair }}
          STEP_OUTCOME: ${{ job.status }}
        run: |
          python - <<'PY'
          import datetime,json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"r44b/out/PROCESS_STATUS.json"
          if p.exists():
              d=json.loads(p.read_text())
              if d.get("state")=="RUNNING":
                  d["state"]="FAILED" if os.environ["STEP_OUTCOME"]=="failure" else "CANCELLED"
                  d["failure_or_stall_reason"]="PAIR_UPSTREAM_DID_NOT_COMPLETE"
                  d["terminal_observed_at"]=datetime.datetime.now(datetime.timezone.utc).isoformat()
                  p.write_text(json.dumps(d,indent=2,sort_keys=True)+"\n")
          PY

      - name: Freeze pair output hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r44b/evidence"
          if [ -d "$RUNNER_TEMP/r44b/out" ]; then
            find "$RUNNER_TEMP/r44b/out" -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/r44b/evidence/OUTPUT_SHA256.txt" || true
          fi
          sha256sum             phase2/academic_transform/at0_en/v2_6/r44b_pair_upstream_train.py             phase2/academic_transform/at0_en/v2_6/r44a_oof_fold_train.py             phase2/academic_transform/at0_en/v2_6/AT0_EN_V26_R44B_B1_NESTED_PROTOCOL_FREEZE_V1.md             phase2/academic_transform/at0_en/v2_6/AT0_EN_V26_R44B_B1_PAIR_UPSTREAM_AUTHORIZATION_V1.md             > "$RUNNER_TEMP/r44b/evidence/PROTOCOL_SHA256.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r44b-pair-${{ matrix.pair }}
          path: |
            ${{ runner.temp }}/r44b/out/R44B_PAIR_*_SUMMARY.json
            ${{ runner.temp }}/r44b/out/R44B_PAIR_*_CANDIDATES.jsonl
            ${{ runner.temp }}/r44b/out/PROCESS_STATUS.json
            ${{ runner.temp }}/r44b/evidence/OUTPUT_SHA256.txt
            ${{ runner.temp }}/r44b/evidence/PROTOCOL_SHA256.txt
          if-no-files-found: warn
          retention-days: 90

  context_cache:
    name: R44-B immutable base context cache
    needs: precheck
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements/r44a_fold_fast.txt
      - name: Install frozen context runtime
        run: python -m pip install --disable-pip-version-check --quiet -r requirements/r44a_fold_fast.txt
      - name: Download DESIGN source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r44-design-source-only
          path: ${{ runner.temp }}/r44b/design
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37572893091
      - name: Download immutable converted BiomedBERT
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r44-immutable-converted-biomedbert-base
          path: ${{ runner.temp }}/r44b/base
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37596247997
      - name: Build label-independent float32 context cache
        env:
          TOKENIZERS_PARALLELISM: "false"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          python phase2/academic_transform/at0_en/v2_6/r44b_base_context_cache.py             --base "$RUNNER_TEMP/r44b/base"             --design-source "$RUNNER_TEMP/r44b/design/R44_DESIGN_SOURCE.json"             --design-summary "$RUNNER_TEMP/r44b/design/R44_DESIGN_SOURCE_SUMMARY.json"             --out "$RUNNER_TEMP/r44b/context"
          sha256sum "$RUNNER_TEMP/r44b/context/"* > "$RUNNER_TEMP/r44b/context/SHA256SUMS.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r44b-base-context-cache
          path: ${{ runner.temp }}/r44b/context
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: R44-B pair-bank nested assembly audit
    needs: pair
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Download all current pair artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: r44b-pair-*
          path: ${{ runner.temp }}/r44b/pairs
      - name: Download frozen R44 manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r44-oof-readonly-preflight
          path: ${{ runner.temp }}/r44b/preflight
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37572165532
      - name: Download frozen R44-A aggregate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r44a-oof-candidate-bank
          path: ${{ runner.temp }}/r44b/r44a
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37581447046
      - name: Assemble five leakage-safe nested meta/eval banks
        run: |
          set -euo pipefail
          python phase2/academic_transform/at0_en/v2_6/r44b_pair_aggregate.py             --pairs-root "$RUNNER_TEMP/r44b/pairs"             --manifest "$RUNNER_TEMP/r44b/preflight/R44_OOF_MANIFEST_V1.json"             --r44a-bank "$RUNNER_TEMP/r44b/r44a/R44A_OOF_CANDIDATE_BANK.jsonl"             --out "$RUNNER_TEMP/r44b/aggregate"
          sha256sum "$RUNNER_TEMP/r44b/aggregate/"* > "$RUNNER_TEMP/r44b/aggregate/SHA256SUMS.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r44b-b1-nested-banks
          path: ${{ runner.temp }}/r44b/aggregate
          if-no-files-found: error
          retention-days: 90
