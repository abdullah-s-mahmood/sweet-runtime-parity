name: FREE-SPEED V1 repository static audit
on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/free_speed_v1_trigger.txt'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: at0-en-v2.6-dev
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Scan all workflows without modifying them
        run: python scripts/free_speed_v1_audit.py
      - name: Freeze report hashes
        run: |
          sha256sum free_speed_v1/FREE_SPEED_V1_WORKFLOW_INVENTORY.json free_speed_v1/FREE_SPEED_V1_REPORT.md > free_speed_v1/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: free-speed-v1-static-audit
          path: free_speed_v1
          if-no-files-found: error
          retention-days: 90
