name: Prepare immutable R44 converted BiomedBERT base
on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/r44_prepare_converted_base_trigger.txt'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: at0-en-v2.6-dev
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install conversion runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet             numpy==1.26.4 torch==2.2.2 transformers==4.39.3 safetensors==0.4.3             huggingface_hub==0.25.2 jax==0.4.25 jaxlib==0.4.25 flax==0.8.2
      - name: Download, verify, convert once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r44/source" "$RUNNER_TEMP/r44/converted"
          python - <<'PY'
          import hashlib, pathlib, os
          from huggingface_hub import snapshot_download
          from transformers import BertModel, AutoTokenizer

          src=pathlib.Path(os.environ["RUNNER_TEMP"])/"r44/source"
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"r44/converted"
          expected={
            "flax_model.msgpack":"2048c0dca92fe54cf2bec6c36972511ca04e546060307098139b19221dd4e93f",
            "config.json":"56bab767c02bc792897638feb8addc06d483d9c73769a5f554bbabea1f5507a1",
            "tokenizer_config.json":"53b6f42b8b8daddbdc6d3532c324187a92b46c1602bd6e8d4ad5a413b4fc90e1",
            "vocab.txt":"7b36651908a88bc38bda41b728b2a598191e0d3b553cbacf7b1e5f026d5b5b9f",
          }
          snapshot_download(
              repo_id="microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract",
              revision="d673b8835373c6fa116d6d8006b33d48734e305d",
              allow_patterns=list(expected),
              local_dir=str(src),local_dir_use_symlinks=False)
          for name,want in expected.items():
              got=hashlib.sha256((src/name).read_bytes()).hexdigest()
              if got!=want: raise SystemExit(f"{name} mismatch {got}")
          model=BertModel.from_pretrained(src,from_flax=True,local_files_only=True)
          model.save_pretrained(out,safe_serialization=True)
          AutoTokenizer.from_pretrained(src,local_files_only=True,use_fast=True).save_pretrained(out)
          got=hashlib.sha256((out/"model.safetensors").read_bytes()).hexdigest()
          want="3a6d0b156c45ccd8093af83a9ad3d388808eba5a9e15f0032fc0fe068bb92b68"
          if got!=want: raise SystemExit(f"converted model mismatch {got} != {want}")
          if (out/"pytorch_model.bin").exists(): raise SystemExit("unexpected pickle weights")
          print("R44_CONVERTED_BASE_IDENTITY_PASS",got)
          PY
      - name: Freeze file hashes
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/r44/converted" && sha256sum * | sort) > "$RUNNER_TEMP/r44/converted/SHA256SUMS.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r44-immutable-converted-biomedbert-base
          path: ${{ runner.temp }}/r44/converted
          if-no-files-found: error
          retention-days: 90
