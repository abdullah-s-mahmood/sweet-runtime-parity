name: Phase 2 FINAL_ALIF Disjoint Validation

on:
  workflow_dispatch:
  push:
    branches:
      - phase2-arabic-eval
    paths:
      - "phase2/generalization/run_final_alif_validation.py"
      - "phase2/generalization/evaluate_final_alif_validation.py"
      - ".github/workflows/phase2-final-alif-validation.yml"

permissions:
  contents: write

jobs:
  final-alif-validation:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      CAMELTOOLS_DATA: ${{ github.workspace }}/.camel_tools
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          ref: phase2-arabic-eval

      - name: Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Clone pinned Arabic GEC / ZAEBUC source
        run: |
          mkdir -p upstream
          git clone https://github.com/CAMeL-Lab/arabic-gec.git upstream/arabic-gec
          git -C upstream/arabic-gec checkout 8c7fb84f3ed84d1d30beb7080b02d0f6bfe1c5bf
          test "$(git -C upstream/arabic-gec rev-parse HEAD)" = "8c7fb84f3ed84d1d30beb7080b02d0f6bfe1c5bf"
          test -f upstream/arabic-gec/data/gec/ZAEBUC-v1.0/data/ar/train/train.sent.raw
          test -f upstream/arabic-gec/data/gec/ZAEBUC-v1.0/LICENCE.txt

      - name: Install frozen runtime
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==1.11.0+cpu"
          python -m pip install "camel-tools==1.4.1" "cachetools==4.2.4" "sentencepiece==0.1.99" "protobuf==3.20.3" "numpy<2"
          python -m pip uninstall -y transformers || true
          python -m pip install -e upstream/arabic-gec/transformers
          python -m pip install "huggingface_hub>=0.9,<1.0"
          mkdir -p "$CAMELTOOLS_DATA"
          camel_data -i morphology-db-msa-r13
          camel_data -i disambig-bert-unfactored-msa
          mkdir -p artifacts

      - name: Run raw-only deterministic slice and frozen policy
        run: |
          set -o pipefail
          PYTHONPATH=. python phase2/generalization/run_final_alif_validation.py 2>&1 | tee artifacts/FINAL_ALIF_RUNTIME_CONSOLE.txt
          test -f artifacts/ZAEBUC_TRAIN_FINAL_ALIF_RUNTIME_EVENTS.jsonl
          test -f artifacts/ZAEBUC_TRAIN_FINAL_ALIF_RUNTIME.json

      - name: Gold evaluation after decisions
        run: |
          set -o pipefail
          PYTHONPATH=. python phase2/generalization/evaluate_final_alif_validation.py 2>&1 | tee artifacts/FINAL_ALIF_EVALUATION_CONSOLE.txt
          cp PHASE2_FINAL_ALIF_GENERALIZATION_RESULTS.json artifacts/

      - name: Persist compact result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PHASE2_FINAL_ALIF_GENERALIZATION_RESULTS.json
          if git diff --cached --quiet; then
            echo "Result unchanged."
          else
            git commit -m "Record final-alif disjoint validation [skip ci]"
            git pull --rebase origin phase2-arabic-eval
            git push origin HEAD:phase2-arabic-eval
          fi

      - name: Upload ephemeral evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-final-alif-validation-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
