name: Phase 2 M1-A Expert-Grounded Bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - phase2-arabic-eval
    paths:
      - "phase2/redesign/m1a_build_expert_bootstrap.py"
      - "phase2/redesign/M1A_EXPERT_GROUNDED_PROTOCOL.md"
      - "phase2/redesign/M1A_EXPERT_EVIDENCE_SCHEMA.json"
      - ".github/workflows/phase2-m1a-expert-bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-arabic-eval

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Download only pinned already-consumed QALB14 TRAIN and DEV
        run: |
          set -euo pipefail
          REV="8c7fb84f3ed84d1d30beb7080b02d0f6bfe1c5bf"
          BASE="https://raw.githubusercontent.com/CAMeL-Lab/arabic-gec/$REV/data/gec/QALB-0.9.1-Dec03-2021-SharedTasks/data/2014"
          for SPLIT in train dev; do
            if [ "$SPLIT" = "train" ]; then P="QALB-2014-L1-Train"; else P="QALB-2014-L1-Dev"; fi
            D="upstream/qalb14/$SPLIT"
            mkdir -p "$D"
            for F in "$P.sent.no_ids" "$P.cor.no_ids" "$P.m2"; do
              curl -fsSL "$BASE/$SPLIT/$F" -o "$D/$F"
              test -s "$D/$F"
            done
          done
          test ! -e upstream/qalb15
          test ! -e upstream/qalb14/test

      - name: Build expert-grounded safe bootstrap
        run: |
          set -euo pipefail
          python phase2/redesign/m1a_build_expert_bootstrap.py             --qalb-root upstream/qalb14             --repo-root .             --out-dir .

      - name: Safety audit
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from pathlib import Path
          for p in [Path("M1A_EXPERT_BOOTSTRAP_SUMMARY.json"),Path("M1A_EXPERT_BOOTSTRAP_HASHED.jsonl")]:
              s=p.read_text(encoding="utf-8")
              assert not re.search(r"[\u0600-\u06ff]",s), p
              assert "QALB-2015" not in s and "qalb15" not in s.lower()
          j=json.load(open("M1A_EXPERT_BOOTSTRAP_SUMMARY.json",encoding="utf-8"))
          assert j["data_ready"] is True
          assert j["qalb15_read"] is False
          assert j["qalb_test_read"] is False
          assert j["raw_qalb_text_persisted"] is False
          print("M1-A safety audit PASS")
          PY

      - name: Persist safe summaries only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add M1A_EXPERT_BOOTSTRAP_SUMMARY.json M1A_EXPERT_BOOTSTRAP_HASHED.jsonl
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Record M1-A expert-grounded bootstrap [skip ci]"
            git pull --rebase origin phase2-arabic-eval
            git push origin HEAD:phase2-arabic-eval
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: m1a-expert-bootstrap-safe
          path: |
            M1A_EXPERT_BOOTSTRAP_SUMMARY.json
            M1A_EXPERT_BOOTSTRAP_HASHED.jsonl
          if-no-files-found: error
          retention-days: 30
