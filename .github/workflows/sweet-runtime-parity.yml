name: SWEET Official Runtime Parity

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout parity repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install pinned CPU PyTorch
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu torch==1.12.1+cpu

      - name: Install parity dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Clone and pin official CAMeL-Lab text-editing code
        run: |
          mkdir -p upstream
          git clone https://github.com/CAMeL-Lab/text-editing.git upstream/text-editing
          git -C upstream/text-editing checkout 4d552ca3ae98029550f27fc52aa1b22883e16e61
          echo "Pinned upstream commit:"
          git -C upstream/text-editing rev-parse HEAD

      - name: Run official runtime parity
        env:
          PYTHONUNBUFFERED: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python scripts/runtime_parity.py

      - name: Upload parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweet-official-runtime-parity
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
