name: R44-B B1 nested preflight

on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/r44b_b1_preflight_trigger.txt'

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install mechanics runtime
        run: python -m pip install --disable-pip-version-check --quiet torch==2.2.2

      - name: Download frozen R44 preflight manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r44-oof-readonly-preflight
          path: ${{ runner.temp }}/r44b/preflight
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37572165532

      - name: Download frozen DESIGN-only source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r44-design-source-only
          path: ${{ runner.temp }}/r44b/design
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37572893091

      - name: Download frozen R44-A aggregate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r44a-oof-candidate-bank
          path: ${{ runner.temp }}/r44b/r44a
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37581447046

      - name: Prove nested isolation and pair reduction
        run: |
          set -euo pipefail
          python phase2/academic_transform/at0_en/v2_6/r44b_b1_preflight.py             --manifest "$RUNNER_TEMP/r44b/preflight/R44_OOF_MANIFEST_V1.json"             --design-source "$RUNNER_TEMP/r44b/design/R44_DESIGN_SOURCE.json"             --design-summary "$RUNNER_TEMP/r44b/design/R44_DESIGN_SOURCE_SUMMARY.json"             --r44a-summary "$RUNNER_TEMP/r44b/r44a/R44A_OOF_BANK_SUMMARY.json"             --out "$RUNNER_TEMP/r44b/out"
          sha256sum "$RUNNER_TEMP/r44b/out/"* > "$RUNNER_TEMP/r44b/out/SHA256SUMS.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r44b-b1-preflight
          path: ${{ runner.temp }}/r44b/out
          if-no-files-found: error
          retention-days: 90
