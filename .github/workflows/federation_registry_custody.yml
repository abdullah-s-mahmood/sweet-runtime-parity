name: Federation protected registry custody audit

on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/federation_registry_custody_trigger.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: federation-protected-registry-custody
  cancel-in-progress: false

jobs:
  custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          path: project
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: BIDS-Xu-Lab/section_specific_annotation_of_PICO
          ref: bc4b878773192f38b2600ec830ca4208b82f7dc0
          path: source
          fetch-depth: 1
      - name: Download frozen R44 read-only manifest artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r44-oof-readonly-preflight
          path: ${{ runner.temp }}/r44
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37572165532
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Verify frozen identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "bc4b878773192f38b2600ec830ca4208b82f7dc0"
          test "$(sha256sum source/data/EBM-NLPmod/fold1/train.txt | awk '{print $1}')" = "6491a57e5c8639e5bfc3c0326b8501869fccab655a1ed571b75a772dc1c70a5e"
          test -f "$RUNNER_TEMP/r44/R44_OOF_MANIFEST_V1.json"
      - name: Run protected aggregate-only registry audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/custody_out"
          python project/phase2/academic_transform/at0_en/v2_6/federation_protected_registry_custody.py             --train source/data/EBM-NLPmod/fold1/train.txt             --r44-manifest "$RUNNER_TEMP/r44/R44_OOF_MANIFEST_V1.json"             --public-root source             --out "$RUNNER_TEMP/custody_out/FEDERATION_PROTECTED_REGISTRY_CUSTODY_AUDIT.json"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"custody_out/FEDERATION_PROTECTED_REGISTRY_CUSTODY_AUDIT.json"
          d=json.loads(p.read_text())
          assert d["state"]=="FEDERATION_PROTECTED_REGISTRY_CUSTODY_AUDIT_PASS"
          assert d["output_contains_registry_ids"] is False
          assert d["output_contains_raw_text"] is False
          assert d["output_contains_gold_labels"] is False
          PY
          sha256sum project/phase2/academic_transform/at0_en/v2_6/federation_protected_registry_custody.py             > "$RUNNER_TEMP/custody_out/SOURCE_SHA256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: federation-protected-registry-custody-audit
          path: ${{ runner.temp }}/custody_out
          if-no-files-found: error
          retention-days: 90
