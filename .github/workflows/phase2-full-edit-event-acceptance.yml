name: Phase 2 Full Edit-Event Acceptance Prototype

on:
  workflow_dispatch:
  push:
    branches:
      - phase2-arabic-eval
    paths:
      - "phase2/full_event_acceptance/**"
      - ".github/workflows/phase2-full-edit-event-acceptance.yml"

permissions:
  contents: write

jobs:
  full-event-acceptance:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout Phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: phase2-arabic-eval

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate fixed evidence
        run: |
          test -f PHASE2_ARABART_FULL_EDIT_ADJUDICATION_QUEUE.jsonl
          test -f PHASE2_ARABART_FULL_EDIT_ADJUDICATION.jsonl
          test -f PHASE2_INDEPENDENT_ACCEPTANCE_FEATURES.jsonl
          test -f PHASE2_ARABART_REVERSE_ACCEPTANCE_RESULTS.json

      - name: Materialize target-agnostic event decisions
        run: |
          python phase2/full_event_acceptance/run_full_event_acceptance_gate.py
          test -f PHASE2_FULL_EDIT_EVENT_ACCEPTANCE_FEATURES.jsonl
          test -f PHASE2_FULL_EDIT_EVENT_ACCEPTANCE_RUNTIME.json

      - name: Evaluate frozen event decisions
        run: |
          python phase2/full_event_acceptance/evaluate_full_event_acceptance_gate.py
          test -f PHASE2_FULL_EDIT_EVENT_ACCEPTANCE_RESULTS.json

      - name: Persist evidence safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PHASE2_FULL_EDIT_EVENT_ACCEPTANCE_FEATURES.jsonl PHASE2_FULL_EDIT_EVENT_ACCEPTANCE_RUNTIME.json PHASE2_FULL_EDIT_EVENT_ACCEPTANCE_RESULTS.json
          if git diff --cached --quiet; then
            echo "Full event acceptance evidence unchanged."
          else
            git commit -m "Update full edit-event acceptance evidence [skip ci]"
            git pull --rebase origin phase2-arabic-eval
            git push origin HEAD:phase2-arabic-eval
          fi
