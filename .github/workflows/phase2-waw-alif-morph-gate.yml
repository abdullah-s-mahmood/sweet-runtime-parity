name: Phase 2 WAW-ALIF Morphosyntactic Recovery Gate

on:
  workflow_dispatch:
  push:
    branches:
      - phase2-arabic-eval
    paths:
      - "phase2/generalization/WAW_ALIF_MORPH_GATE_PROTOCOL.md"
      - "phase2/generalization/run_waw_alif_morph_gate.py"
      - "phase2/generalization/evaluate_waw_alif_morph_gate.py"
      - ".github/workflows/phase2-waw-alif-morph-gate.yml"

permissions:
  contents: write

jobs:
  waw-alif-morph:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      CAMELTOOLS_DATA: ${{ github.workspace }}/.camel_tools
      HF_HUB_DISABLE_TELEMETRY: "1"

    steps:
      - name: Checkout project branch
        uses: actions/checkout@v4
        with:
          ref: phase2-arabic-eval

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Clone and pin CAMeL-Lab Arabic GEC
        run: |
          mkdir -p upstream
          git clone https://github.com/CAMeL-Lab/arabic-gec.git upstream/arabic-gec
          git -C upstream/arabic-gec checkout 8c7fb84f3ed84d1d30beb7080b02d0f6bfe1c5bf
          test "$(git -C upstream/arabic-gec rev-parse HEAD)" = "8c7fb84f3ed84d1d30beb7080b02d0f6bfe1c5bf"
          test -f upstream/arabic-gec/data/gec/ZAEBUC-v1.0/data/ar/train/train.sent.raw
          test -f upstream/arabic-gec/data/gec/ZAEBUC-v1.0/LICENCE.txt

      - name: Install frozen Arabic GEC runtime
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==1.11.0+cpu"
          python -m pip install "camel-tools==1.4.1" "cachetools==4.2.4" "sentencepiece==0.1.99" "protobuf==3.20.3" "numpy<2"
          python -m pip uninstall -y transformers || true
          python -m pip install -e upstream/arabic-gec/transformers
          python -m pip install "huggingface_hub>=0.9,<1.0"

      - name: Install CAMeL morphology/disambiguation resources
        run: |
          mkdir -p "$CAMELTOOLS_DATA"
          camel_data -i morphology-db-msa-r13
          camel_data -i disambig-bert-unfactored-msa

      - name: Record model revisions
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          from huggingface_hub import HfApi
          api=HfApi()
          repos=[
              "CAMeL-Lab/camelbert-msa-qalb14-ged-13",
              "CAMeL-Lab/arabart-qalb14-gec-ged-13",
          ]
          out={r:api.model_info(r).sha for r in repos}
          open("artifacts/WAW_ALIF_MODEL_REVISIONS.json","w").write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY

      - name: Validate prior line-exclusion evidence
        run: |
          test -f PHASE2_FINAL_ALIF_GENERALIZATION_RESULTS.json
          python - <<'PY'
          import json
          x=json.load(open("PHASE2_FINAL_ALIF_GENERALIZATION_RESULTS.json",encoding="utf-8"))
          assert len(x["selected_line_ids"])==30
          assert x["zaebuc_test_read"] is False
          print("prior exclusion evidence PASS")
          PY

      - name: Raw-only generation and frozen morph decisions
        run: |
          set -o pipefail
          PYTHONPATH=. python phase2/generalization/run_waw_alif_morph_gate.py 2>&1 | tee artifacts/WAW_ALIF_RUNTIME_CONSOLE.txt
          test -f artifacts/WAW_ALIF_MORPH_RUNTIME_EVENTS.jsonl
          test -f artifacts/WAW_ALIF_MORPH_RUNTIME_SUMMARY.json

      - name: Gold evaluation after runtime freeze
        run: |
          set -o pipefail
          PYTHONPATH=. python phase2/generalization/evaluate_waw_alif_morph_gate.py 2>&1 | tee artifacts/WAW_ALIF_EVAL_CONSOLE.txt
          test -f PHASE2_WAW_ALIF_MORPH_GENERALIZATION_RESULTS.json

      - name: Persist compact evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PHASE2_WAW_ALIF_MORPH_GENERALIZATION_RESULTS.json
          if git diff --cached --quiet; then
            echo "WAW-alif result unchanged."
          else
            git commit -m "Record WAW-alif morphosyntactic generalization evidence [skip ci]"
            git pull --rebase origin phase2-arabic-eval
            git push origin HEAD:phase2-arabic-eval
          fi

      - name: Upload ephemeral runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-waw-alif-morph-evidence
          path: |
            artifacts/WAW_ALIF_MORPH_RUNTIME_SUMMARY.json
            artifacts/WAW_ALIF_MODEL_REVISIONS.json
            PHASE2_WAW_ALIF_MORPH_GENERALIZATION_RESULTS.json
          if-no-files-found: warn
          retention-days: 30
