name: Phase 2 Morphology-Aware Surface Gate

on:
  workflow_dispatch:
  push:
    branches:
      - phase2-arabic-eval
    paths:
      - "phase2/morphology/**"
      - ".github/workflows/phase2-morph-surface-gate.yml"

permissions:
  contents: write

jobs:
  morph-surface-gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CAMELTOOLS_DATA: ${{ github.workspace }}/.camel_tools

    steps:
      - name: Checkout Phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: phase2-arabic-eval

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install pinned runtime dependencies
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu torch==1.12.1+cpu
          python -m pip install -r requirements.txt
          python -m pip check
          python - <<'PY'
          import camel_tools
          print("camel_tools", getattr(camel_tools, "__version__", "unknown"))
          PY

      - name: Install CAMeL morphology and MLE data
        run: |
          mkdir -p "$CAMELTOOLS_DATA"
          camel_data -i light
          camel_data -l | tee artifacts_camel_data_list.txt
          camel_morphology --list | tee artifacts_camel_morphology_list.txt

      - name: Validate gate inputs
        run: |
          test -f PHASE2_NORMALIZED_CANDIDATE_ADJUDICATION.jsonl
          test -f PHASE2_NORMALIZED_CANDIDATE_QUEUE.jsonl
          test -f PHASE2_NORMALIZED_TARGET_IMPACT.json
          test "$(wc -l < PHASE2_NORMALIZED_CANDIDATE_ADJUDICATION.jsonl)" -eq 19

      - name: Run morphology-aware surface realization gate
        run: |
          set -o pipefail
          mkdir -p artifacts
          python phase2/morphology/run_morph_surface_gate.py 2>&1 | tee artifacts/MORPH_SURFACE_GATE_CONSOLE.txt
          cp PHASE2_MORPH_SURFACE_CANDIDATES.jsonl artifacts/
          cp PHASE2_MORPH_SURFACE_GATE_RESULTS.json artifacts/
          cp PHASE2_MORPH_SURFACE_TARGET_IMPACT.json artifacts/
          cp PHASE2_MORPH_SURFACE_MANIFEST.json artifacts/
          cp artifacts_camel_data_list.txt artifacts/
          cp artifacts_camel_morphology_list.txt artifacts/

      - name: Persist compact gate evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PHASE2_MORPH_SURFACE_CANDIDATES.jsonl PHASE2_MORPH_SURFACE_GATE_RESULTS.json PHASE2_MORPH_SURFACE_TARGET_IMPACT.json PHASE2_MORPH_SURFACE_MANIFEST.json
          if git diff --cached --quiet; then
            echo "Morph surface evidence unchanged."
          else
            git commit -m "Update morphology surface gate evidence [skip ci]"
            git push origin HEAD:phase2-arabic-eval
          fi

      - name: Record provenance
        if: always()
        run: |
          mkdir -p artifacts
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
          } > artifacts/MORPH_SURFACE_GITHUB_PROVENANCE.txt

      - name: Upload morphology gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-morphology-surface-gate-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
