name: Federation adapter synthetic preflight
on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/federation_adapter_preflight_trigger.txt'
permissions:
  contents: read
concurrency:
  group: federation-adapter-synthetic
  cancel-in-progress: false
jobs:
  adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.16'}
      - run: python -m py_compile phase2/academic_transform/at0_en/v2_6/federation_adapters.py
      - name: Run adapter synthetic closure
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/adapter"
          python phase2/academic_transform/at0_en/v2_6/federation_adapters.py --synthetic-preflight --out "$RUNNER_TEMP/adapter/FEDERATION_ADAPTER_SYNTHETIC_PREFLIGHT.json"
          sha256sum phase2/academic_transform/at0_en/v2_6/federation_adapters.py phase2/academic_transform/at0_en/v2_6/AT0_EN_V26_PUBLIC_SOURCE_SCHEMA_AUDIT_FREEZE_V1.md > "$RUNNER_TEMP/adapter/SOURCE_SHA256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: federation-adapter-synthetic-preflight
          path: ${{ runner.temp }}/adapter
          if-no-files-found: error
          retention-days: 90
