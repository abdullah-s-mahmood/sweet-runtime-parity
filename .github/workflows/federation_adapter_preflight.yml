name: Federation adapter source preflight

on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/federation_adapter_preflight_trigger.txt'

permissions:
  contents: read

concurrency:
  group: federation-adapter-preflight
  cancel-in-progress: false

jobs:
  adapters:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1, path: project}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: BIDS-Xu-Lab/section_specific_annotation_of_PICO
          ref: bc4b878773192f38b2600ec830ca4208b82f7dc0
          path: bids
          fetch-depth: 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ebmlab/EvidenceOutcomes
          ref: bafa355449b6b6feb64f3ca46c1d3268dead13d4
          path: evidence
          fetch-depth: 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: pathology-dynamics/trialsieve_final
          ref: 62dd931124e36a8c1d9dc4a2469893553d90d2e4
          path: trialsieve
          fetch-depth: 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: sociocom/PICO-Corpus
          ref: 482b7d8f135fe6ea424961c2812e8d214c3f4a5f
          path: pico
          fetch-depth: 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: bepnye/EBM-NLP
          ref: 43a4a1ea3f0a21cfb8820c040b843dfaf66192d0
          path: ebm
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.16'}
      - name: Adapter source closure
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/adapter" "$RUNNER_TEMP/adapter_work"
          python project/phase2/academic_transform/at0_en/v2_6/federation_adapter_preflight.py             --bids bids --evidence evidence --trialsieve trialsieve --pico pico --ebm ebm             --work "$RUNNER_TEMP/adapter_work"             --out "$RUNNER_TEMP/adapter/FEDERATION_ADAPTER_SOURCE_PREFLIGHT.json"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"adapter/FEDERATION_ADAPTER_SOURCE_PREFLIGHT.json"
          d=json.loads(p.read_text())
          assert d["state"]=="FEDERATION_ADAPTER_SOURCE_PREFLIGHT_PASS"
          assert d["native_labels_emitted_by_auxiliary_sources"] is False
          assert d["benchmark_metrics_computed"] is False
          assert d["scientific_training_performed"] is False
          PY
          sha256sum project/phase2/academic_transform/at0_en/v2_6/federation_adapter_preflight.py             project/phase2/academic_transform/at0_en/v2_6/AT0_EN_V26_FEDERATION_ADAPTER_CONTRACT_V1.md             > "$RUNNER_TEMP/adapter/SOURCE_SHA256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: federation-adapter-source-preflight
          path: ${{ runner.temp }}/adapter
          if-no-files-found: error
          retention-days: 90
