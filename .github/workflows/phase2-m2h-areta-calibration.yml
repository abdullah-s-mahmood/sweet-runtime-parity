name: Phase 2 M2-H ARETA CALIBRATION Enrichment

on:
  workflow_dispatch:
  push:
    branches: [phase2-arabic-eval]
    paths:
      - "phase2/redesign/m2h_parse_areta_calibration.py"
      - ".github/workflows/phase2-m2h-areta-calibration.yml"
      - "phase2/redesign/M2H_CALIBRATION_PROTOCOL_V1.md"
      - "phase2/redesign/M2H_ARETA_ENRICHMENT_DECISION.md"

permissions:
  contents: read
  actions: read

jobs:
  areta-calibration:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Checkout frozen arabic-gec ARETA source
        run: |
          git clone https://github.com/CAMeL-Lab/arabic-gec.git upstream_arabic_gec
          cd upstream_arabic_gec
          git checkout 8c7fb84f3ed84d1d30beb7080b02d0f6bfe1c5bf
          test "$(git rev-parse HEAD)" = "8c7fb84f3ed84d1d30beb7080b02d0f6bfe1c5bf"

      - name: Install isolated ARETA diagnostic environment
        run: |
          python -m pip install --upgrade "pip<24"
          python -m pip install "camel-tools==1.5.0"
          python -m pip install -r upstream_arabic_gec/areta/requirements.txt
          camel_data -i morphology-db-msa-r13
          python -m pip freeze | sort > areta_pip_freeze.txt

      - name: Download frozen CALIBRATION artifact only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir calibration_artifact
          gh run download 36654588477 \
            --repo "${{ github.repository }}" \
            --name m2h-calibration-v1 \
            --dir calibration_artifact
          test -f calibration_artifact/M2H_CALIBRATION_V1.jsonl
          test -f calibration_artifact/M2H_CALIBRATION_SUMMARY_V1.json

      - name: Verify CALIBRATION identity and prepare sentence files
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path("calibration_artifact/M2H_CALIBRATION_V1.jsonl")
          rows=[json.loads(x) for x in p.read_text(encoding="utf-8").splitlines() if x.strip()]
          if len(rows)!=6888: raise SystemExit(f"case count mismatch: {len(rows)}")
          uids=[r["uid"] for r in rows]
          uidsha=hashlib.sha256(("\n".join(uids)+"\n").encode()).hexdigest()
          expected="3b6c1128f412531223b3c2e5346082d3290f40daac706eb13bbafa1db10a09c9"
          if uidsha!=expected: raise SystemExit(f"CALIBRATION UID hash mismatch: {uidsha}")
          pathlib.Path("areta_source.txt").write_text("\n".join(r["source"] for r in rows)+"\n",encoding="utf-8")
          pathlib.Path("areta_reference.txt").write_text("\n".join(r["reference"] for r in rows)+"\n",encoding="utf-8")
          print("CALIBRATION_IDENTITY_OK",len(rows),uidsha)
          PY

      - name: Run frozen official word aligner
        working-directory: upstream_arabic_gec/areta
        run: |
          python aligner/align_text.py \
            -r "$GITHUB_WORKSPACE/areta_source.txt" \
            -c "$GITHUB_WORKSPACE/areta_reference.txt" \
            -m align \
            -o "$GITHUB_WORKSPACE/areta_calibration"

      - name: Run enhanced ARETA on CALIBRATION only
        working-directory: upstream_arabic_gec/areta
        run: |
          python annotate_err_type_ar.py \
            --alignment "$GITHUB_WORKSPACE/areta_calibration.coAlign" \
            --output_path "$GITHUB_WORKSPACE/areta_calibration.raw.tsv" \
            --enriched_output_path "$GITHUB_WORKSPACE/areta_calibration.enriched.tsv"

      - name: Build diagnostic H2/H3 enrichment summary
        run: |
          python phase2/redesign/m2h_parse_areta_calibration.py \
            --calibration calibration_artifact/M2H_CALIBRATION_V1.jsonl \
            --enriched areta_calibration.enriched.tsv \
            --out-jsonl M2H_ARETA_CALIBRATION_ENRICHMENT_V1.jsonl \
            --out-summary M2H_ARETA_CALIBRATION_SUMMARY_V1.json \
            --pip-freeze areta_pip_freeze.txt

      - name: Guard unopened sets and unchanged gates
        run: |
          python - <<'PY'
          import json
          s=json.load(open("M2H_ARETA_CALIBRATION_SUMMARY_V1.json"))
          i=s["integrity"]
          assert i["calibration_only"] is True
          assert i["internal_evaluation_opened"] is False
          assert i["stress_diagnostic_opened"] is False
          assert i["thresholds_tuned"] is False
          assert i["verifier_executed"] is False
          print("ARETA_CALIBRATION_ONLY_OK")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: m2h-areta-calibration-v1
          path: |
            M2H_ARETA_CALIBRATION_ENRICHMENT_V1.jsonl
            M2H_ARETA_CALIBRATION_SUMMARY_V1.json
            areta_pip_freeze.txt
          retention-days: 90
