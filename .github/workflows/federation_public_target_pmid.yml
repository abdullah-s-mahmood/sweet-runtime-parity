name: Federation public target PMID custody audit

on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/federation_public_target_pmid_trigger.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: federation-public-target-pmid-custody
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1, path: project}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: BIDS-Xu-Lab/section_specific_annotation_of_PICO
          ref: bc4b878773192f38b2600ec830ca4208b82f7dc0
          path: bids
          fetch-depth: 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: bepnye/EBM-NLP
          ref: 43a4a1ea3f0a21cfb8820c040b843dfaf66192d0
          path: ebm
          fetch-depth: 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: sociocom/PICO-Corpus
          ref: 482b7d8f135fe6ea424961c2812e8d214c3f4a5f
          path: pico
          fetch-depth: 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ebmlab/EvidenceOutcomes
          ref: bafa355449b6b6feb64f3ca46c1d3268dead13d4
          path: evidence
          fetch-depth: 1
      - name: Download frozen R44 manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r44-oof-readonly-preflight
          path: ${{ runner.temp }}/r44
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37572165532
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.16'}
      - name: Resolve public target titles inside custody
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pmid_out" "$RUNNER_TEMP/pmid_work"
          python project/phase2/academic_transform/at0_en/v2_6/federation_public_target_pmid_custody.py             --bids bids             --ebm-archive ebm/ebm_nlp_2_00.tar.gz             --r44-manifest "$RUNNER_TEMP/r44/R44_OOF_MANIFEST_V1.json"             --pico pico --evidence evidence             --work "$RUNNER_TEMP/pmid_work"             --out "$RUNNER_TEMP/pmid_out/FEDERATION_PUBLIC_TARGET_PMID_CUSTODY_AUDIT.json"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"pmid_out/FEDERATION_PUBLIC_TARGET_PMID_CUSTODY_AUDIT.json"
          d=json.loads(p.read_text())
          assert d["state"]=="FEDERATION_PUBLIC_TARGET_PMID_CUSTODY_AUDIT_PASS"
          assert not d["output_contains_pmids"]
          assert not d["output_contains_titles"]
          assert not d["output_contains_raw_text"]
          assert not d["output_contains_gold_labels"]
          PY
          sha256sum project/phase2/academic_transform/at0_en/v2_6/federation_public_target_pmid_custody.py             > "$RUNNER_TEMP/pmid_out/SOURCE_SHA256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: federation-public-target-pmid-custody-audit
          path: ${{ runner.temp }}/pmid_out
          if-no-files-found: error
          retention-days: 90
