name: R4.2 V5 calibration summary extract

on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/r42_v5_summary_extract_trigger_v1.txt'

permissions:
  contents: read
  actions: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download frozen V5 artifact and extract small evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r42v5"
          curl -fsSL             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/11385322641/zip"             -o "$RUNNER_TEMP/r42v5/artifact.zip"
          unzip -p "$RUNNER_TEMP/r42v5/artifact.zip"             'out/R4_2_TRAIN_CALIBRATION_SUMMARY.json'             > "$RUNNER_TEMP/r42v5/R4_2_TRAIN_CALIBRATION_SUMMARY.json"
          unzip -p "$RUNNER_TEMP/r42v5/artifact.zip"             'out/PROCESS_STATUS.json'             > "$RUNNER_TEMP/r42v5/PROCESS_STATUS.json"
          sha256sum             "$RUNNER_TEMP/r42v5/R4_2_TRAIN_CALIBRATION_SUMMARY.json"             "$RUNNER_TEMP/r42v5/PROCESS_STATUS.json"             > "$RUNNER_TEMP/r42v5/EXTRACTED_SHA256.txt"
          echo '=== R4_2_TRAIN_CALIBRATION_SUMMARY.json ==='
          cat "$RUNNER_TEMP/r42v5/R4_2_TRAIN_CALIBRATION_SUMMARY.json"
          echo '=== PROCESS_STATUS.json ==='
          cat "$RUNNER_TEMP/r42v5/PROCESS_STATUS.json"
          echo '=== SHA256 ==='
          cat "$RUNNER_TEMP/r42v5/EXTRACTED_SHA256.txt"

      - name: Upload extracted small evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r42-v5-small-calibration-evidence
          path: |
            ${{ runner.temp }}/r42v5/R4_2_TRAIN_CALIBRATION_SUMMARY.json
            ${{ runner.temp }}/r42v5/PROCESS_STATUS.json
            ${{ runner.temp }}/r42v5/EXTRACTED_SHA256.txt
          if-no-files-found: error
          retention-days: 90
