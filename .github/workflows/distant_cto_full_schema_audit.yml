name: DISTANT-CTO full weak-file schema audit

on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/distant_cto_full_schema_trigger.txt'

permissions:
  contents: read

concurrency:
  group: distant-cto-full-schema-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.16'}
      - name: Download official Zenodo weak file
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/distant"
          curl --fail --location --retry 5 --retry-delay 3             'https://zenodo.org/records/6497284/files/extraction1_pos_posnegtrail_conf09.txt?download=1'             -o "$RUNNER_TEMP/distant/extraction1_pos_posnegtrail_conf09.txt"
          test "$(md5sum "$RUNNER_TEMP/distant/extraction1_pos_posnegtrail_conf09.txt" | awk '{print $1}')" = "e95e3984a9b46e340b90aeed262e12cc"
      - name: Aggregate-only full-file schema audit
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/distant_out"
          python phase2/academic_transform/at0_en/v2_6/distant_cto_full_schema_audit.py             --file "$RUNNER_TEMP/distant/extraction1_pos_posnegtrail_conf09.txt"             --out "$RUNNER_TEMP/distant_out/DISTANT_CTO_FULL_SCHEMA_AUDIT.json"
          sha256sum phase2/academic_transform/at0_en/v2_6/distant_cto_full_schema_audit.py             > "$RUNNER_TEMP/distant_out/SOURCE_SHA256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distant-cto-full-schema-audit
          path: ${{ runner.temp }}/distant_out
          if-no-files-found: error
          retention-days: 90
