name: AT0 EN V2.6 R4.3 independent inner H0 vs H1 probe

on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/r43_inner_h0_h1_probe_trigger_v1.txt'

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: at0-en-v2.6-dev
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install frozen probe runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet             numpy==1.26.4 torch==2.2.2 transformers==4.39.3             safetensors==0.4.3 huggingface_hub==0.25.2             jax==0.4.25 jaxlib==0.4.25 flax==0.8.2
      - name: Download frozen preflight manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: at0-en-v2-6-r43-contextual-pair-preflight
          path: ${{ runner.temp }}/r43/preflight
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37534110955
      - name: Acquire exact TRAIN and safe base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r43/data" "$RUNNER_TEMP/r43/model"
          python - <<'PY'
          import hashlib,os,pathlib,urllib.request
          from huggingface_hub import snapshot_download
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"r43"
          b=urllib.request.urlopen(
            "https://raw.githubusercontent.com/BIDS-Xu-Lab/section_specific_annotation_of_PICO/bc4b878773192f38b2600ec830ca4208b82f7dc0/data/EBM-NLPmod/fold1/train.txt",
            timeout=30).read()
          w="6491a57e5c8639e5bfc3c0326b8501869fccab655a1ed571b75a772dc1c70a5e"
          if hashlib.sha256(b).hexdigest()!=w: raise SystemExit("train mismatch")
          (root/"data/train.txt").write_bytes(b)
          files={
            "flax_model.msgpack":"2048c0dca92fe54cf2bec6c36972511ca04e546060307098139b19221dd4e93f",
            "config.json":"56bab767c02bc792897638feb8addc06d483d9c73769a5f554bbabea1f5507a1",
            "tokenizer_config.json":"53b6f42b8b8daddbdc6d3532c324187a92b46c1602bd6e8d4ad5a413b4fc90e1",
            "vocab.txt":"7b36651908a88bc38bda41b728b2a598191e0d3b553cbacf7b1e5f026d5b5b9f"
          }
          snap=pathlib.Path(snapshot_download(
              repo_id="microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract",
              revision="d673b8835373c6fa116d6d8006b33d48734e305d",
              allow_patterns=list(files),local_dir=str(root/"model"),local_dir_use_symlinks=False))
          for n,w in files.items():
              g=hashlib.sha256((snap/n).read_bytes()).hexdigest()
              if g!=w: raise SystemExit(f"{n} {g}")
          PY
      - name: Run independent FIT-only H0-vs-H1 inner probe
        shell: bash
        env:
          TOKENIZERS_PARALLELISM: "false"
          PYTHONHASHSEED: "42"
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/r43/inner_probe"
          python phase2/academic_transform/at0_en/v2_6/r43_independent_inner_h0_h1_probe.py             --model-dir "$RUNNER_TEMP/r43/model"             --train "$RUNNER_TEMP/r43/data/train.txt"             --manifest "$RUNNER_TEMP/r43/preflight/R43_FIT_SELECT_MANIFEST.json"             --out "$RUNNER_TEMP/r43/inner_probe"
      - name: Hash outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r43/inner_probe"
          sha256sum phase2/academic_transform/at0_en/v2_6/r43_independent_inner_h0_h1_probe.py             > "$RUNNER_TEMP/r43/inner_probe/PROTOCOL_SHA256.txt"
          if [ -f "$RUNNER_TEMP/r43/inner_probe/R43_INDEPENDENT_INNER_H0_H1_PROBE.json" ]; then
            sha256sum "$RUNNER_TEMP/r43/inner_probe/R43_INDEPENDENT_INNER_H0_H1_PROBE.json"               >> "$RUNNER_TEMP/r43/inner_probe/PROTOCOL_SHA256.txt"
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: at0-en-v2-6-r43-independent-inner-h0-h1-probe
          path: ${{ runner.temp }}/r43/inner_probe
          if-no-files-found: error
          retention-days: 90
