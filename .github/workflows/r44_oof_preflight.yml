name: R44 OOF supervision repair read-only preflight
on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/r44_oof_preflight_trigger.txt'
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: at0-en-v2.6-dev
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install parser dependency
        run: pip install --quiet transformers==4.39.3
      - name: Download frozen R4.3 split manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: at0-en-v2-6-r43-contextual-pair-preflight
          path: ${{ runner.temp }}/r44/r43
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37534110955
      - name: Acquire pinned TRAIN only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r44/data"
          python - <<'PY'
          import pathlib,urllib.request,hashlib,os
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"r44/data/train.txt"
          b=urllib.request.urlopen("https://raw.githubusercontent.com/BIDS-Xu-Lab/section_specific_annotation_of_PICO/bc4b878773192f38b2600ec830ca4208b82f7dc0/data/EBM-NLPmod/fold1/train.txt",timeout=30).read()
          assert hashlib.sha256(b).hexdigest()=="6491a57e5c8639e5bfc3c0326b8501869fccab655a1ed571b75a772dc1c70a5e"
          p.write_bytes(b)
          PY
      - name: Run deterministic read-only R4.4 preflight
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/r44/out"
          python phase2/academic_transform/at0_en/v2_6/r44_oof_preflight.py             --train "$RUNNER_TEMP/r44/data/train.txt"             --r43-manifest "$RUNNER_TEMP/r44/r43/R43_FIT_SELECT_MANIFEST.json"             --out "$RUNNER_TEMP/r44/out"
      - name: Freeze protocol hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r44/out"
          sha256sum             phase2/academic_transform/at0_en/v2_6/r44_oof_preflight.py             phase2/academic_transform/at0_en/v2_6/AT0_EN_V26_R44_OOF_SUPERVISION_REPAIR_DESIGN_V1.md             phase2/academic_transform/at0_en/v2_6/AT0_EN_V26_R43_GOLD_SOURCE_SEMANTIC_CONTRACT_FREEZE_V1.md             > "$RUNNER_TEMP/r44/out/PROTOCOL_SHA256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r44-oof-readonly-preflight
          path: ${{ runner.temp }}/r44/out
          if-no-files-found: warn
          retention-days: 90
