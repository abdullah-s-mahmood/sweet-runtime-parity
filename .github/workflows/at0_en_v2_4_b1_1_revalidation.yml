name: AT0-EN V2.4 B1.1 Revalidation

on:
  push:
    branches:
      - phase2-arabic-eval
    paths:
      - "phase2/academic_transform/at0_en/v2_4/gate_b1/B1_1_REVALIDATION_TRIGGER_V1.txt"

permissions:
  contents: read

jobs:
  revalidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact trigger state
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile repaired aligner and tests
        run: |
          set -euo pipefail
          python -m py_compile             phase2/academic_transform/at0_en/v2_4/gate_b1/b1_aligner.py             phase2/academic_transform/at0_en/v2_4/gate_b1/check_b1_1_repair_regressions.py             phase2/academic_transform/at0_en/v2_4/gate_b1/score_b1_aligner.py

      - name: Run principle-based repair regressions
        run: |
          set -euo pipefail
          python phase2/academic_transform/at0_en/v2_4/gate_b1/check_b1_1_repair_regressions.py

      - name: Re-score frozen B1 human-correct set
        run: |
          set -euo pipefail
          python phase2/academic_transform/at0_en/v2_4/gate_b1/score_b1_aligner.py

      - name: Freeze B1.1 hashes
        run: |
          set -euo pipefail
          cd phase2/academic_transform/at0_en/v2_4/gate_b1
          sha256sum             b1_aligner.py             check_b1_1_repair_regressions.py             score_b1_aligner.py             B1_HUMAN_CORRECT_GRAPH_PAIRS_V1.jsonl             B1_SCORING_CONTRACT_V1.md             results/B1_FIRST_SCORE_DETAIL.jsonl             results/B1_FIRST_SCORE_SUMMARY.json             > results/B1_1_REVALIDATION_SHA256.txt
          cat results/B1_1_REVALIDATION_SHA256.txt

      - name: Upload B1.1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: at0-en-v2-4-b1-1-${{ github.run_id }}
          path: |
            phase2/academic_transform/at0_en/v2_4/gate_b1/results/B1_FIRST_SCORE_DETAIL.jsonl
            phase2/academic_transform/at0_en/v2_4/gate_b1/results/B1_FIRST_SCORE_SUMMARY.json
            phase2/academic_transform/at0_en/v2_4/gate_b1/results/B1_1_REVALIDATION_SHA256.txt
          retention-days: 30
          if-no-files-found: error
