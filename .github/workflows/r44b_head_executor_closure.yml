name: R44-B head executor synthetic closure

on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/r44b_head_executor_closure_trigger.txt'

permissions:
  contents: read

concurrency:
  group: r44b-head-executor-synthetic-closure
  cancel-in-progress: false

jobs:
  closure:
    name: R44-B synthetic executor closure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements/r44a_fold_fast.txt
      - name: Install frozen runtime
        run: python -m pip install --disable-pip-version-check --quiet -r requirements/r44a_fold_fast.txt
      - name: Compile executor
        run: |
          python -m py_compile \
            phase2/academic_transform/at0_en/v2_6/r44b_head_train.py \
            phase2/academic_transform/at0_en/v2_6/r44b_head_aggregate.py \
            phase2/academic_transform/at0_en/v2_6/r44b_head_synthetic_closure.py
      - name: Run source-free synthetic closure
        env:
          PYTHONHASHSEED: "44"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r44b_closure"
          python phase2/academic_transform/at0_en/v2_6/r44b_head_synthetic_closure.py \
            > "$RUNNER_TEMP/r44b_closure/R44B_HEAD_EXECUTOR_SYNTHETIC_CLOSURE.json"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"r44b_closure/R44B_HEAD_EXECUTOR_SYNTHETIC_CLOSURE.json"
          d=json.loads(p.read_text())
          assert d["state"]=="R44B_HEAD_EXECUTOR_SYNTHETIC_CLOSURE_PASS"
          assert d["scientific_data_used"] is False
          assert d["scientific_head_attempt_consumed"] is False
          print(json.dumps(d,indent=2,sort_keys=True))
          PY
          sha256sum \
            phase2/academic_transform/at0_en/v2_6/r44b_head_train.py \
            phase2/academic_transform/at0_en/v2_6/r44b_head_aggregate.py \
            phase2/academic_transform/at0_en/v2_6/r44b_head_synthetic_closure.py \
            phase2/academic_transform/at0_en/v2_6/r44b_b1_preflight.py \
            requirements/r44a_fold_fast.txt \
            > "$RUNNER_TEMP/r44b_closure/SOURCE_SHA256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r44b-head-executor-synthetic-closure
          path: ${{ runner.temp }}/r44b_closure
          if-no-files-found: error
          retention-days: 90
