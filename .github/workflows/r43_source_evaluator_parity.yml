name: R43 source evaluator parity TRAIN-only audit
on:
  push:
    branches: [at0-en-v2.6-dev]
    paths: [.github/diagnostics/r43_source_eval_parity_trigger.txt]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: at0-en-v2.6-dev
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install minimal dependency
        run: pip install --quiet transformers==4.39.3
      - name: Acquire pinned TRAIN and official evaluator only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r43/source"
          python - <<'PY'
          import pathlib,urllib.request,hashlib,os
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"r43/source"
          base="https://raw.githubusercontent.com/BIDS-Xu-Lab/section_specific_annotation_of_PICO/bc4b878773192f38b2600ec830ca4208b82f7dc0/"
          train=urllib.request.urlopen(base+"data/EBM-NLPmod/fold1/train.txt",timeout=30).read()
          want="6491a57e5c8639e5bfc3c0326b8501869fccab655a1ed571b75a772dc1c70a5e"
          if hashlib.sha256(train).hexdigest()!=want: raise SystemExit("TRAIN identity mismatch")
          (root/"train.txt").write_bytes(train)
          ev=urllib.request.urlopen(base+"evaluate.py",timeout=30).read()
          (root/"evaluate.py").write_bytes(ev)
          print("evaluate_sha256",hashlib.sha256(ev).hexdigest())
          PY
      - name: Run official evaluator parity on TRAIN only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/r43/out"
          python phase2/academic_transform/at0_en/v2_6/r43_source_evaluator_parity_audit.py             --train "$RUNNER_TEMP/r43/source/train.txt"             --source-evaluate "$RUNNER_TEMP/r43/source/evaluate.py"             --out "$RUNNER_TEMP/r43/out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r43-source-evaluator-parity
          path: ${{ runner.temp }}/r43/out
          if-no-files-found: error
          retention-days: 90
