name: Phase 2 MP-SEF P2 V2 Stage2 Production-Bound Parity32

on:
  push:
    branches: [phase2-arabic-eval]
    paths:
      - "phase2/redesign/mpsef_p2_v2_stage2_production_adapter_v1.py"
      - "phase2/redesign/run_with_progress_watchdog_v2.py"
      - "phase2/redesign/mpsef_p2_v2_stage2_build_parity32_input_v1.py"
      - "phase2/redesign/mpsef_p2_v2_stage2_production_bound_parity32_v1.py"
      - ".github/workflows/phase2-mpsef-p2-v2-stage2-production-bound-parity32.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  parity32:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Download frozen parity32 manifest
        uses: actions/download-artifact@v4
        with:
          name: mpsef-v4-stage1-parity32-manifest-v1
          path: parity32
          repository: abdullah-s-mahmood/sweet-runtime-parity
          run-id: 36878829104
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download frozen P2 Stage1 proposals
        uses: actions/download-artifact@v4
        with:
          name: mpsef-p2-v2-stage1-v1
          path: p2
          repository: abdullah-s-mahmood/sweet-runtime-parity
          run-id: 36872617551
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify frozen identities
        run: |
          set -euo pipefail
          test "$(sha256sum parity32/MPSEF_V4_STAGE1_PARITY32_MANIFEST_V1.jsonl | awk '{print $1}')" = "384f1a6d08f79c6a9d73dc4298f1a1fac245d9f43bed2e77a5395cc1a2f4711e"
          test "$(sha256sum p2/MPSEF_P2_V2_STAGE1_V1.jsonl | awk '{print $1}')" = "df89c7dc2c7f177b3c4ca02e8df8a291b6de917a81246c5258f1f66652e1f69e"

      - name: Build exact parity32 production inputs
        run: |
          set -euo pipefail
          python phase2/redesign/mpsef_p2_v2_stage2_build_parity32_input_v1.py             --manifest parity32/MPSEF_V4_STAGE1_PARITY32_MANIFEST_V1.jsonl             --frozen-p2 p2/MPSEF_P2_V2_STAGE1_V1.jsonl             --fresh-out P2_STAGE2_PARITY32_INPUT.jsonl             --reversed-out P2_STAGE2_PARITY32_INPUT_REVERSED.jsonl             | tee P2_STAGE2_PARITY32_INPUT_BUILD.log
          cp P2_STAGE2_PARITY32_INPUT.jsonl P2_STAGE2_PARITY32_INPUT_REPEAT.jsonl

      - name: Clone frozen Arabic-GEC implementation
        run: |
          set -euo pipefail
          git clone https://github.com/CAMeL-Lab/arabic-gec.git upstream/arabic-gec
          git -C upstream/arabic-gec checkout 8c7fb84f3ed84d1d30beb7080b02d0f6bfe1c5bf
          test "$(git -C upstream/arabic-gec rev-parse HEAD)" = "8c7fb84f3ed84d1d30beb7080b02d0f6bfe1c5bf"

      - name: Install exact frozen P2 runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip<25"
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==1.11.0+cpu"
          python -m pip install "numpy==1.23.5" "camel-tools==1.4.1" "datasets==2.5.1" "sentencepiece==0.1.99" "protobuf==3.20.3"
          python -m pip install "huggingface-hub==0.10.1" "tokenizers==0.12.1"
          python -m pip install --force-reinstall --no-deps ./upstream/arabic-gec/transformers
          python - <<'PY'
          import transformers
          assert transformers.__version__=="4.22.2"
          from transformers import DataCollatorForSeq2SeqGEC
          print("P2_STAGE2_PARITY32_RUNTIME_OK")
          PY

      - name: Install frozen CAMeL resources
        run: |
          set -euo pipefail
          camel_data -i disambig-bert-unfactored-msa
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path.home()/".camel_tools"
          morph=[hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob("morphology.db")]
          models=[hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob("pytorch_model.bin")]
          assert "195bc25a333237a2126470da888d7936b59ed3729f9210e0a4194ba43497dd70" in morph
          assert "a1a22431cdc0934151e4039abbd7890f06ba7c1f914ca71a90eba218401ae539" in models
          PY

      - name: Download exact frozen GED/GEC revisions
        run: |
          set -euo pipefail
          python - <<'PY'
          import shutil
          from pathlib import Path
          from huggingface_hub import snapshot_download
          ged=Path(snapshot_download(repo_id="CAMeL-Lab/camelbert-msa-qalb14-ged-13",revision="447179dc63d186e4bff09a993e90e73ad622d571",cache_dir="hf_cache"))
          gec=Path(snapshot_download(repo_id="CAMeL-Lab/arabart-qalb14-gec-ged-13",revision="410588a318d988cdcfdbf64cf5745ed4adea0f6a",cache_dir="hf_cache"))
          shutil.copytree(ged,"p2v2_ged_model",symlinks=False)
          shutil.copytree(gec,"p2v2_gec_model",symlinks=False)
          PY
          test "$(sha256sum p2v2_ged_model/pytorch_model.bin | awk '{print $1}')" = "23385ffe560860a8f5e9e46e05b66a31c33a4b0bd58e9a718933fdab8161f50f"
          test "$(sha256sum p2v2_gec_model/pytorch_model.bin | awk '{print $1}')" = "5eadbd894d7ba21e18ca53e118af20858b2e87a4d0b02f41d75e91e33919bb5f"

      - name: Run FRESH through exact Stage2 production CLI + Watchdog V2
        env:
          TOKENIZERS_PARALLELISM: "false"
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IN_SHA="$(sha256sum P2_STAGE2_PARITY32_INPUT.jsonl | awk '{print $1}')"
          python phase2/redesign/run_with_progress_watchdog_v2.py             --state-file P2_STAGE2_PARITY32_FRESH_PROGRESS.json             --watchdog-state-file P2_STAGE2_PARITY32_FRESH_WATCHDOG.json             --context "acad-pass/p2-stage2-parity32-fresh"             --poll-seconds 20 --publish-seconds 60 --stale-seconds 600             --term-grace-seconds 30 --kill-on-stale --             python phase2/redesign/mpsef_p2_v2_stage2_production_adapter_v1.py               --input-jsonl P2_STAGE2_PARITY32_INPUT.jsonl               --expected-count 32 --expected-input-sha256 "$IN_SHA"               --ged-model-dir p2v2_ged_model --gec-model-dir p2v2_gec_model               --out-jsonl P2_STAGE2_PARITY32_FRESH.jsonl               --run-state P2_STAGE2_PARITY32_FRESH_RUN_STATE.json               --progress-state P2_STAGE2_PARITY32_FRESH_PROGRESS.json               --summary P2_STAGE2_PARITY32_FRESH_SUMMARY.json

      - name: Run REPEAT through exact Stage2 production CLI + Watchdog V2
        env:
          TOKENIZERS_PARALLELISM: "false"
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IN_SHA="$(sha256sum P2_STAGE2_PARITY32_INPUT_REPEAT.jsonl | awk '{print $1}')"
          python phase2/redesign/run_with_progress_watchdog_v2.py             --state-file P2_STAGE2_PARITY32_REPEAT_PROGRESS.json             --watchdog-state-file P2_STAGE2_PARITY32_REPEAT_WATCHDOG.json             --context "acad-pass/p2-stage2-parity32-repeat"             --poll-seconds 20 --publish-seconds 60 --stale-seconds 600             --term-grace-seconds 30 --kill-on-stale --             python phase2/redesign/mpsef_p2_v2_stage2_production_adapter_v1.py               --input-jsonl P2_STAGE2_PARITY32_INPUT_REPEAT.jsonl               --expected-count 32 --expected-input-sha256 "$IN_SHA"               --ged-model-dir p2v2_ged_model --gec-model-dir p2v2_gec_model               --out-jsonl P2_STAGE2_PARITY32_REPEAT.jsonl               --run-state P2_STAGE2_PARITY32_REPEAT_RUN_STATE.json               --progress-state P2_STAGE2_PARITY32_REPEAT_PROGRESS.json               --summary P2_STAGE2_PARITY32_REPEAT_SUMMARY.json

      - name: Run REVERSED through exact Stage2 production CLI + Watchdog V2
        env:
          TOKENIZERS_PARALLELISM: "false"
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IN_SHA="$(sha256sum P2_STAGE2_PARITY32_INPUT_REVERSED.jsonl | awk '{print $1}')"
          python phase2/redesign/run_with_progress_watchdog_v2.py             --state-file P2_STAGE2_PARITY32_REVERSED_PROGRESS.json             --watchdog-state-file P2_STAGE2_PARITY32_REVERSED_WATCHDOG.json             --context "acad-pass/p2-stage2-parity32-reversed"             --poll-seconds 20 --publish-seconds 60 --stale-seconds 600             --term-grace-seconds 30 --kill-on-stale --             python phase2/redesign/mpsef_p2_v2_stage2_production_adapter_v1.py               --input-jsonl P2_STAGE2_PARITY32_INPUT_REVERSED.jsonl               --expected-count 32 --expected-input-sha256 "$IN_SHA"               --ged-model-dir p2v2_ged_model --gec-model-dir p2v2_gec_model               --out-jsonl P2_STAGE2_PARITY32_REVERSED.jsonl               --run-state P2_STAGE2_PARITY32_REVERSED_RUN_STATE.json               --progress-state P2_STAGE2_PARITY32_REVERSED_PROGRESS.json               --summary P2_STAGE2_PARITY32_REVERSED_SUMMARY.json

      - name: Verify production-bound parity32
        run: |
          set -euo pipefail
          python phase2/redesign/mpsef_p2_v2_stage2_production_bound_parity32_v1.py             --manifest parity32/MPSEF_V4_STAGE1_PARITY32_MANIFEST_V1.jsonl             --frozen-p2 p2/MPSEF_P2_V2_STAGE1_V1.jsonl             --fresh P2_STAGE2_PARITY32_FRESH.jsonl             --repeat P2_STAGE2_PARITY32_REPEAT.jsonl             --reversed P2_STAGE2_PARITY32_REVERSED.jsonl             --out MPSEF_P2_V2_STAGE2_PRODUCTION_BOUND_PARITY32_V1.json             | tee P2_STAGE2_PRODUCTION_BOUND_PARITY32.log

      - name: Freeze identities
        if: always()
        run: |
          python -m pip freeze > P2_STAGE2_PARITY32_PIP_FREEZE.txt
          sha256sum             phase2/redesign/mpsef_p2_v2_stage2_production_adapter_v1.py             phase2/redesign/run_with_progress_watchdog_v2.py             phase2/redesign/mpsef_p2_v2_stage2_build_parity32_input_v1.py             phase2/redesign/mpsef_p2_v2_stage2_production_bound_parity32_v1.py             parity32/MPSEF_V4_STAGE1_PARITY32_MANIFEST_V1.jsonl             p2/MPSEF_P2_V2_STAGE1_V1.jsonl             P2_STAGE2_PARITY32_INPUT.jsonl             P2_STAGE2_PARITY32_FRESH.jsonl             P2_STAGE2_PARITY32_REPEAT.jsonl             P2_STAGE2_PARITY32_REVERSED.jsonl             MPSEF_P2_V2_STAGE2_PRODUCTION_BOUND_PARITY32_V1.json             P2_STAGE2_PARITY32_PIP_FREEZE.txt             .github/workflows/phase2-mpsef-p2-v2-stage2-production-bound-parity32.yml             > P2_STAGE2_PRODUCTION_BOUND_PARITY32_SHA256.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mpsef-p2-v2-stage2-production-bound-parity32-v1
          path: |
            P2_STAGE2_PARITY32_INPUT_BUILD.log
            P2_STAGE2_PARITY32_FRESH.jsonl
            P2_STAGE2_PARITY32_FRESH_RUN_STATE.json
            P2_STAGE2_PARITY32_FRESH_PROGRESS.json
            P2_STAGE2_PARITY32_FRESH_WATCHDOG.json
            P2_STAGE2_PARITY32_REPEAT.jsonl
            P2_STAGE2_PARITY32_REPEAT_RUN_STATE.json
            P2_STAGE2_PARITY32_REPEAT_PROGRESS.json
            P2_STAGE2_PARITY32_REPEAT_WATCHDOG.json
            P2_STAGE2_PARITY32_REVERSED.jsonl
            P2_STAGE2_PARITY32_REVERSED_RUN_STATE.json
            P2_STAGE2_PARITY32_REVERSED_PROGRESS.json
            P2_STAGE2_PARITY32_REVERSED_WATCHDOG.json
            MPSEF_P2_V2_STAGE2_PRODUCTION_BOUND_PARITY32_V1.json
            P2_STAGE2_PRODUCTION_BOUND_PARITY32.log
            P2_STAGE2_PARITY32_PIP_FREEZE.txt
            P2_STAGE2_PRODUCTION_BOUND_PARITY32_SHA256.txt
          if-no-files-found: warn
          retention-days: 90
