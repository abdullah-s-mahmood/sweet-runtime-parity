name: AT0 EN V2.6 R4.2B dev-only boundary error analysis

on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/r42b_dev_boundary_error_trigger_v1.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: at0-en-v2-6-r4-2b-dev-boundary-error-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: at0-en-v2.6-dev
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install frozen diagnostic runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet \
            numpy==1.26.4 \
            torch==2.2.2 \
            transformers==4.39.3 \
            accelerate==0.28.0 \
            seqeval==1.2.2 \
            safetensors==0.4.3

      - name: Download exact completed R4.2B artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: at0-en-v2-6-r4-2b-source-aligned-train-calibration
          path: ${{ runner.temp }}/r42b_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37409097042

      - name: Acquire only frozen development split
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r42b_diag/data"
          python - <<'PY'
          import hashlib, os, pathlib, urllib.request
          url=(
              "https://raw.githubusercontent.com/BIDS-Xu-Lab/section_specific_annotation_of_PICO/"
              "bc4b878773192f38b2600ec830ca4208b82f7dc0/data/EBM-NLPmod/fold1/dev.txt"
          )
          raw=urllib.request.urlopen(url,timeout=30).read()
          got=hashlib.sha256(raw).hexdigest()
          expected="3b12534fedec35660587e6a5084b0b8ff11267c1da4a2f5afe9aa16c4941340a"
          if got!=expected:
              raise SystemExit(f"dev hash mismatch: {got}")
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"r42b_diag"/"data"/"dev.txt"
          p.write_bytes(raw)
          print(f"DEV_ONLY_OK sha256={got} bytes={len(raw)}")
          PY

      - name: Freeze diagnostic identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r42b_diag"
          python -V > "$RUNNER_TEMP/r42b_diag/RUNTIME.txt"
          python -m pip freeze | sort >> "$RUNNER_TEMP/r42b_diag/RUNTIME.txt"
          sha256sum \
            phase2/academic_transform/at0_en/v2_6/r4_2b_dev_boundary_error_analysis.py \
            phase2/academic_transform/at0_en/v2_6/r4_2b_source_aligned_train_calibrate_witness.py \
            > "$RUNNER_TEMP/r42b_diag/ANALYZER_SHA256.txt"

      - name: Run frozen-dev boundary and confidence analysis
        shell: bash
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          TOKENIZERS_PARALLELISM: "false"
          PYTHONHASHSEED: "42"
        run: |
          set -euo pipefail
          python phase2/academic_transform/at0_en/v2_6/r4_2b_dev_boundary_error_analysis.py \
            --model-dir "$RUNNER_TEMP/r42b_source/out/selected_model" \
            --dev "$RUNNER_TEMP/r42b_diag/data/dev.txt" \
            --out "$RUNNER_TEMP/r42b_diag/out" \
            | tee "$RUNNER_TEMP/r42b_diag/ANALYSIS_STDOUT.json"

      - name: Hash diagnostic outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/r42b_diag/out" ]; then
            find "$RUNNER_TEMP/r42b_diag/out" -type f -print0 | sort -z | xargs -0 sha256sum \
              > "$RUNNER_TEMP/r42b_diag/OUTPUT_SHA256.txt" || true
          fi

      - name: Upload dev-only diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: at0-en-v2-6-r4-2b-dev-boundary-error-analysis
          path: |
            ${{ runner.temp }}/r42b_diag/RUNTIME.txt
            ${{ runner.temp }}/r42b_diag/ANALYZER_SHA256.txt
            ${{ runner.temp }}/r42b_diag/ANALYSIS_STDOUT.json
            ${{ runner.temp }}/r42b_diag/OUTPUT_SHA256.txt
            ${{ runner.temp }}/r42b_diag/out/R4_2B_DEV_BOUNDARY_ERROR_ANALYSIS.json
            ${{ runner.temp }}/r42b_diag/out/R4_2B_DEV_BOUNDARY_ERROR_ANALYSIS.md
          if-no-files-found: warn
          retention-days: 90
