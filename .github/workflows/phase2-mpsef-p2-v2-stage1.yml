name: Phase 2 MP-SEF P2 V2 Stage1 Source-Only

on:
  push:
    branches:
      - phase2-arabic-eval
    paths:
      - ".github/workflows/phase2-mpsef-p2-v2-stage1.yml"
      - "phase2/redesign/mpsef_p2_v2_stage1_v1.py"
      - "phase2/redesign/mpsef_p2_v2_real_model_stage0.py"
      - "phase2/redesign/process_progress_v1.py"
      - "phase2/redesign/run_with_progress_watchdog_v1.py"
      - "phase2/redesign/MPSEF_P2_V2_WORD_IDENTITY_CONTRACT_V1.md"
      - "phase2/redesign/MPSEF_V4_STAGE1_PACKET_LOCK_V1.md"
      - "phase2/redesign/MPSEF_STAGE1_EXECUTION_APPLICABILITY_NOTE_V1.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  p2-v2-stage1:
    runs-on: ubuntu-22.04
    timeout-minutes: 110

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Download frozen Stage1 packet
        uses: actions/download-artifact@v4
        with:
          name: mpsef-v4-stage1-packet-v1
          path: stage1_packet
          repository: abdullah-s-mahmood/sweet-runtime-parity
          run-id: 36871466394
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Stage1 packet identity
        run: |
          set -euo pipefail
          test -f stage1_packet/MPSEF_V4_STAGE1_PACKET_V1.jsonl
          test "$(sha256sum stage1_packet/MPSEF_V4_STAGE1_PACKET_V1.jsonl | awk '{print $1}')" = "8460900d88656ff25fe4da05d156ba0b31980188e3d1135052ed1825f10087b1"
          test "$(sha256sum stage1_packet/MPSEF_V4_STAGE1_PACKET_V1_UIDS.txt | awk '{print $1}')" = "e32b468f27653a1bbabfa5c355483c34ffe9b6e4cb2425c36e6c10b714c104ac"
          test "$(sha256sum stage1_packet/MPSEF_V4_STAGE1_PACKET_V1_CLUSTERS.txt | awk '{print $1}')" = "95b895d424d404d80a70b5acb8ac8b98fe8b461f8b03c2532a7535853f9a25ca"
          echo "P2_V2_STAGE1_PACKET_IDENTITY_OK"

      - name: Clone frozen Arabic-GEC implementation
        run: |
          set -euo pipefail
          git clone https://github.com/CAMeL-Lab/arabic-gec.git upstream/arabic-gec
          git -C upstream/arabic-gec checkout 8c7fb84f3ed84d1d30beb7080b02d0f6bfe1c5bf
          test "$(git -C upstream/arabic-gec rev-parse HEAD)" = "8c7fb84f3ed84d1d30beb7080b02d0f6bfe1c5bf"
          grep -q "self.embed_ged_tags = nn.Embedding" upstream/arabic-gec/transformers/src/transformers/models/mbart/modeling_mbart.py
          grep -q "hidden_states = inputs_embeds + embed_pos + ged_tags_embed" upstream/arabic-gec/transformers/src/transformers/models/mbart/modeling_mbart.py
          echo "P2_V2_STAGE1_UPSTREAM_IDENTITY_OK"

      - name: Install frozen P2 runtime stack
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip<25"
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==1.11.0+cpu"
          python -m pip install "numpy==1.23.5" "camel-tools==1.4.1" "datasets==2.5.1" "sentencepiece==0.1.99" "protobuf==3.20.3"
          python -m pip install "huggingface-hub==0.10.1" "tokenizers==0.12.1"
          python -m pip install --force-reinstall --no-deps ./upstream/arabic-gec/transformers
          python - <<'PY'
          import transformers
          assert transformers.__version__ == "4.22.2"
          from transformers import DataCollatorForSeq2SeqGEC
          print("P2_V2_STAGE1_MODIFIED_TRANSFORMERS_OK")
          PY

      - name: Install frozen CAMeL resources
        run: |
          set -euo pipefail
          camel_data -i disambig-bert-unfactored-msa
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected_morph="195bc25a333237a2126470da888d7936b59ed3729f9210e0a4194ba43497dd70"
          expected_disambig="a1a22431cdc0934151e4039abbd7890f06ba7c1f914ca71a90eba218401ae539"
          root=Path.home()/".camel_tools"
          morph=[hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob("morphology.db")]
          models=[hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob("pytorch_model.bin")]
          assert expected_morph in morph,(expected_morph,morph)
          assert expected_disambig in models,(expected_disambig,models)
          print("P2_V2_STAGE1_CAMEL_RESOURCES_OK")
          PY

      - name: Download exact frozen GED/GEC model revisions
        run: |
          set -euo pipefail
          python - <<'PY'
          import shutil
          from pathlib import Path
          from huggingface_hub import snapshot_download
          ged_rev="447179dc63d186e4bff09a993e90e73ad622d571"
          gec_rev="410588a318d988cdcfdbf64cf5745ed4adea0f6a"
          ged_src=Path(snapshot_download(repo_id="CAMeL-Lab/camelbert-msa-qalb14-ged-13",revision=ged_rev,cache_dir="hf_cache"))
          gec_src=Path(snapshot_download(repo_id="CAMeL-Lab/arabart-qalb14-gec-ged-13",revision=gec_rev,cache_dir="hf_cache"))
          shutil.copytree(ged_src,"p2v2_ged_model",symlinks=False)
          shutil.copytree(gec_src,"p2v2_gec_model",symlinks=False)
          print("P2_V2_STAGE1_MODELS_READY")
          PY
          test "$(sha256sum p2v2_ged_model/pytorch_model.bin | awk '{print $1}')" = "23385ffe560860a8f5e9e46e05b66a31c33a4b0bd58e9a718933fdab8161f50f"
          test "$(sha256sum p2v2_gec_model/pytorch_model.bin | awk '{print $1}')" = "5eadbd894d7ba21e18ca53e118af20858b2e87a4d0b02f41d75e91e33919bb5f"

      - name: Run monitored P2_V2 Stage1 source-only proposals
        env:
          TOKENIZERS_PARALLELISM: "false"
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 45m             python phase2/redesign/run_with_progress_watchdog_v1.py               --state-file MPSEF_P2_V2_STAGE1_PROGRESS.json               --context "acad-pass/p2-v2-stage1"               --poll-seconds 20               --publish-seconds 60               --stale-seconds 600               --kill-on-stale               --               python phase2/redesign/mpsef_p2_v2_stage1_v1.py                 --packet stage1_packet/MPSEF_V4_STAGE1_PACKET_V1.jsonl                 --ged-model-dir p2v2_ged_model                 --gec-model-dir p2v2_gec_model                 --out-prefix MPSEF_P2_V2_STAGE1_V1                 --progress-state MPSEF_P2_V2_STAGE1_PROGRESS.json                 --progress-every 8

      - name: Validate P2_V2 Stage1 artifact
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          rows=[json.loads(x) for x in pathlib.Path("MPSEF_P2_V2_STAGE1_V1.jsonl").read_text(encoding="utf-8").splitlines() if x.strip()]
          s=json.loads(pathlib.Path("MPSEF_P2_V2_STAGE1_V1_SUMMARY.json").read_text(encoding="utf-8"))
          p=json.loads(pathlib.Path("MPSEF_P2_V2_STAGE1_V1_PARITY.json").read_text(encoding="utf-8"))
          progress=json.loads(pathlib.Path("MPSEF_P2_V2_STAGE1_PROGRESS.json").read_text(encoding="utf-8"))
          assert s["status"]=="SOURCE_ONLY_PROPOSALS_COMPLETE"
          assert len(rows)==128==s["cases"]
          assert len({r["uid"] for r in rows})==128
          assert len({r["cluster_id"] for r in rows})==128==s["clusters"]
          assert s["packet_sha256"]=="8460900d88656ff25fe4da05d156ba0b31980188e3d1135052ed1825f10087b1"
          assert s["registry_sha256"]=="b448650c571f6c93dffe4825417e4f65d6a8cd02e33bd9551728ceac2b242b1a"
          assert s["repeat_parity_match"]==8
          assert s["reorder_parity_match"]==8
          assert s["true_model_batch_call_supported"] is False
          assert s["batch_vs_single_parity"]=="NOT_APPLICABLE_SINGLE_CASE_MODEL_CALL_IMPLEMENTATION"
          assert s["source_only"] is True
          assert s["project_source_loaded"] is True
          assert s["project_source_scope"]=="FROZEN_STAGE1_128_ONLY"
          assert s["gold_reference_consulted"] is False
          assert s["project_gold_loaded"] is False
          assert s["quality_metric_computed"] is False
          assert s["r_joint_computed"] is False
          assert s["selector_trained"] is False
          assert s["quality_claimed"] is False
          assert p["repeat_match"]==8 and p["reorder_match"]==8
          assert progress["status"]=="COMPLETE"
          assert progress["processed"]==152==progress["total"]
          assert progress["percent"]==100.0
          for r in rows:
              assert r["source_only"] is True
              assert r["gold_reference_consulted"] is False
              assert r["quality_scored"] is False
              assert r["proposer_id"]=="P2_V2_ARABART_GED_MORPH_WORDALIGNED"
          print("P2_V2_STAGE1_SOURCE_ONLY_PASS")
          PY

      - name: Freeze environment, resource and artifact hashes
        if: always()
        run: |
          python -m pip freeze > MPSEF_P2_V2_STAGE1_V1_PIP_FREEZE.txt
          sha256sum             phase2/redesign/mpsef_p2_v2_stage1_v1.py             phase2/redesign/mpsef_p2_v2_real_model_stage0.py             phase2/redesign/process_progress_v1.py             phase2/redesign/run_with_progress_watchdog_v1.py             phase2/redesign/MPSEF_P2_V2_WORD_IDENTITY_CONTRACT_V1.md             phase2/redesign/MPSEF_V4_STAGE1_PACKET_LOCK_V1.md             phase2/redesign/MPSEF_STAGE1_EXECUTION_APPLICABILITY_NOTE_V1.md             .github/workflows/phase2-mpsef-p2-v2-stage1.yml             stage1_packet/MPSEF_V4_STAGE1_PACKET_V1.jsonl             upstream/arabic-gec/transformers/src/transformers/models/mbart/modeling_mbart.py             p2v2_ged_model/pytorch_model.bin             p2v2_gec_model/pytorch_model.bin             MPSEF_P2_V2_STAGE1_V1.jsonl             MPSEF_P2_V2_STAGE1_V1_SUMMARY.json             MPSEF_P2_V2_STAGE1_V1_PARITY.json             MPSEF_P2_V2_STAGE1_PROGRESS.json             MPSEF_P2_V2_STAGE1_V1_PIP_FREEZE.txt             > MPSEF_P2_V2_STAGE1_V1_SHA256.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mpsef-p2-v2-stage1-v1
          path: |
            MPSEF_P2_V2_STAGE1_V1.jsonl
            MPSEF_P2_V2_STAGE1_V1_SUMMARY.json
            MPSEF_P2_V2_STAGE1_V1_PARITY.json
            MPSEF_P2_V2_STAGE1_PROGRESS.json
            MPSEF_P2_V2_STAGE1_V1_PIP_FREEZE.txt
            MPSEF_P2_V2_STAGE1_V1_SHA256.txt
          if-no-files-found: warn
          retention-days: 90
