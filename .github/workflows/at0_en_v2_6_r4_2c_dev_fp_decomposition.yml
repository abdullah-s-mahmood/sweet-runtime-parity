name: AT0 EN V2.6 R4.2C dev FP decomposition

on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/r42c_dev_fp_decomposition_trigger_v1.txt'

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: at0-en-v2.6-dev
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet numpy==1.26.4 torch==2.2.2 transformers==4.39.3 accelerate==0.28.0 safetensors==0.4.3
      - name: Download frozen R4.2C result models
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: at0-en-v2-6-r4-2c-boundary-consensus-train-calibration
          path: ${{ runner.temp }}/r42c
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37464774424
      - name: Download exact frozen R4.2B model
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: at0-en-v2-6-r4-2b-source-aligned-train-calibration
          path: ${{ runner.temp }}/r4b
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37409097042
      - name: Acquire and verify frozen dev
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/data"
          python - <<'PY'
          import hashlib, os, pathlib, urllib.request
          url="https://raw.githubusercontent.com/BIDS-Xu-Lab/section_specific_annotation_of_PICO/bc4b878773192f38b2600ec830ca4208b82f7dc0/data/EBM-NLPmod/fold1/dev.txt"
          raw=urllib.request.urlopen(url,timeout=30).read()
          want="3b12534fedec35660587e6a5084b0b8ff11267c1da4a2f5afe9aa16c4941340a"
          got=hashlib.sha256(raw).hexdigest()
          if got!=want: raise SystemExit(f"dev hash mismatch {got}")
          (pathlib.Path(os.environ["RUNNER_TEMP"])/"data"/"dev.txt").write_bytes(raw)
          PY
      - name: Run read-only dev false-positive decomposition
        shell: bash
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          TOKENIZERS_PARALLELISM: "false"
          PYTHONHASHSEED: "42"
        run: |
          set -euo pipefail
          python phase2/academic_transform/at0_en/v2_6/r4_2c_dev_fp_decomposition.py             --dev "$RUNNER_TEMP/data/dev.txt"             --r4b-model-dir "$RUNNER_TEMP/r4b/out/selected_model"             --boundary-model-dir "$RUNNER_TEMP/r42c/out/boundary_model"             --span-model-dir "$RUNNER_TEMP/r42c/out/span_model"             --out "$RUNNER_TEMP/diag"
      - name: Freeze hashes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum phase2/academic_transform/at0_en/v2_6/r4_2c_dev_fp_decomposition.py > "$RUNNER_TEMP/diag/DIAGNOSTIC_SHA256.txt"
          sha256sum "$RUNNER_TEMP/diag/R4_2C_DEV_FP_DECOMPOSITION.json" >> "$RUNNER_TEMP/diag/DIAGNOSTIC_SHA256.txt"
      - name: Upload compact diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: at0-en-v2-6-r4-2c-dev-fp-decomposition
          path: ${{ runner.temp }}/diag
          if-no-files-found: error
          retention-days: 90
