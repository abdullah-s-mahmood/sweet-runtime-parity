name: Phase 2 MP-SEF Stage-B Classifier V1 Synthetic Preflight

on:
  push:
    branches: [phase2-arabic-eval]
    paths:
      - "phase2/redesign/mpsef_stageb_change_domain_classifier_v1.py"
      - "phase2/redesign/test_mpsef_stageb_change_domain_classifier_v1.py"
      - ".github/workflows/phase2-mpsef-stageb-classifier-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classifier:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run frozen Stage-B classifier synthetic tests
        run: |
          set -euo pipefail
          python phase2/redesign/test_mpsef_stageb_change_domain_classifier_v1.py             | tee MPSEF_STAGEB_CHANGE_DOMAIN_CLASSIFIER_V1_TEST.log
          grep -q '"status": "PASS"' MPSEF_STAGEB_CHANGE_DOMAIN_CLASSIFIER_V1_TEST.log
          grep -q '"test_count": 12' MPSEF_STAGEB_CHANGE_DOMAIN_CLASSIFIER_V1_TEST.log

      - name: Freeze hashes
        if: always()
        run: |
          sha256sum             phase2/redesign/mpsef_stageb_change_domain_classifier_v1.py             phase2/redesign/test_mpsef_stageb_change_domain_classifier_v1.py             .github/workflows/phase2-mpsef-stageb-classifier-v1.yml             MPSEF_STAGEB_CHANGE_DOMAIN_CLASSIFIER_V1_TEST.log             > MPSEF_STAGEB_CHANGE_DOMAIN_CLASSIFIER_V1_SHA256.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mpsef-stageb-change-domain-classifier-v1
          path: |
            MPSEF_STAGEB_CHANGE_DOMAIN_CLASSIFIER_V1_TEST.log
            MPSEF_STAGEB_CHANGE_DOMAIN_CLASSIFIER_V1_SHA256.txt
          if-no-files-found: warn
          retention-days: 90
