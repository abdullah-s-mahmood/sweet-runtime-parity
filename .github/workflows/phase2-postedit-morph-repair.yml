name: Phase 2 Post-Edit Morphology Environment Repair

on:
  workflow_dispatch:
  push:
    branches:
      - phase2-arabic-eval
    paths:
      - "phase2/generalization/POSTEDIT_MORPH_REPAIR_PROTOCOL.md"
      - ".github/workflows/phase2-postedit-morph-repair.yml"

permissions:
  actions: read
  contents: write

jobs:
  repair-and-evaluate:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CAMELTOOLS_DATA: ${{ github.workspace }}/.camel_tools
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-arabic-eval

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Reuse frozen post-edit consensus artifact
        uses: actions/download-artifact@v4
        with:
          name: postedit-consensus-internal
          path: artifacts/consensus
          github-token: ${{ github.token }}
          repository: abdullah-s-mahmood/sweet-runtime-parity
          run-id: 36519213784

      - name: Reuse frozen second-pass SWEET Q14 artifact
        uses: actions/download-artifact@v4
        with:
          name: postedit-sweet-q14
          path: artifacts/sweet_q14_post
          github-token: ${{ github.token }}
          repository: abdullah-s-mahmood/sweet-runtime-parity
          run-id: 36519213784

      - name: Reuse frozen second-pass SWEET ZAEBUC artifact
        uses: actions/download-artifact@v4
        with:
          name: postedit-sweet-zaebuc
          path: artifacts/sweet_zaebuc_post
          github-token: ${{ github.token }}
          repository: abdullah-s-mahmood/sweet-runtime-parity
          run-id: 36519213784

      - name: Reuse frozen second-pass AraBART artifact
        uses: actions/download-artifact@v4
        with:
          name: postedit-arabart
          path: artifacts/arabart_post
          github-token: ${{ github.token }}
          repository: abdullah-s-mahmood/sweet-runtime-parity
          run-id: 36519213784

      - name: Install known-good contextual morphology runtime
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==2.2.2+cpu"
          python -m pip install "camel-tools==1.4.1" "cachetools==4.2.4" "numpy<2" "protobuf==3.20.3" "transformers==4.44.2" "sentencepiece==0.2.0"
          mkdir -p "$CAMELTOOLS_DATA" artifacts/morph
          camel_data -i morphology-db-msa-r13
          camel_data -i disambig-bert-unfactored-msa

      - name: Run unchanged contextual morphology identity diagnostic
        run: |
          set -o pipefail
          PYTHONPATH=. python phase2/generalization/run_postedit_morphology.py 2>&1 | tee artifacts/POSTEDIT_MORPH_REPAIR_CONSOLE.txt
          test -f artifacts/POSTEDIT_MORPH_IDENTITY.jsonl
          cp artifacts/POSTEDIT_MORPH_IDENTITY.jsonl artifacts/morph/

      - name: Materialize unchanged label-free post-edit decisions
        run: |
          set -o pipefail
          PYTHONPATH=. python phase2/generalization/materialize_postedit_morph_diagnostic.py 2>&1 | tee artifacts/POSTEDIT_MORPH_MATERIALIZE_CONSOLE.txt
          sha256sum PHASE2_POSTEDIT_MORPH_FEATURES.jsonl PHASE2_POSTEDIT_MORPH_RUNTIME.json > artifacts/POSTEDIT_MORPH_FROZEN_SHA256.txt

      - name: Evaluate only after decision materialization
        run: |
          set -o pipefail
          PYTHONPATH=. python phase2/generalization/evaluate_postedit_morph_diagnostic.py 2>&1 | tee artifacts/POSTEDIT_MORPH_EVAL_CONSOLE.txt
          test -f PHASE2_POSTEDIT_MORPH_RESULTS.json

      - name: Leakage audit
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in [
              Path("PHASE2_POSTEDIT_MORPH_FEATURES.jsonl"),
              Path("PHASE2_POSTEDIT_MORPH_RUNTIME.json"),
              Path("PHASE2_POSTEDIT_MORPH_RESULTS.json"),
          ]:
              raw=p.read_text(encoding="utf-8")
              assert not any("\u0600"<=c<="\u06ff" for c in raw),p
              assert "source_text" not in raw and "corrected_text" not in raw,p
          print("post-edit morphology repair leakage audit PASS")
          PY

      - name: Persist safe repaired diagnostic evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PHASE2_POSTEDIT_MORPH_FEATURES.jsonl PHASE2_POSTEDIT_MORPH_RUNTIME.json PHASE2_POSTEDIT_MORPH_RESULTS.json
          if git diff --cached --quiet; then
            echo "Post-edit morphology diagnostic evidence unchanged."
          else
            git commit -m "Record repaired post-edit morphology diagnostic [skip ci]"
            git pull --rebase origin phase2-arabic-eval
            git push origin HEAD:phase2-arabic-eval
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-postedit-morph-repair-safe
          path: |
            PHASE2_POSTEDIT_MORPH_RUNTIME.json
            PHASE2_POSTEDIT_MORPH_RESULTS.json
            artifacts/POSTEDIT_MORPH_FROZEN_SHA256.txt
            artifacts/POSTEDIT_MORPH_REPAIR_CONSOLE.txt
            artifacts/POSTEDIT_MORPH_MATERIALIZE_CONSOLE.txt
            artifacts/POSTEDIT_MORPH_EVAL_CONSOLE.txt
          if-no-files-found: warn
          retention-days: 30
