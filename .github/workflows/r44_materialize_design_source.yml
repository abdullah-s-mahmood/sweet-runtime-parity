name: R44 materialize DESIGN-only source
on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/r44_design_source_trigger.txt'
permissions:
  contents: read
  actions: read
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: at0-en-v2.6-dev
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install parser dependency
        run: pip install --quiet transformers==4.39.3
      - name: Download frozen R4.4 preflight
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r44-oof-readonly-preflight
          path: ${{ runner.temp }}/r44/preflight
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37572165532
      - name: Acquire pinned source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r44/data"
          python - <<'PY'
          import pathlib,urllib.request,hashlib,os
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"r44/data/train.txt"
          b=urllib.request.urlopen("https://raw.githubusercontent.com/BIDS-Xu-Lab/section_specific_annotation_of_PICO/bc4b878773192f38b2600ec830ca4208b82f7dc0/data/EBM-NLPmod/fold1/train.txt",timeout=30).read()
          assert hashlib.sha256(b).hexdigest()=="6491a57e5c8639e5bfc3c0326b8501869fccab655a1ed571b75a772dc1c70a5e"
          p.write_bytes(b)
          PY
      - name: Materialize DESIGN only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/r44/out"
          python phase2/academic_transform/at0_en/v2_6/r44_materialize_design_source.py             --train "$RUNNER_TEMP/r44/data/train.txt"             --manifest "$RUNNER_TEMP/r44/preflight/R44_OOF_MANIFEST_V1.json"             --out "$RUNNER_TEMP/r44/out"
      - name: Freeze hashes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum             phase2/academic_transform/at0_en/v2_6/r44_materialize_design_source.py             "$RUNNER_TEMP/r44/out/R44_DESIGN_SOURCE.json"             "$RUNNER_TEMP/r44/out/R44_DESIGN_SOURCE_SUMMARY.json"             > "$RUNNER_TEMP/r44/out/SHA256SUMS.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r44-design-source-only
          path: ${{ runner.temp }}/r44/out
          if-no-files-found: error
          retention-days: 90
