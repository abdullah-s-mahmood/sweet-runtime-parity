name: R43 frozen FIT B read-only audit
on:
  push:
    branches: [at0-en-v2.6-dev]
    paths: [.github/diagnostics/r43_fit_b_readonly_trigger.txt]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy==1.26.4 torch==2.2.2 transformers==4.39.3 safetensors==0.4.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: at0-en-v2-6-r43-fit-ancestors
          run-id: 37535183682
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/r43/ancestors
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: at0-en-v2-6-r43-contextual-pair-preflight
          run-id: 37534110955
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/r43/preflight
      - name: Obtain verified FIT source
        run: |
          mkdir -p "$RUNNER_TEMP/r43/data"
          python - <<'PY'
          import pathlib, os, urllib.request, hashlib
          u="https://raw.githubusercontent.com/BIDS-Xu-Lab/section_specific_annotation_of_PICO/bc4b878773192f38b2600ec830ca4208b82f7dc0/data/EBM-NLPmod/fold1/train.txt"
          b=urllib.request.urlopen(u,timeout=30).read()
          assert hashlib.sha256(b).hexdigest()=="6491a57e5c8639e5bfc3c0326b8501869fccab655a1ed571b75a772dc1c70a5e"
          (pathlib.Path(os.environ["RUNNER_TEMP"])/"r43/data/train.txt").write_bytes(b)
          PY
      - name: Replay frozen B on FIT only
        env:
          TRANSFORMERS_OFFLINE: '1'
          HF_HUB_OFFLINE: '1'
        run: |
          python phase2/academic_transform/at0_en/v2_6/r43_fit_b_native_error_causal_audit.py \
            --train "$RUNNER_TEMP/r43/data/train.txt" \
            --split "$RUNNER_TEMP/r43/preflight/R43_FIT_SELECT_MANIFEST.json" \
            --b-model "$RUNNER_TEMP/r43/ancestors/out/b_candidate" \
            --out "$RUNNER_TEMP/r43/out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r43-fit-b-readonly-causal-audit
          path: ${{ runner.temp }}/r43/out
          if-no-files-found: warn
