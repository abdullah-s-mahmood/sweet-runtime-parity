name: Phase 2 Independent Candidate Acceptance Gate

on:
  workflow_dispatch:
  push:
    branches:
      - phase2-arabic-eval
    paths:
      - "phase2/acceptance/**"
      - ".github/workflows/phase2-independent-acceptance-gate.yml"

permissions:
  contents: write

jobs:
  acceptance-gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      CAMELTOOLS_DATA: ${{ github.workspace }}/.camel_tools
      HF_HUB_DISABLE_TELEMETRY: "1"

    steps:
      - name: Checkout Phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: phase2-arabic-eval

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Clone and pin official CAMeL-Lab Arabic GEC
        run: |
          mkdir -p upstream
          git clone https://github.com/CAMeL-Lab/arabic-gec.git upstream/arabic-gec
          git -C upstream/arabic-gec checkout 8c7fb84f3ed84d1d30beb7080b02d0f6bfe1c5bf
          test "$(git -C upstream/arabic-gec rev-parse HEAD)" = "8c7fb84f3ed84d1d30beb7080b02d0f6bfe1c5bf"

      - name: Install official Arabic-GEC compatible runtime
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu torch==1.11.0+cpu
          python -m pip install "numpy<1.24" "protobuf==3.20.3" "sentencepiece==0.1.99" "datasets==2.5.1" "camel-tools==1.4.1" "editdistance==0.6.2"
          python -m pip install -e upstream/arabic-gec/transformers
          python -m pip check
          python - <<'PY'
          import torch, transformers, camel_tools
          print("python runtime OK")
          print("torch", torch.__version__)
          print("transformers", transformers.__version__)
          print("camel_tools", camel_tools.__version__)
          assert torch.__version__.startswith("1.11.0")
          assert transformers.__version__ == "4.22.2"
          PY

      - name: Install CAMeL morphology/disambiguation resources
        run: |
          mkdir -p "$CAMELTOOLS_DATA"
          camel_data -i morphology-db-msa-r13
          camel_data -i disambig-bert-unfactored-msa

      - name: Resolve and download public GED and AraBART models
        run: |
          mkdir -p artifacts models/arabart_ged_qalb14 models/arabart_gec_qalb14_ged13
          python - <<'PY'
          import json
          from huggingface_hub import HfApi, snapshot_download
          specs={
            "ged_qalb14":{
              "repo":"CAMeL-Lab/camelbert-msa-qalb14-ged-13",
              "dir":"models/arabart_ged_qalb14"
            },
            "gec_qalb14_morph_ged13":{
              "repo":"CAMeL-Lab/arabart-qalb14-gec-ged-13",
              "dir":"models/arabart_gec_qalb14_ged13"
            }
          }
          api=HfApi()
          out={}
          for name,s in specs.items():
            info=api.model_info(s["repo"])
            out[name]={"repo":s["repo"],"revision":info.sha}
            print(name,s["repo"],info.sha)
            snapshot_download(repo_id=s["repo"],revision=info.sha,local_dir=s["dir"])
          with open("artifacts/ARABART_MODEL_REVISIONS.json","w",encoding="utf-8") as f:
            json.dump(out,f,ensure_ascii=False,indent=2)
          PY

      - name: Validate fixed development evidence
        run: |
          test -f PHASE2_SURGICAL_ADJUDICATION_QUEUE.jsonl
          test -f PHASE2_SURGICAL_APPLIED_EDIT_ADJUDICATION.jsonl
          test -f PHASE2_NORMALIZED_CANDIDATE_QUEUE.jsonl
          test -f PHASE2_NORMALIZED_CANDIDATE_ADJUDICATION.jsonl
          test -f PHASE2_MORPH_SURFACE_ADJUDICATION_QUEUE.jsonl
          python - <<'PY'
          import json
          def read(path):
            return [json.loads(x) for x in open(path,encoding="utf-8") if x.strip()]
          surg=read("PHASE2_SURGICAL_APPLIED_EDIT_ADJUDICATION.jsonl")
          norm=read("PHASE2_NORMALIZED_CANDIDATE_ADJUDICATION.jsonl")
          assert len(surg)==60, len(surg)
          assert len(norm)==19, len(norm)
          print("fixed candidate population",len(surg)+len(norm))
          PY

      - name: Run official AraBART Morph+GED second generator
        run: |
          set -o pipefail
          python phase2/acceptance/run_arabart_second_generator.py 2>&1 | tee artifacts/ARABART_SECOND_GENERATOR_CONSOLE.txt

      - name: Build gold-independent acceptance features and policies
        run: |
          set -o pipefail
          python phase2/acceptance/build_acceptance_gate.py 2>&1 | tee artifacts/ACCEPTANCE_GATE_CONSOLE.txt
          cp artifacts/ARABART_SECOND_GENERATOR.json PHASE2_ARABART_SECOND_GENERATOR.json
          cp artifacts/ARABART_MODEL_REVISIONS.json PHASE2_ARABART_MODEL_REVISIONS.json

      - name: Write acceptance manifest
        run: |
          python - <<'PY'
          import json, os, subprocess
          summary=json.load(open("PHASE2_ACCEPTANCE_GATE_SUMMARY.json",encoding="utf-8"))
          manifest={
            "repository":os.environ["GITHUB_REPOSITORY"],
            "branch":os.environ["GITHUB_REF_NAME"],
            "workflow_source_commit":os.environ["GITHUB_SHA"],
            "run_id":os.environ["GITHUB_RUN_ID"],
            "phase":"Phase 2 — Independent Candidate Acceptance Gate",
            "arabic_gec_upstream_commit":"8c7fb84f3ed84d1d30beb7080b02d0f6bfe1c5bf",
            "runtime_candidates":summary["runtime_candidates"],
            "surgical_candidates":summary["surgical_candidates"],
            "normalized_candidates":summary["normalized_candidates"],
            "arabart_new_unadjudicated_edits":summary["arabart_new_unadjudicated_edits"],
            "runtime_decisions_materialized_before_human_labels":True,
            "sealed":False,
            "phase3":False,
            "files":[
              "PHASE2_ARABART_SECOND_GENERATOR.json",
              "PHASE2_ARABART_MODEL_REVISIONS.json",
              "PHASE2_ACCEPTANCE_RUNTIME_FEATURES.jsonl",
              "PHASE2_ACCEPTANCE_POLICY_RESULTS.json",
              "PHASE2_ACCEPTANCE_GATE_SUMMARY.json",
              "PHASE2_ARABART_NEW_EDIT_QUEUE.jsonl"
            ]
          }
          json.dump(manifest,open("PHASE2_ACCEPTANCE_GATE_MANIFEST.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)
          PY

      - name: Persist acceptance gate evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PHASE2_ARABART_SECOND_GENERATOR.json PHASE2_ARABART_MODEL_REVISIONS.json PHASE2_ACCEPTANCE_RUNTIME_FEATURES.jsonl PHASE2_ACCEPTANCE_POLICY_RESULTS.json PHASE2_ACCEPTANCE_GATE_SUMMARY.json PHASE2_ARABART_NEW_EDIT_QUEUE.jsonl PHASE2_ACCEPTANCE_GATE_MANIFEST.json
          if git diff --cached --quiet; then
            echo "Acceptance gate evidence unchanged."
          else
            git commit -m "Update independent acceptance gate evidence [skip ci]"
            git push origin HEAD:phase2-arabic-eval
          fi

      - name: Record provenance
        if: always()
        run: |
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
          } > artifacts/ACCEPTANCE_GATE_GITHUB_PROVENANCE.txt

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-independent-acceptance-gate-evidence
          path: |
            artifacts/
            PHASE2_ACCEPTANCE_*.json
            PHASE2_ACCEPTANCE_*.jsonl
            PHASE2_ARABART_*.json
            PHASE2_ARABART_*.jsonl
          if-no-files-found: warn
          retention-days: 30
