name: Phase 2 QALB15 WAW-ALIF Raw Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - phase2-arabic-eval
    paths:
      - "phase2/generalization/diagnose_qalb15_waw_alif.py"
      - ".github/workflows/phase2-qalb15-waw-diagnostic.yml"

permissions:
  contents: write

jobs:
  raw-diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      CAMELTOOLS_DATA: ${{ github.workspace }}/.camel_tools
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-arabic-eval
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Clone and pin upstream
        run: |
          mkdir -p upstream
          git clone https://github.com/CAMeL-Lab/arabic-gec.git upstream/arabic-gec
          git -C upstream/arabic-gec checkout 8c7fb84f3ed84d1d30beb7080b02d0f6bfe1c5bf
      - name: Install frozen runtime
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==1.11.0+cpu"
          python -m pip install "camel-tools==1.4.1" "cachetools==4.2.4" "sentencepiece==0.1.99" "protobuf==3.20.3" "numpy<2"
          python -m pip uninstall -y transformers || true
          python -m pip install -e upstream/arabic-gec/transformers
          python -m pip install "huggingface_hub>=0.9,<1.0"
          mkdir -p "$CAMELTOOLS_DATA"
          camel_data -i morphology-db-msa-r13
          camel_data -i disambig-bert-unfactored-msa
      - name: Recreate raw-only runtime events
        run: |
          mkdir -p artifacts
          PYTHONPATH=. python -m phase2.generalization.run_qalb15_context_gate
      - name: Aggregate WAW-ALIF diagnostic
        run: |
          python -m phase2.generalization.diagnose_qalb15_waw_alif
      - name: Persist aggregate/hash-only diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PHASE2_QALB15_WAW_ALIF_RAW_DIAGNOSTIC.json
          if git diff --cached --quiet; then
            echo unchanged
          else
            git commit -m "Record QALB15 raw-only waw-alif diagnostic [skip ci]"
            git pull --rebase origin phase2-arabic-eval
            git push origin HEAD:phase2-arabic-eval
          fi
