name: Fresh RCT trial-balanced statistics synthetic preflight

on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/fresh_rct_stats_preflight_trigger.txt'

permissions:
  contents: read

concurrency:
  group: fresh-rct-stats-synthetic-preflight
  cancel-in-progress: false

jobs:
  synthetic:
    name: Trial-balanced statistics synthetic closure
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          cache: 'pip'
          cache-dependency-path: requirements/fresh_rct_stats.txt
      - name: Install frozen stats runtime
        run: python -m pip install --disable-pip-version-check --quiet -r requirements/fresh_rct_stats.txt
      - name: Compile
        run: python -m py_compile phase2/academic_transform/at0_en/v2_6/fresh_rct_trial_balanced_precision.py
      - name: Run synthetic-only statistical closure
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fresh_rct_stats"
          python phase2/academic_transform/at0_en/v2_6/fresh_rct_trial_balanced_precision.py             --synthetic-preflight             --out "$RUNNER_TEMP/fresh_rct_stats/FRESH_RCT_TRIAL_BALANCED_STATS_SYNTHETIC_PREFLIGHT.json"
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"fresh_rct_stats/FRESH_RCT_TRIAL_BALANCED_STATS_SYNTHETIC_PREFLIGHT.json"
          d=json.loads(p.read_text())
          assert d["state"]=="FRESH_RCT_TRIAL_BALANCED_STATS_SYNTHETIC_PREFLIGHT_PASS"
          assert d["scientific_data_used"] is False
          assert d["eval_data_used"] is False
          assert d["new_rct_data_used"] is False
          assert d["selection_label_blind"] is True
          assert d["selection_confidence_blind"] is True
          print(json.dumps(d,indent=2,sort_keys=True))
          PY
          sha256sum             phase2/academic_transform/at0_en/v2_6/fresh_rct_trial_balanced_precision.py             phase2/academic_transform/at0_en/v2_6/AT0_EN_V26_FRESH_RCT_ACQUISITION_PROTOCOL_FREEZE_V1.md             phase2/academic_transform/at0_en/v2_6/AT0_EN_V26_FRESH_RCT_ANNOTATION_ADDENDUM_V1.md             requirements/fresh_rct_stats.txt             > "$RUNNER_TEMP/fresh_rct_stats/SOURCE_SHA256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fresh-rct-trial-balanced-stats-synthetic-preflight
          path: ${{ runner.temp }}/fresh_rct_stats
          if-no-files-found: error
          retention-days: 90
