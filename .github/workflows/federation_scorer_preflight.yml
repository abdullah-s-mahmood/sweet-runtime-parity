name: Federation strict scorer synthetic preflight

on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/federation_scorer_preflight_trigger.txt'

permissions:
  contents: read

concurrency:
  group: federation-scorer-synthetic
  cancel-in-progress: false

jobs:
  scorer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - run: python -m py_compile phase2/academic_transform/at0_en/v2_6/federation_strict_scorer.py
      - name: Synthetic strict scorer closure
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scorer"
          python phase2/academic_transform/at0_en/v2_6/federation_strict_scorer.py             --synthetic-preflight             --out "$RUNNER_TEMP/scorer/FEDERATION_STRICT_SCORER_SYNTHETIC_PREFLIGHT.json"
          sha256sum phase2/academic_transform/at0_en/v2_6/federation_strict_scorer.py             phase2/academic_transform/at0_en/v2_6/AT0_EN_V26_FEDERATION_DEVELOPMENT_ATTEMPT_MANIFEST_V1.json             > "$RUNNER_TEMP/scorer/SOURCE_SHA256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: federation-strict-scorer-synthetic-preflight
          path: ${{ runner.temp }}/scorer
          if-no-files-found: error
          retention-days: 90
