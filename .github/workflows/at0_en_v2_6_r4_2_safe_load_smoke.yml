name: AT0 EN V2.6 R4.2 safe Flax load smoke

on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - 'phase2/academic_transform/R4_2_SAFE_LOAD_SMOKE_TRIGGER_V1.txt'

permissions:
  contents: read

concurrency:
  group: at0-en-v2-6-r4-2-safe-load-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: at0-en-v2.6-dev
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install frozen smoke runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet \
            numpy==1.26.4 \
            torch==2.2.2 \
            transformers==4.39.3 \
            accelerate==0.28.0 \
            seqeval==1.2.2 \
            safetensors==0.4.3 \
            huggingface_hub==0.25.2 \
            jax==0.4.25 \
            jaxlib==0.4.25 \
            flax==0.8.2

      - name: Acquire exact safe base and train data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r42smoke/model" "$RUNNER_TEMP/r42smoke/data"
          python - <<'PY'
          import hashlib, os, pathlib, urllib.request
          from huggingface_hub import snapshot_download

          model_id="microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract"
          revision="d673b8835373c6fa116d6d8006b33d48734e305d"
          files={
            "flax_model.msgpack":"2048c0dca92fe54cf2bec6c36972511ca04e546060307098139b19221dd4e93f",
            "config.json":"56bab767c02bc792897638feb8addc06d483d9c73769a5f554bbabea1f5507a1",
            "tokenizer_config.json":"53b6f42b8b8daddbdc6d3532c324187a92b46c1602bd6e8d4ad5a413b4fc90e1",
            "vocab.txt":"7b36651908a88bc38bda41b728b2a598191e0d3b553cbacf7b1e5f026d5b5b9f",
            "LICENSE.md":"8542b3a65414366ae3228e8f1658e538ec95f9b8855599c9c6e36751d592be66",
          }
          root=pathlib.Path(snapshot_download(
              repo_id=model_id, revision=revision, allow_patterns=list(files),
              local_dir=os.path.join(os.environ["RUNNER_TEMP"],"r42smoke","model"),
              local_dir_use_symlinks=False,
          ))
          def sha(raw): return hashlib.sha256(raw).hexdigest()
          for name,expected in files.items():
              raw=(root/name).read_bytes()
              if sha(raw)!=expected:
                  raise SystemExit(f"model hash mismatch {name}")
          if (root/"pytorch_model.bin").exists():
              raise SystemExit("pickle model forbidden")

          repo="BIDS-Xu-Lab/section_specific_annotation_of_PICO"
          commit="bc4b878773192f38b2600ec830ca4208b82f7dc0"
          path="data/EBM-NLPmod/fold1/train.txt"
          expected="6491a57e5c8639e5bfc3c0326b8501869fccab655a1ed571b75a772dc1c70a5e"
          raw=urllib.request.urlopen(f"https://raw.githubusercontent.com/{repo}/{commit}/{path}",timeout=30).read()
          if sha(raw)!=expected:
              raise SystemExit("train hash mismatch")
          (pathlib.Path(os.environ["RUNNER_TEMP"])/"r42smoke"/"data"/"train.txt").write_bytes(raw)
          PY

      - name: Run safe load and one-step smoke
        shell: bash
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          TOKENIZERS_PARALLELISM: "false"
          PYTHONHASHSEED: "20261005"
        run: |
          set -euo pipefail
          python phase2/academic_transform/at0_en/v2_6/r4_2_safe_flax_load_smoke.py \
            --model-dir "$RUNNER_TEMP/r42smoke/model" \
            --train "$RUNNER_TEMP/r42smoke/data/train.txt" \
            --out "$RUNNER_TEMP/r42smoke/out" \
            > "$RUNNER_TEMP/r42smoke/SMOKE_RESULT.json"

      - name: Hash smoke evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sha256sum phase2/academic_transform/at0_en/v2_6/r4_2_safe_flax_load_smoke.py \
            > "$RUNNER_TEMP/r42smoke/SMOKE_SCRIPT_SHA256.txt"
          if [ -f "$RUNNER_TEMP/r42smoke/SMOKE_RESULT.json" ]; then
            sha256sum "$RUNNER_TEMP/r42smoke/SMOKE_RESULT.json" > "$RUNNER_TEMP/r42smoke/SMOKE_RESULT_SHA256.txt"
          fi

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: at0-en-v2-6-r4-2-safe-load-smoke
          path: |
            ${{ runner.temp }}/r42smoke/SMOKE_RESULT.json
            ${{ runner.temp }}/r42smoke/SMOKE_SCRIPT_SHA256.txt
            ${{ runner.temp }}/r42smoke/SMOKE_RESULT_SHA256.txt
          if-no-files-found: warn
          retention-days: 90
