name: Federation real tokenizer windowing preflight

on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/federation_real_tokenizer_windowing_trigger.txt'

permissions:
  contents: read

concurrency:
  group: federation-real-tokenizer-windowing
  cancel-in-progress: false

jobs:
  tokenize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1, path: project}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: BIDS-Xu-Lab/section_specific_annotation_of_PICO
          ref: bc4b878773192f38b2600ec830ca4208b82f7dc0
          path: source
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: project/requirements/federation_tokenizer_windowing.txt
      - run: python -m pip install --disable-pip-version-check --quiet -r project/requirements/federation_tokenizer_windowing.txt
      - name: Run real tokenizer text-only preflight
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "bc4b878773192f38b2600ec830ca4208b82f7dc0"
          test "$(sha256sum source/data/EBM-NLPmod/fold1/train.txt | awk '{print $1}')" = "6491a57e5c8639e5bfc3c0326b8501869fccab655a1ed571b75a772dc1c70a5e"
          mkdir -p "$RUNNER_TEMP/tok"
          python project/phase2/academic_transform/at0_en/v2_6/federation_real_tokenizer_windowing.py             --train source/data/EBM-NLPmod/fold1/train.txt             --out "$RUNNER_TEMP/tok/FEDERATION_REAL_TOKENIZER_WINDOWING_PREFLIGHT.json"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"tok/FEDERATION_REAL_TOKENIZER_WINDOWING_PREFLIGHT.json"
          d=json.loads(p.read_text())
          assert d["state"]=="FEDERATION_REAL_TOKENIZER_OFFSET_WINDOWING_PREFLIGHT_PASS"
          assert not d["gold_labels_consumed"]
          assert not d["benchmark_test_used"]
          assert all(v["full_source_word_coverage"] for v in d["models"].values())
          assert all(v["deterministic_rerun_equal"] for v in d["models"].values())
          PY
          sha256sum project/phase2/academic_transform/at0_en/v2_6/federation_real_tokenizer_windowing.py             project/requirements/federation_tokenizer_windowing.txt > "$RUNNER_TEMP/tok/SOURCE_SHA256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: federation-real-tokenizer-windowing-preflight
          path: ${{ runner.temp }}/tok
          if-no-files-found: error
          retention-days: 90
