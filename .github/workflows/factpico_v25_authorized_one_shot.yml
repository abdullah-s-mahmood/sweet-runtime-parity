name: FactPICO V2.5 Authorized One-Shot Prediction

on:
  push:
    branches: [phase2-arabic-eval]
    paths:
      - 'phase2/academic_transform/at0_en/v2_4/pre_gate_c/FACTPICO_V25_EXECUTION_TRIGGER.txt'

permissions:
  contents: read

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      AUTHORIZATION_ID: FACTPICO-V5-V25-ONE-PROSPECTIVE-PREDICTION-001
      INPUT_SHA: ce7f796b13aacc2a4d3792cd3f037e77f340fb077398847c6402d9aba8776c82
      INPUT_COUNT: "345"
      EXECUTION_CHECKOUT: 659b61b6e1784bb8159f2bb1d36b41c0fb3de7ee
      LEDGER_PROVIDER: github:abdullah-s-mahmood/sweet-runtime-parity@factpico-v25-one-shot-ledger
      LEDGER_BRANCH: factpico-v25-one-shot-ledger
      LEDGER_KEY: claims/real/FACTPICO-V5-V25-ONE-PROSPECTIVE-PREDICTION-001/ce7f796b13aacc2a4d3792cd3f037e77f340fb077398847c6402d9aba8776c82/ATTEMPT_CLAIM.json

    steps:
      - name: Checkout control commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 1

      - name: Read bound claim commit from trigger
        shell: bash
        run: |
          set -euo pipefail
          TRIGGER="control/phase2/academic_transform/at0_en/v2_4/pre_gate_c/FACTPICO_V25_EXECUTION_TRIGGER.txt"
          CLAIM_COMMIT_SHA="$(tr -d '\r\n ' < "$TRIGGER")"
          test -n "$CLAIM_COMMIT_SHA"
          echo "CLAIM_COMMIT_SHA=$CLAIM_COMMIT_SHA" >> "$GITHUB_ENV"

      - name: Checkout immutable execution commit
        uses: actions/checkout@v4
        with:
          ref: 659b61b6e1784bb8159f2bb1d36b41c0fb3de7ee
          path: runtime
          fetch-depth: 1

      - name: Verify frozen runtime identities
        shell: bash
        run: |
          set -euo pipefail
          cd runtime
          test "$(git rev-parse HEAD)" = "$EXECUTION_CHECKOUT"
          echo "ac36409cd32c9a759a3e962ee6a86aa30d0a52299f2a19ccc8206d7b54e248ea  phase2/academic_transform/at0_en/v2_5/gate_b1/b1_aligner.py" | sha256sum -c -
          echo "7a3383e6108272b641e8f4bcda553a5d97aad7a873616341c3493d425fec6def  phase2/academic_transform/at0_en/v2_5/run_v2_5_batch.py" | sha256sum -c -
          echo "574d0c0a1222435069eee48534e2d4e04ca72f6d538bf3c5c334a683304bb6d2  phase2/academic_transform/at0_en/v2_5/run_v2_5_one_shot_guard.py" | sha256sum -c -
          echo "3b0698772630a17d6d05fdf7197f5faa79b22212332ae785b069318bda4cd5b0  phase2/academic_transform/at0_en/v2_4/pre_gate_c/factpico_h1_adapter_v5.py" | sha256sum -c -
          test -z "${ACAD_PASS_V25_SYNTHETIC_TEST_MODE:-}"
          test -z "${ACAD_PASS_V25_SYNTHETIC_FAULT_MAP:-}"

      - name: Verify canonical remote claim identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, urllib.request
          repo="abdullah-s-mahmood/sweet-runtime-parity"
          key=os.environ["LEDGER_KEY"]
          branch=os.environ["LEDGER_BRANCH"]
          token=os.environ["GH_TOKEN"]
          url=f"https://api.github.com/repos/{repo}/contents/{key}?ref={branch}"
          req=urllib.request.Request(url,headers={
              "Authorization":f"Bearer {token}",
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
          })
          with urllib.request.urlopen(req,timeout=30) as r:
              obj=json.load(r)
          payload=json.loads(base64.b64decode(obj["content"]).decode("utf-8"))
          expected={
              "authorization_id":os.environ["AUTHORIZATION_ID"],
              "runtime_id":"AT0-EN V2.5",
              "input_sha256":os.environ["INPUT_SHA"],
              "state":"CONSUMED_BEFORE_INFERENCE",
              "provider":"GitHub repository contents",
              "repository":repo,
              "branch":branch,
              "key":key,
              "execution_checkout":os.environ["EXECUTION_CHECKOUT"],
          }
          for k,v in expected.items():
              assert payload.get(k)==v,(k,payload.get(k),v)
          open("/tmp/REMOTE_CLAIM_BLOB_SHA.txt","w").write(obj["sha"]+"\n")
          print("REMOTE_CLAIM_READBACK=PASS")
          print("REMOTE_CLAIM_BLOB_SHA="+obj["sha"])
          PY

      - name: Download exact FactPICO source and rebuild frozen prediction input
        shell: bash
        run: |
          set -euo pipefail
          EXPECT_ZIP=ec260d7c69db9537f819fbdf728c997520e55de56b9f03b2980b017c91b9d4f4
          urls=(
            "https://utexas.box.com/shared/static/mpe5idxrqrzs1wcakphng7xfi7h4g83j.zip"
            "https://utexas.box.com/s/mpe5idxrqrzs1wcakphng7xfi7h4g83j?download=1"
            "https://utexas.box.com/s/mpe5idxrqrzs1wcakphng7xfi7h4g83j"
          )
          ok=0
          for u in "${urls[@]}"; do
            rm -f /tmp/FactPICO.zip
            if curl -fL --retry 2 --connect-timeout 20 --max-time 120 "$u" -o /tmp/FactPICO.zip; then
              got="$(sha256sum /tmp/FactPICO.zip | awk '{print $1}')"
              if [ "$got" = "$EXPECT_ZIP" ]; then ok=1; break; fi
            fi
          done
          test "$ok" = 1

          rm -rf /tmp/factpico_build
          python runtime/phase2/academic_transform/at0_en/v2_4/pre_gate_c/factpico_h1_adapter_v5.py \
            --factpico-zip /tmp/FactPICO.zip \
            --out-dir /tmp/factpico_build \
            > /tmp/adapter_stdout.json

          PRED=/tmp/factpico_build/FACTPICO_H1_V5_PREDICTION_INPUT_PRIVATE.jsonl
          echo "$INPUT_SHA  $PRED" | sha256sum -c -

          python - <<'PY'
          import hashlib,json,pathlib,os
          p=pathlib.Path("/tmp/factpico_build/FACTPICO_H1_V5_PREDICTION_INPUT_PRIVATE.jsonl")
          rows=[json.loads(x) for x in p.read_text(encoding="utf-8").splitlines() if x.strip()]
          assert len(rows)==345
          ids=[r["record_id"] for r in rows]
          assert len(set(ids))==345
          assert all(set(r)=={"record_id","source_text","candidate_text"} for r in rows)
          order_sha=hashlib.sha256(("\n".join(ids)+"\n").encode()).hexdigest()
          pathlib.Path("/tmp/INPUT_ORDER_SHA256.txt").write_text(order_sha+"\n")
          print("INPUT_COUNT_UNIQUE_ORDER_SCHEMA=PASS")
          print("INPUT_ORDER_SHA256="+order_sha)
          PY

      - name: Remove all gold and source artifacts before inference
        shell: bash
        run: |
          set -euo pipefail
          PRED=/tmp/factpico_build/FACTPICO_H1_V5_PREDICTION_INPUT_PRIVATE.jsonl
          cp "$PRED" /tmp/FACTPICO_H1_V5_PREDICTION_INPUT_PRIVATE.jsonl
          rm -rf /tmp/factpico_build
          rm -f /tmp/FactPICO.zip
          test -f /tmp/FACTPICO_H1_V5_PREDICTION_INPUT_PRIVATE.jsonl
          echo "$INPUT_SHA  /tmp/FACTPICO_H1_V5_PREDICTION_INPUT_PRIVATE.jsonl" | sha256sum -c -
          test ! -e /tmp/FactPICO.zip
          echo "GOLD_ELIGIBILITY_SOURCE_REMOVED_BEFORE_INFERENCE=PASS"

      - name: Invoke bound local one-shot guard exactly once
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/factpico_v25_attempt"
          python runtime/phase2/academic_transform/at0_en/v2_5/run_v2_5_one_shot_guard.py \
            --input /tmp/FACTPICO_H1_V5_PREDICTION_INPUT_PRIVATE.jsonl \
            --attempt-dir "$GITHUB_WORKSPACE/factpico_v25_attempt" \
            --attempt-id "$AUTHORIZATION_ID" \
            --runner runtime/phase2/academic_transform/at0_en/v2_5/run_v2_5_batch.py \
            --timeout-seconds 60 \
            --max-assertions-per-side 128 \
            --expected-input-sha256 "$INPUT_SHA" \
            --expected-count 345 \
            --authorization-id "$AUTHORIZATION_ID" \
            --durable-ledger-provider "$LEDGER_PROVIDER" \
            --durable-ledger-key "$LEDGER_KEY" \
            --durable-ledger-commit-sha "$CLAIM_COMMIT_SHA" \
            > "$GITHUB_WORKSPACE/ONE_SHOT_GUARD_STDOUT.txt"

      - name: Verify and freeze prediction artifact evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib
          inp=pathlib.Path("/tmp/FACTPICO_H1_V5_PREDICTION_INPUT_PRIVATE.jsonl")
          out=pathlib.Path(os.environ["GITHUB_WORKSPACE"])/"factpico_v25_attempt"/"FACTPICO_V25_PREDICTIONS.jsonl"
          ir=[json.loads(x) for x in inp.read_text(encoding="utf-8").splitlines() if x.strip()]
          pr=[json.loads(x) for x in out.read_text(encoding="utf-8").splitlines() if x.strip()]
          assert len(pr)==345
          iids=[x["record_id"] for x in ir]
          pids=[x["record_id"] for x in pr]
          assert pids==iids
          assert len(set(pids))==345
          outcomes={k:sum(x["predicted_outcome"]==k for x in pr) for k in ["PASS_CANDIDATE","REJECT","REVIEW","INVALID_VERIFICATION"]}
          pred_sha=hashlib.sha256(out.read_bytes()).hexdigest()
          evidence={
            "authorization_id":os.environ["AUTHORIZATION_ID"],
            "state":"PREDICTIONS_FROZEN",
            "execution_checkout":os.environ["EXECUTION_CHECKOUT"],
            "input_sha256":os.environ["INPUT_SHA"],
            "input_count":345,
            "output_count":len(pr),
            "unique_output_ids":len(set(pids)),
            "exact_id_order_match":True,
            "timeout_seconds_per_record":60,
            "max_assertions_per_side":128,
            "retry_count":0,
            "durable_ledger_provider":os.environ["LEDGER_PROVIDER"],
            "durable_ledger_key":os.environ["LEDGER_KEY"],
            "durable_ledger_claim_commit_sha":os.environ["CLAIM_COMMIT_SHA"],
            "durable_ledger_claim_blob_sha":pathlib.Path("/tmp/REMOTE_CLAIM_BLOB_SHA.txt").read_text().strip(),
            "prediction_sha256":pred_sha,
            "outcomes":outcomes,
            "gold_join_performed":False,
            "scoring_performed":False,
          }
          ep=pathlib.Path(os.environ["GITHUB_WORKSPACE"])/"factpico_v25_attempt"/"EXECUTION_EVIDENCE.json"
          ep.write_text(json.dumps(evidence,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(evidence,indent=2,sort_keys=True))
          PY
          cp /tmp/INPUT_ORDER_SHA256.txt "$GITHUB_WORKSPACE/factpico_v25_attempt/"
          cp "$GITHUB_WORKSPACE/ONE_SHOT_GUARD_STDOUT.txt" "$GITHUB_WORKSPACE/factpico_v25_attempt/"

      - name: Preserve failure evidence if consumed attempt aborts
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/factpico_v25_failure_evidence"
          cp -a "$GITHUB_WORKSPACE/factpico_v25_attempt" "$GITHUB_WORKSPACE/factpico_v25_failure_evidence/" 2>/dev/null
          cp "$GITHUB_WORKSPACE/ONE_SHOT_GUARD_STDOUT.txt" "$GITHUB_WORKSPACE/factpico_v25_failure_evidence/" 2>/dev/null
          cp /tmp/REMOTE_CLAIM_BLOB_SHA.txt "$GITHUB_WORKSPACE/factpico_v25_failure_evidence/" 2>/dev/null
          echo "$CLAIM_COMMIT_SHA" > "$GITHUB_WORKSPACE/factpico_v25_failure_evidence/CLAIM_COMMIT_SHA.txt"
          echo "ATTEMPT_CONSUMED_NO_RETRY=TRUE" > "$GITHUB_WORKSPACE/factpico_v25_failure_evidence/FAILURE_STATE.txt"

      - name: Upload frozen prediction evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: factpico-v25-one-shot-prediction-frozen
          path: factpico_v25_attempt/
          if-no-files-found: error
          retention-days: 90

      - name: Upload consumed-attempt failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: factpico-v25-one-shot-consumed-failure-evidence
          path: factpico_v25_failure_evidence/
          if-no-files-found: warn
          retention-days: 90
