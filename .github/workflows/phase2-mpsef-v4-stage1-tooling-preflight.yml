name: Phase 2 MP-SEF V4 Stage1 Tooling Preflight

on:
  push:
    branches:
      - phase2-arabic-eval
    paths:
      - ".github/workflows/phase2-mpsef-v4-stage1-tooling-preflight.yml"
      - ".github/workflows/phase2-mpsef-v4-stage1-v1.yml"
      - "phase2/redesign/mpsef_v4_build_stage1_packet_v1.py"
      - "phase2/redesign/mpsef_p2_v2_stage1_proposals_v1.py"
      - "phase2/redesign/mpsef_p3_v1_stage1_proposals_v1.py"
      - "phase2/redesign/mpsef_v4_stage1_legalizer_actions_v1.py"
      - "phase2/redesign/mpsef_v4_stage1_diversity_v1.py"
      - "phase2/redesign/mpsef_v4_build_stage1_registry_v1.py"
      - "phase2/redesign/mpsef_v4_stage1_tooling_selftest_v1.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling-preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install YAML parser
        run: |
          python -m pip install "PyYAML==6.0.2"

      - name: Validate Stage1 workflow orchestration
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          p=Path(".github/workflows/phase2-mpsef-v4-stage1-v1.yml")
          d=yaml.load(p.read_text(encoding="utf-8"),Loader=yaml.BaseLoader)
          assert isinstance(d,dict) and "jobs" in d and "on" in d
          jobs=d["jobs"]
          assert list(jobs)==["freeze","p2","p3","finalize"], list(jobs)
          assert jobs["p2"]["needs"]=="freeze"
          assert jobs["p3"]["needs"]=="p2"
          assert jobs["finalize"]["needs"]=="p3"
          trigger=d["on"]
          assert "push" in trigger and "workflow_dispatch" in trigger
          paths=trigger["push"]["paths"]
          assert paths==["phase2/redesign/MPSEF_V4_STAGE1_EXECUTION_AUTHORIZATION_V1.md"],paths
          text=p.read_text(encoding="utf-8")
          assert "project_gold_loaded" in text
          assert "r_joint_computed" in text
          print("V4_STAGE1_WORKFLOW_ORCHESTRATION_PASS")
          PY

      - name: Compile Stage1 tooling
        run: |
          python -m py_compile \
            phase2/redesign/mpsef_v4_build_stage1_packet_v1.py \
            phase2/redesign/mpsef_p2_v2_stage1_proposals_v1.py \
            phase2/redesign/mpsef_p3_v1_stage1_proposals_v1.py \
            phase2/redesign/mpsef_v4_stage1_legalizer_actions_v1.py \
            phase2/redesign/mpsef_v4_stage1_diversity_v1.py \
            phase2/redesign/mpsef_v4_build_stage1_registry_v1.py \
            phase2/redesign/mpsef_v4_stage1_tooling_selftest_v1.py

      - name: Run source-free integration self-test
        run: |
          set -o pipefail
          python phase2/redesign/mpsef_v4_stage1_tooling_selftest_v1.py \
            | tee MPSEF_V4_STAGE1_TOOLING_PREFLIGHT_RESULT.json

      - name: Validate source-free result
        run: |
          python - <<'PY'
          import json
          x=json.load(open("MPSEF_V4_STAGE1_TOOLING_PREFLIGHT_RESULT.json",encoding="utf-8"))
          assert x["status"]=="PASS"
          assert x["test_count"]>=6
          assert x["project_source_loaded"] is False
          assert x["project_gold_loaded"] is False
          assert x["quality_metric_computed"] is False
          assert x["r_joint_computed"] is False
          print("V4_STAGE1_TOOLING_PREFLIGHT_PASS")
          PY

      - name: Freeze hashes
        run: |
          sha256sum \
            phase2/redesign/mpsef_v4_build_stage1_packet_v1.py \
            phase2/redesign/mpsef_p2_v2_stage1_proposals_v1.py \
            phase2/redesign/mpsef_p3_v1_stage1_proposals_v1.py \
            phase2/redesign/mpsef_v4_stage1_legalizer_actions_v1.py \
            phase2/redesign/mpsef_v4_stage1_diversity_v1.py \
            phase2/redesign/mpsef_v4_build_stage1_registry_v1.py \
            phase2/redesign/mpsef_v4_stage1_tooling_selftest_v1.py \
            .github/workflows/phase2-mpsef-v4-stage1-tooling-preflight.yml \
            .github/workflows/phase2-mpsef-v4-stage1-v1.yml \
            MPSEF_V4_STAGE1_TOOLING_PREFLIGHT_RESULT.json \
            > MPSEF_V4_STAGE1_TOOLING_PREFLIGHT_SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mpsef-v4-stage1-tooling-preflight
          path: |
            MPSEF_V4_STAGE1_TOOLING_PREFLIGHT_RESULT.json
            MPSEF_V4_STAGE1_TOOLING_PREFLIGHT_SHA256.txt
          retention-days: 90
