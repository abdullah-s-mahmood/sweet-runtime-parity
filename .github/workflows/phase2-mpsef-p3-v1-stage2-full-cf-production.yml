name: Phase 2 MP-SEF P3 V1 Stage2 Full C_F Production

on:
  push:
    branches: [phase2-arabic-eval]
    paths:
      - "phase2/redesign/MPSEF_V4_STAGE2_P3_FULL_CF_AUTH_V1.json"

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  p3-full-cf:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Download Stage2 Input Lock
        uses: actions/download-artifact@v4
        with:
          name: mpsef-v4-stage2-input-lock-v1
          path: input_lock
          repository: abdullah-s-mahmood/sweet-runtime-parity
          run-id: 36898163047
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download frozen C_F and P1
        uses: actions/download-artifact@v4
        with:
          name: mpsef-p1-cf-proposals-v1
          path: p1
          repository: abdullah-s-mahmood/sweet-runtime-parity
          run-id: 36765798233
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download frozen P3 replay runtime lock
        uses: actions/download-artifact@v4
        with:
          name: mpsef-p3-v1-stage2-production-bound-parity32-v1
          path: p3_replay
          repository: abdullah-s-mahmood/sweet-runtime-parity
          run-id: 36897419883
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate execution authorization and locked files
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          auth=json.load(open("phase2/redesign/MPSEF_V4_STAGE2_P3_FULL_CF_AUTH_V1.json",encoding="utf-8"))
          lock=json.load(open("input_lock/MPSEF_V4_STAGE2_INPUT_LOCK_V1.json",encoding="utf-8"))
          assert auth["status"]=="AUTHORIZED"
          assert auth["input_lock_run_id"]==36898163047
          assert auth["input_lock_artifact_id"]==11180920946
          assert auth["input_lock_artifact_digest"]=="sha256:239395994cdf22bc7c6353de19601caab650dba7e24eedac91795ff453d87b2a"
          assert lock["status"]=="PASS" and lock["full_cf_execution_authorized_by_this_record"] is True
          assert "P3_V1_FULL_CF_SOURCE_ONLY_PROPOSALS" in lock["authorization_scope"]
          def sha(p):
              h=hashlib.sha256()
              with open(p,"rb") as f:
                  for c in iter(lambda:f.read(1024*1024),b""): h.update(c)
              return h.hexdigest()
          wf=".github/workflows/phase2-mpsef-p3-v1-stage2-full-cf-production.yml"
          assert sha(wf)==auth["workflow_sha256"]
          assert sha("phase2/redesign/mpsef_stage2_partial_accounting_v2.py")==auth["partial_accounting_v2_sha256"]
          assert sha("phase2/redesign/mpsef_p3_v1_stage2_production_adapter_v1.py")==auth["adapter_sha256"]
          assert sha("phase2/redesign/run_with_progress_watchdog_v2.py")==auth["watchdog_sha256"]
          assert sha("phase2/redesign/mpsef_stageb_change_domain_classifier_v1.py")==auth["stage_b_classifier_sha256"]
          for p,expected in lock["authoritative_file_sha256"].items():
              assert sha(p)==expected,(p,sha(p),expected)
          assert sha("p1/MPSEF_CF_SOURCE_MANIFEST_V1.jsonl")==lock["population"]["manifest_sha256"]
          assert sha("p1/MPSEF_P1_CF_PROPOSALS_V1.jsonl")==lock["frozen_p1"]["proposal_sha256"]
          assert sha("p3_replay/P3_STAGE2_PARITY32_PIP_FREEZE.txt")==lock["p3"]["runtime_freeze_sha256"]
          print("P3_FULL_CF_AUTH_AND_INPUT_LOCK_OK")
          PY

      - name: Install exact frozen P3 runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip<25"
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==1.12.1+cpu"
          python -m pip install "transformers==4.30.0" "huggingface_hub==0.16.4" "sentencepiece==0.1.99"
          python -m pip install "numpy==1.23.5" "pandas==1.5.3" "pyarrow==14.0.2" "datasets==2.14.7" "editdistance==0.8.1"

      - name: Clone frozen text-editing implementation
        run: |
          set -euo pipefail
          git clone https://github.com/CAMeL-Lab/text-editing.git upstream/text-editing
          git -C upstream/text-editing checkout 4d552ca3ae98029550f27fc52aa1b22883e16e61
          test "$(git -C upstream/text-editing rev-parse HEAD)" = "4d552ca3ae98029550f27fc52aa1b22883e16e61"

      - name: Download exact frozen Pnx revision
        run: |
          set -euo pipefail
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="CAMeL-Lab/text-editing-qalb14-pnx",
              revision="a162d77269ab6ff556d2c58c5dff8b967c1f649e",
              local_dir="pnx_model",
              local_dir_use_symlinks=False,
          )
          PY
          test "$(sha256sum pnx_model/pytorch_model.bin | awk '{print $1}')" = "d98d683f9ef1738c27f5031c99483d93e9f73c4116c158a97a678270c84fd262"

      - name: Verify byte-identical runtime lock
        run: |
          set -euo pipefail
          python -m pip freeze > P3_STAGE2_FULL_CF_PIP_FREEZE.txt
          test "$(sha256sum P3_STAGE2_FULL_CF_PIP_FREEZE.txt | awk '{print $1}')" = "7362974846661d8888c67eab4e8a1b80db924aa66ac4024a23afdf30d6a90865"

      - name: Run P3 full C_F through exact production CLI + Watchdog V2
        env:
          TOKENIZERS_PARALLELISM: "false"
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python phase2/redesign/run_with_progress_watchdog_v2.py             --state-file P3_STAGE2_FULL_CF_PROGRESS.json             --watchdog-state-file P3_STAGE2_FULL_CF_WATCHDOG.json             --context "acad-pass/p3-stage2-full-cf"             --poll-seconds 20 --publish-seconds 60 --stale-seconds 600             --term-grace-seconds 30 --kill-on-stale --             python phase2/redesign/mpsef_p3_v1_stage2_production_adapter_v1.py               --input-jsonl p1/MPSEF_CF_SOURCE_MANIFEST_V1.jsonl               --expected-count 1918               --expected-input-sha256 051516cdce384c5fe50afb2ce80fe12d8cd8fb65b06ba31c3209301f91a7e193               --p1-proposals p1/MPSEF_P1_CF_PROPOSALS_V1.jsonl               --pnx-model-dir pnx_model               --upstream-root upstream/text-editing               --batch-size 32               --out-jsonl MPSEF_P3_V1_STAGE2_FULL_CF_V1.jsonl               --run-state MPSEF_P3_V1_STAGE2_FULL_CF_RUN_STATE.json               --progress-state P3_STAGE2_FULL_CF_PROGRESS.json               --summary MPSEF_P3_V1_STAGE2_FULL_CF_V1_SUMMARY.json

      - name: Derive completed/aborted/not-attempted accounting V2
        if: always()
        run: |
          python phase2/redesign/mpsef_stage2_partial_accounting_v2.py             --input-jsonl p1/MPSEF_CF_SOURCE_MANIFEST_V1.jsonl             --output-jsonl MPSEF_P3_V1_STAGE2_FULL_CF_V1.jsonl             --run-state MPSEF_P3_V1_STAGE2_FULL_CF_RUN_STATE.json             --expected-count 1918             --out MPSEF_P3_V1_STAGE2_FULL_CF_ACCOUNTING_V2.json             | tee P3_STAGE2_FULL_CF_ACCOUNTING.log

      - name: Validate complete full-C_F result
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          rows=[json.loads(x) for x in open("MPSEF_P3_V1_STAGE2_FULL_CF_V1.jsonl",encoding="utf-8") if x.strip()]
          s=json.load(open("MPSEF_P3_V1_STAGE2_FULL_CF_V1_SUMMARY.json",encoding="utf-8"))
          a=json.load(open("MPSEF_P3_V1_STAGE2_FULL_CF_ACCOUNTING_V2.json",encoding="utf-8"))
          r=json.load(open("MPSEF_P3_V1_STAGE2_FULL_CF_RUN_STATE.json",encoding="utf-8"))
          assert len(rows)==1918==s["cases"]
          assert len({x["uid"] for x in rows})==1918
          assert len({x["cluster_id"] for x in rows})==764==s["clusters"]
          assert s["status"]=="COMPLETE"
          assert r["status"]=="COMPLETE"
          assert r["aborted_count"]==0 and r["not_attempted_count"]==0
          assert a["status"]=="COMPLETE"
          assert a["completed_count"]==1918 and a["aborted_count"]==0 and a["not_attempted_count"]==0
          assert a["completion_claim_allowed"] is True
          assert s["p1_rerun"] is False
          assert s["exact_frozen_p1_parent_reused"] is True
          assert s["gold_reference_consulted"] is False
          assert s["project_gold_loaded"] is False
          assert s["quality_metric_computed"] is False
          assert s["r_joint_computed"] is False
          assert s["selector_trained"] is False
          assert s["stage_b_classifier_version"]=="MPSEF_STAGEB_CHANGE_DOMAIN_CLASSIFIER_V1"
          print("P3_STAGE2_FULL_CF_COMPLETE_PASS")
          PY

      - name: Freeze final identities
        if: always()
        run: |
          sha256sum             phase2/redesign/mpsef_p3_v1_stage2_production_adapter_v1.py             phase2/redesign/run_with_progress_watchdog_v2.py             phase2/redesign/mpsef_stage2_partial_accounting_v2.py             phase2/redesign/mpsef_stageb_change_domain_classifier_v1.py             .github/workflows/phase2-mpsef-p3-v1-stage2-full-cf-production.yml             phase2/redesign/MPSEF_V4_STAGE2_P3_FULL_CF_AUTH_V1.json             input_lock/MPSEF_V4_STAGE2_INPUT_LOCK_V1.json             p1/MPSEF_CF_SOURCE_MANIFEST_V1.jsonl             p1/MPSEF_P1_CF_PROPOSALS_V1.jsonl             P3_STAGE2_FULL_CF_PIP_FREEZE.txt             MPSEF_P3_V1_STAGE2_FULL_CF_V1.jsonl             MPSEF_P3_V1_STAGE2_FULL_CF_V1_SUMMARY.json             MPSEF_P3_V1_STAGE2_FULL_CF_RUN_STATE.json             MPSEF_P3_V1_STAGE2_FULL_CF_ACCOUNTING_V2.json             > MPSEF_P3_V1_STAGE2_FULL_CF_SHA256.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mpsef-p3-v1-stage2-full-cf-v1
          path: |
            MPSEF_P3_V1_STAGE2_FULL_CF_V1.jsonl
            MPSEF_P3_V1_STAGE2_FULL_CF_V1_SUMMARY.json
            MPSEF_P3_V1_STAGE2_FULL_CF_RUN_STATE.json
            MPSEF_P3_V1_STAGE2_FULL_CF_ACCOUNTING_V2.json
            P3_STAGE2_FULL_CF_PROGRESS.json
            P3_STAGE2_FULL_CF_WATCHDOG.json
            P3_STAGE2_FULL_CF_ACCOUNTING.log
            P3_STAGE2_FULL_CF_PIP_FREEZE.txt
            MPSEF_P3_V1_STAGE2_FULL_CF_SHA256.txt
          if-no-files-found: warn
          retention-days: 90
