name: AT0 EN V2.6 R4.2B source-aligned witness train calibration

on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/r42b_source_aligned_train_trigger_v1.txt'

permissions:
  contents: read

concurrency:
  group: at0-en-v2-6-r4-2b-source-aligned-train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: at0-en-v2.6-dev
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install frozen safe runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet \
            numpy==1.26.4 \
            torch==2.2.2 \
            transformers==4.39.3 \
            accelerate==0.28.0 \
            seqeval==1.2.2 \
            safetensors==0.4.3 \
            huggingface_hub==0.25.2 \
            jax==0.4.25 \
            jaxlib==0.4.25 \
            flax==0.8.2

      - name: Acquire and verify frozen safe model and train/dev data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r42b/model" "$RUNNER_TEMP/r42b/data"
          python - <<'PY'
          import hashlib, os, pathlib, urllib.request
          from huggingface_hub import snapshot_download
          files={
            "flax_model.msgpack":"2048c0dca92fe54cf2bec6c36972511ca04e546060307098139b19221dd4e93f",
            "config.json":"56bab767c02bc792897638feb8addc06d483d9c73769a5f554bbabea1f5507a1",
            "tokenizer_config.json":"53b6f42b8b8daddbdc6d3532c324187a92b46c1602bd6e8d4ad5a413b4fc90e1",
            "vocab.txt":"7b36651908a88bc38bda41b728b2a598191e0d3b553cbacf7b1e5f026d5b5b9f",
            "LICENSE.md":"8542b3a65414366ae3228e8f1658e538ec95f9b8855599c9c6e36751d592be66",
          }
          root=pathlib.Path(snapshot_download(
              repo_id="microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract",
              revision="d673b8835373c6fa116d6d8006b33d48734e305d",
              allow_patterns=list(files),
              local_dir=os.path.join(os.environ["RUNNER_TEMP"],"r42b","model"),
              local_dir_use_symlinks=False,
          ))
          for name,sha in files.items():
              raw=(root/name).read_bytes()
              if hashlib.sha256(raw).hexdigest()!=sha:
                  raise SystemExit(f"model hash mismatch {name}")
          if (root/"pytorch_model.bin").exists():
              raise SystemExit("pickle model forbidden")
          data=[
            ("train.txt","data/EBM-NLPmod/fold1/train.txt","6491a57e5c8639e5bfc3c0326b8501869fccab655a1ed571b75a772dc1c70a5e"),
            ("dev.txt","data/EBM-NLPmod/fold1/dev.txt","3b12534fedec35660587e6a5084b0b8ff11267c1da4a2f5afe9aa16c4941340a"),
          ]
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"r42b"/"data"
          for local,path,sha in data:
              raw=urllib.request.urlopen(
                  "https://raw.githubusercontent.com/BIDS-Xu-Lab/section_specific_annotation_of_PICO/"
                  "bc4b878773192f38b2600ec830ca4208b82f7dc0/"+path,timeout=30
              ).read()
              if hashlib.sha256(raw).hexdigest()!=sha:
                  raise SystemExit(f"data hash mismatch {local}")
              (out/local).write_bytes(raw)
          PY

      - name: Freeze runtime and source-aligned trainer identity
        shell: bash
        run: |
          set -euo pipefail
          python -V > "$RUNNER_TEMP/r42b/RUNTIME.txt"
          python -m pip freeze | sort >> "$RUNNER_TEMP/r42b/RUNTIME.txt"
          sha256sum phase2/academic_transform/at0_en/v2_6/r4_2b_source_aligned_train_calibrate_witness.py \
            > "$RUNNER_TEMP/r42b/TRAINER_SHA256.txt"

      - name: Train fixed 10 epochs and calibrate on frozen dev
        id: train_and_calibrate
        shell: bash
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          TOKENIZERS_PARALLELISM: "false"
          PYTHONHASHSEED: "42"
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python phase2/academic_transform/at0_en/v2_6/r4_2b_source_aligned_train_calibrate_witness.py \
            --model-dir "$RUNNER_TEMP/r42b/model" \
            --train "$RUNNER_TEMP/r42b/data/train.txt" \
            --dev "$RUNNER_TEMP/r42b/data/dev.txt" \
            --out "$RUNNER_TEMP/r42b/out" \
            > "$RUNNER_TEMP/r42b/TRAIN_STDOUT.json"

      - name: Finalize process status
        if: always()
        shell: bash
        env:
          TRAIN_STEP_OUTCOME: ${{ steps.train_and_calibrate.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime, json, os, pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"r42b"/"out"/"PROCESS_STATUS.json"
          if not p.exists():
              raise SystemExit(0)
          try:
              d=json.loads(p.read_text(encoding="utf-8"))
          except Exception:
              d={}
          outcome=os.environ.get("TRAIN_STEP_OUTCOME","")
          if d.get("state") in (None,"RUNNING","TRAINING_COMPLETED"):
              if outcome=="cancelled":
                  d["state"]="CANCELLED_OR_TIMEOUT"
                  d["current_stage"]="TRAINING_INTERRUPTED"
                  d["failure_or_stall_reason"]="GITHUB_ACTIONS_STEP_CANCELLED_OR_JOB_TIMEOUT"
              elif outcome=="failure":
                  d["state"]="FAILED"
                  d["current_stage"]="TRAIN_OR_CALIBRATION_FAILED"
                  d["failure_or_stall_reason"]="TRAIN_STEP_RETURNED_FAILURE"
          d["terminal_observed_at"]=datetime.datetime.now(datetime.timezone.utc).isoformat()
          d["github_train_step_outcome"]=outcome
          d["github_job_status"]=os.environ.get("JOB_STATUS")
          tmp=p.with_suffix(".tmp")
          tmp.write_text(json.dumps(d,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          tmp.replace(p)
          print(json.dumps(d,sort_keys=True),flush=True)
          PY

      - name: Hash frozen outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/r42b/out" ]; then
            find "$RUNNER_TEMP/r42b/out" -type f -print0 | sort -z | xargs -0 sha256sum \
              > "$RUNNER_TEMP/r42b/OUTPUT_SHA256.txt" || true
          fi

      - name: Upload source-aligned training evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: at0-en-v2-6-r4-2b-source-aligned-train-calibration
          path: |
            ${{ runner.temp }}/r42b/RUNTIME.txt
            ${{ runner.temp }}/r42b/TRAINER_SHA256.txt
            ${{ runner.temp }}/r42b/TRAIN_STDOUT.json
            ${{ runner.temp }}/r42b/OUTPUT_SHA256.txt
            ${{ runner.temp }}/r42b/out/PROCESS_STATUS.json
            ${{ runner.temp }}/r42b/out/trainer/checkpoint-*/trainer_state.json
            ${{ runner.temp }}/r42b/out/R4_2B_SOURCE_ALIGNED_TRAIN_CALIBRATION_SUMMARY.json
            ${{ runner.temp }}/r42b/out/selected_model
          if-no-files-found: warn
          retention-days: 90
