name: Phase 2 M2-H Software Feasibility Preflight v2

on:
  workflow_dispatch:
  push:
    branches: [phase2-arabic-eval]
    paths:
      - ".github/workflows/phase2-m2h-software-preflight-v2.yml"
      - "phase2/redesign/M2H_ENVIRONMENT_DECISION.md"

permissions:
  contents: read

jobs:
  h1:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install H1 reproduction stack
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==1.12.1+cpu"
          python -m pip install "transformers==4.30.0" "huggingface_hub==0.16.4" "sentencepiece==0.1.99"
      - name: H1 model resolve/hash/smoke
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,subprocess,sys
          from huggingface_hub import HfApi,snapshot_download
          from transformers import AutoTokenizer,AutoModelForTokenClassification
          import torch
          mid="CAMeL-Lab/text-editing-qalb14-nopnx"
          rev=HfApi().model_info(mid).sha
          root=pathlib.Path(snapshot_download(repo_id=mid,revision=rev,local_dir="h1_model",local_dir_use_symlinks=False))
          def sh(p):
              h=hashlib.sha256()
              with open(p,"rb") as f:
                  for c in iter(lambda:f.read(1048576),b""): h.update(c)
              return h.hexdigest()
          files=[{"path":str(p.relative_to(root)),"bytes":p.stat().st_size,"sha256":sh(p)} for p in sorted(root.rglob("*")) if p.is_file()]
          tok=AutoTokenizer.from_pretrained(root)
          model=AutoModelForTokenClassification.from_pretrained(root)
          enc=tok("هذا اختبار عربي بسيط",return_tensors="pt")
          with torch.no_grad(): out=model(**enc)
          freeze=subprocess.check_output([sys.executable,"-m","pip","freeze"],text=True)
          pathlib.Path("h1_freeze.txt").write_text(freeze)
          result={"component":"H1","status":"PASS","model_id":mid,"revision":rev,"files":files,
                  "smoke":{"input_shape":list(enc["input_ids"].shape),"logits_shape":list(out.logits.shape)},
                  "pip_freeze_sha256":hashlib.sha256(freeze.encode()).hexdigest()}
          pathlib.Path("h1_preflight.json").write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps({"status":"PASS","revision":rev,"file_count":len(files)}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m2h-h1-preflight-v2
          path: |
            h1_preflight.json
            h1_freeze.txt

  h3:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install current frozen CAMeL Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/CAMeL-Lab/camel_tools.git@be79ca9fc493f0df795375a7255bafef246a802d"
      - name: Install MSA morphology data
        run: camel_data -i morphology-db-msa-r13
      - name: H3 morphology hash/smoke
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys
          from camel_tools.morphology.database import MorphologyDB
          from camel_tools.morphology.analyzer import Analyzer
          db=MorphologyDB.builtin_db("calima-msa-r13")
          an=Analyzer(db)
          words=["والكتاب","بالمدرسة","كتاب"]
          counts={w:len(an.analyze(w)) for w in words}
          root=pathlib.Path(os.environ.get("CAMELTOOLS_DATA",pathlib.Path.home()/".camel_tools"))
          def sh(p):
              h=hashlib.sha256()
              with open(p,"rb") as f:
                  for c in iter(lambda:f.read(1048576),b""): h.update(c)
              return h.hexdigest()
          files=[{"path":str(p.relative_to(root)),"bytes":p.stat().st_size,"sha256":sh(p)} for p in sorted(root.rglob("*")) if p.is_file()]
          freeze=subprocess.check_output([sys.executable,"-m","pip","freeze"],text=True)
          pathlib.Path("h3_freeze.txt").write_text(freeze)
          result={"component":"H3","status":"PASS" if all(v>0 for v in counts.values()) else "FAIL",
                  "camel_tools_git_sha":"be79ca9fc493f0df795375a7255bafef246a802d",
                  "analysis_counts":counts,"data_files":files,
                  "pip_freeze_sha256":hashlib.sha256(freeze.encode()).hexdigest()}
          pathlib.Path("h3_preflight.json").write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps({"status":result["status"],"file_count":len(files),"analysis_counts":counts},ensure_ascii=False))
          if result["status"]!="PASS": raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m2h-h3-preflight-v2
          path: |
            h3_preflight.json
            h3_freeze.txt
