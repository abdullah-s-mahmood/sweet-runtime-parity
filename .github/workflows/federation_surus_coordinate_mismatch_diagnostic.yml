name: Federation SURUS coordinate mismatch diagnostic
on:
  push:
    branches: [at0-en-v2.6-dev]
    paths:
      - '.github/diagnostics/federation_surus_coordinate_mismatch_trigger.txt'
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1, path: project}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: surus-ai/dataset
          ref: 3a61790d5c304dea95fb278f76cc3b1a0ca07564
          path: surus
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.16'}
      - run: |
          mkdir -p "$RUNNER_TEMP/surusdiag"
          python project/phase2/academic_transform/at0_en/v2_6/federation_surus_coordinate_mismatch_diagnostic.py --root surus --out "$RUNNER_TEMP/surusdiag/SURUS_COORDINATE_MISMATCH_DIAGNOSTIC.json"
          sha256sum project/phase2/academic_transform/at0_en/v2_6/federation_surus_coordinate_mismatch_diagnostic.py > "$RUNNER_TEMP/surusdiag/SOURCE_SHA256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: federation-surus-coordinate-mismatch-diagnostic
          path: ${{ runner.temp }}/surusdiag
          if-no-files-found: error
          retention-days: 90
